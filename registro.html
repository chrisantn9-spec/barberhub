<!DOCTYPE html>
<html lang="es">
<head>
  <!-- ... tus metas y estilos ... -->
  
  <!-- 🔥 1. Cargar Supabase CDN PRIMERO -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- ... tu formulario de registro ... -->
  
  <!--  2. Luego config.js -->
  <script src="config.js"></script>
  
  <!--  3. Finalmente tu lógica -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Verificar que supabaseClient existe
      if (!window.supabaseClient) {
        console.error('❌ supabaseClient no está definido');
        alert('Error de configuración. Recarga la página.');
        return;
      }
      
      console.log('✅ Supabase listo para registrar');
      
      // Tu lógica de registro aquí
      document.getElementById('registro-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const { data, error } = await supabaseClient.auth.signUp({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            options: { data: { nombre: document.getElementById('nombre').value } }
          });
          
          if (error) throw error;
          alert('✅ Registro exitoso. Revisa tu email.');
        } catch (err) {
          alert('❌ Error: ' + err.message);
        }
      });
    });
  </script>
</body>
</html>
        
        <!-- 🔵 GOOGLE LOGIN BUTTON (NUEVO) -->
        <button onclick="signInWithGoogle()" style="width:100%; padding:12px; margin-bottom:15px; background:rgba(255,255,255,0.05); border:1px solid #db4437; border-radius:8px; color:#fff; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:all 0.2s;">
            <i class="fab fa-google" style="color:#db4437; font-size:1.2rem;"></i>
            Continuar con Google
        </button>
        <div style="text-align:center; margin:10px 0; color:#666; font-size:0.85rem;">─ O regístrate con email ─</div>

        <!-- Selector de tipo de usuario -->
        <div style="display:flex; gap:10px; margin-bottom:20px; background:rgba(0,0,0,0.4); padding:5px; border-radius:8px;">
            <button type="button" id="btn-barbero" onclick="setRole('barbero')" style="flex:1; padding:10px; background:rgba(100,100,100,0.3); color:#ccc; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">💈 Barbero</button>
            <button type="button" id="btn-cliente" onclick="setRole('cliente')" style="flex:1; padding:10px; background:var(--neon-cyan); color:#000; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">👤 Cliente</button>
        </div>

        <form id="registro-form">
            <!-- Campos COMUNES -->
            <input type="email" id="email" placeholder="📧 Correo Electrónico" required style="width:100%; padding:12px; margin:8px 0; background:rgba(0,0,0,0.6); border:1px solid #444; color:#fff; border-radius:5px; box-sizing:border-box;">
            <input type="password" id="password" placeholder="🔑 Contraseña (mín 6 caracteres)" required minlength="6" style="width:100%; padding:12px; margin:8px 0; background:rgba(0,0,0,0.6); border:1px solid #444; color:#fff; border-radius:5px; box-sizing:border-box;">
            <input type="text" id="nombre" placeholder="👤 Tu Nombre" required style="width:100%; padding:12px; margin:8px 0; background:rgba(0,0,0,0.6); border:1px solid #444; color:#fff; border-radius:5px; box-sizing:border-box;">
            
            <!-- 📱 TELÉFONO CON SELECTOR DE PAÍSES (OBLIGATORIO) -->
            <label style="color:#fff; font-size:0.9rem; margin:8px 0 4px; display:block;">
                📱 Teléfono <span style="color:var(--neon-pink);">*</span>
            </label>
            <input type="tel" id="telefono" placeholder="+34 612 345 678" required style="width:100%; padding:12px 12px 12px 52px; background:rgba(0,0,0,0.6); border:1px solid #444; color:#fff; border-radius:5px; box-sizing:border-box;">
            <small style="color:#888; font-size:0.75rem; display:block; margin-bottom:8px;">
                <i class="fas fa-info-circle"></i> Selecciona tu país e ingresa tu número
            </small>

            <!-- Campos SOLO PARA BARBERO -->
            <div id="campos-barbero" style="display:none; margin-top:15px; padding-top:15px; border-top:1px dashed #444;">
                <input type="text" id="barberia-name" placeholder="✂️ Nombre de tu Barbería" style="width:100%; padding:12px; margin:8px 0; background:rgba(0,0,0,0.6); border:1px solid var(--neon-cyan); color:#fff; border-radius:5px; box-sizing:border-box;">
                <input type="text" id="location" placeholder="📍 Dirección del Local (Calle/Barrio)" style="width:100%; padding:12px; margin:8px 0; background:rgba(0,0,0,0.6); border:1px solid var(--neon-cyan); color:#fff; border-radius:5px; box-sizing:border-box;">
                
                <!-- 🛰️ BOTÓN GPS -->
                <button type="button" onclick="getLocalCoords()" style="width:100%; padding:8px; background:transparent; border:1px dashed var(--neon-cyan); color:var(--neon-cyan); border-radius:4px; cursor:pointer; margin:5px 0;">📍 Detectar Ubicación del LOCAL (GPS)</button>
                <input type="hidden" id="shop-lat">
                <input type="hidden" id="shop-lng">
                <p id="geo-status" style="font-size:0.7rem; color:#888; text-align:center;"></p>

                <!-- 📷 SUBIR FOTO DEL LOCAL -->
                <label style="display:block; width:100%; padding:10px; background:rgba(0,242,255,0.1); border:1px dashed var(--neon-cyan); color:var(--neon-cyan); text-align:center; border-radius:6px; cursor:pointer; margin:10px 0; font-size:0.9rem;">
                    📸 Subir Foto de la Fachada
                    <input type="file" id="barber-photo-input" accept="image/*" style="display:none;" onchange="uploadBarberPhoto(this)">
                </label>
                <input type="hidden" id="barber-photo-url">
                <div id="photo-preview" style="margin-top:5px; text-align:center;"></div>
            </div>

            <button type="submit" id="btn-registro" style="width:100%; padding:12px; background:var(--neon-pink); color:#fff; font-weight:bold; border:none; border-radius:5px; cursor:pointer; margin-top:20px; font-size:1rem;">CREAR CUENTA</button>
            <p id="registro-msg" style="font-size:0.85rem; margin-top:10px; display:none; text-align:center;"></p>
        </form>

        <div style="margin-top:20px; text-align:center; padding-top:20px; border-top:1px solid #333;">
            <a href="auth.html" style="color:var(--neon-cyan); text-decoration:none;">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        let userRole = 'cliente';
        let phoneInputInstance = null;

        // Inicializar selector de países
        document.addEventListener('DOMContentLoaded', function() {
            const phoneInput = document.getElementById('telefono');
            if (phoneInput && typeof intlTelInput !== 'undefined') {
                phoneInputInstance = intlTelInput(phoneInput, {
                    initialCountry: "auto",
                    geoIpLookup: function(callback) {
                        fetch('https://ipapi.co/json')
                            .then(res => res.json())
                            .then(data => callback(data.country_code))
                            .catch(() => callback("es"));
                    },
                    preferredCountries: ["es", "mx", "co", "ar", "us"],
                    separateDialCode: true,
                    utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/utils.js"
                });
            }
        });

        function setRole(role) {
            userRole = role;
            const btnBarbero = document.getElementById('btn-barbero');
            const btnCliente = document.getElementById('btn-cliente');
            const camposBarbero = document.getElementById('campos-barbero');

            if (role === 'barbero') {
                btnBarbero.style.background = 'var(--neon-cyan)';
                btnBarbero.style.color = '#000';
                btnCliente.style.background = 'rgba(100,100,100,0.3)';
                btnCliente.style.color = '#ccc';
                camposBarbero.style.display = 'block';
            } else {
                btnCliente.style.background = 'var(--neon-cyan)';
                btnCliente.style.color = '#000';
                btnBarbero.style.background = 'rgba(100,100,100,0.3)';
                btnBarbero.style.color = '#ccc';
                camposBarbero.style.display = 'none';
            }
        }

        // 🔵 Google Sign In Function (NUEVA)
        async function signInWithGoogle() {
            try {
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: { 
                        redirectTo: window.location.origin + '/registro.html?role=' + userRole 
                    }
                });
                if (error) throw error;
            } catch (err) {
                const msg = document.getElementById('registro-msg');
                msg.style.color = '#ff3333';
                msg.textContent = '❌ Error con Google: ' + err.message;
                msg.style.display = 'block';
            }
        }

        // 🛰️ GPS
        function getLocalCoords() {
            const status = document.getElementById('geo-status');
            if (navigator.geolocation) {
                status.textContent = "📡 Buscando señal GPS...";
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById('shop-lat').value = position.coords.latitude;
                        document.getElementById('shop-lng').value = position.coords.longitude;
                        status.textContent = "✅ Ubicación del LOCAL guardada";
                        status.style.color = "#00ff88";
                    },
                    () => {
                        status.textContent = "❌ Error: Activa el GPS.";
                        status.style.color = "#ff3333";
                    }
                );
            }
        }

        // 📷 SUBIR FOTO
        async function uploadBarberPhoto(input) {
            const file = input.files[0];
            if (!file) return;

            const preview = document.getElementById('photo-preview');
            preview.textContent = '⏳ Subiendo imagen...';

            if (file.size > 2 * 1024 * 1024) {
                preview.textContent = '❌ La foto debe pesar menos de 2MB';
                return;
            }

            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}.${fileExt}`;
            const filePath = `shops/${fileName}`;

            const { data, error } = await supabaseClient.storage
                .from('barber-photos')
                .upload(filePath, file);

            if (error) {
                preview.textContent = '❌ ' + error.message;
                return;
            }

            const { data: { publicUrl } } = supabaseClient.storage
                .from('barber-photos')
                .getPublicUrl(filePath);

            document.getElementById('barber-photo-url').value = publicUrl;
            preview.innerHTML = `<img src="${publicUrl}" style="width:100%; max-height:120px; object-fit:cover; border-radius:6px; border:1px solid var(--neon-cyan);">`;
        }

        // ✅ SUBMIT DEL FORMULARIO
        document.getElementById('registro-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-registro');
            const msg = document.getElementById('registro-msg');
            
            btn.disabled = true;
            btn.textContent = 'Creando cuenta...';
            msg.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const nombre = document.getElementById('nombre').value;
            
            let telefono = '';
            if (phoneInputInstance) {
                telefono = phoneInputInstance.getNumber();
            } else {
                telefono = document.getElementById('telefono').value.replace(/[\s\-\(\)]/g, '');
            }

            if (!telefono.startsWith('+') || telefono.length < 10) {
                msg.style.color = '#ffaa00';
                msg.textContent = '⚠️ Ingresa un teléfono válido con código de país (ej: +34...)';
                msg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'CREAR CUENTA';
                return;
            }

            try {
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: { 
                        data: { 
                            nombre, 
                            telefono,
                            role: userRole 
                        } 
                    }
                });

                if (authError) throw authError;

                if (userRole === 'barbero') {
                    const barberiaName = document.getElementById('barberia-name').value || nombre;
                    const location = document.getElementById('location').value || 'Sin ubicación';
                    const lat = parseFloat(document.getElementById('shop-lat').value) || 0;
                    const lng = parseFloat(document.getElementById('shop-lng').value) || 0;
                    const photoUrl = document.getElementById('barber-photo-url').value;
                    
                    const photosArray = photoUrl ? JSON.stringify([photoUrl]) : null;

                    const { error: barberError } = await supabaseClient.from('barbers').insert([{
                        owner_id: authData.user.id,
                        name: barberiaName,
                        location: location,
                        phone: telefono,
                        lat: lat,
                        lng: lng,
                        photos: photosArray,
                        created_at: new Date().toISOString()
                    }]);

                    if (barberError) throw barberError;
                }

                msg.style.color = '#00ff88';
                msg.textContent = '✅ Cuenta creada. Redirigiendo...';
                msg.style.display = 'block';
                setTimeout(() => window.location.href = 'auth.html', 2000);

            } catch (err) {
                msg.style.color = '#ff3333';
                msg.textContent = '❌ ' + err.message;
                msg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'CREAR CUENTA';
            }
        });

        setRole('cliente');
    </script>
</body>
</html>

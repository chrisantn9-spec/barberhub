<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | BarberHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --neon-cyan: #00E5EE; --neon-pink: #ff00ff; --dark-bg: #050505; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: var(--dark-bg); font-family: 'Inter', sans-serif; color: #fff; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: rgba(15,15,25,0.9); backdrop-filter: blur(20px); border: 2px solid var(--neon-cyan); border-radius: 20px; padding: 35px 25px; max-width: 450px; width: 100%; box-shadow: 0 0 40px rgba(0,229,238,0.3); text-align: center; }
    .brand { font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px; }
    .brand .b { color: #fff; } .brand .h { color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan); }
    .subtitle { color: #aaa; margin-bottom: 20px; font-size: 0.95rem; }
    .role-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); }
    .role-btn { padding: 18px 10px; border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; background: rgba(255,255,255,0.03); color: #fff; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .role-btn:hover, .role-btn.active { border-color: var(--neon-cyan); background: rgba(0,229,238,0.1); box-shadow: 0 0 20px rgba(0,229,238,0.3); transform: translateY(-2px); }
    .role-btn i { font-size: 1.8rem; color: var(--neon-cyan); }
    .role-btn span { font-weight: 700; }
    .role-btn small { color: #888; font-size: 0.75rem; }
    .input-group { margin-bottom: 12px; }
    .input-group input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; font-size: 1rem; }
    .input-group input:focus { border-color: var(--neon-cyan); outline: none; box-shadow: 0 0 15px rgba(0,229,238,0.3); }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
    .btn-primary { background: var(--neon-cyan); color: #000; }
    .btn-primary:hover { background: #fff; box-shadow: 0 0 25px rgba(255,255,255,0.6); transform: translateY(-2px); }
    .btn-google { background: transparent; border: 2px solid var(--neon-pink); color: var(--neon-pink); display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-google:hover { background: rgba(255,0,255,0.1); box-shadow: 0 0 20px rgba(255,0,255,0.4); }
    .divider { margin: 15px 0; border: 0; border-top: 1px solid rgba(255,255,255,0.1); position: relative; }
    .divider span { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: rgba(15,15,25,0.9); padding: 0 10px; color: #888; font-size: 0.8rem; }
    .login-link { margin-top: 15px; font-size: 0.9rem; color: #888; }
    .login-link a { color: var(--neon-cyan); text-decoration: none; }
    #msg { margin-top: 10px; padding: 10px; border-radius: 8px; font-size: 0.9rem; display: none; }
    #msg.err { background: rgba(255,68,68,0.15); color: #ff4444; border: 1px solid #ff4444; }
    #msg.ok { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid #00ff88; }
    @media (max-width: 480px) { .role-selector { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="brand"><span class="b">BARBER</span><span class="h">HUB</span></h1>
    <p class="subtitle">Crea tu cuenta gratis • Elige tu tipo</p>
    <div class="role-selector">
      <button type="button" class="role-btn active" id="btn-cliente" onclick="setRole('cliente')"><i class="fas fa-user"></i><span>Cliente</span><small>Reservar citas</small></button>
      <button type="button" class="role-btn" id="btn-barbero" onclick="setRole('barbero')"><i class="fas fa-scissors"></i><span>Barbero</span><small>Gestionar barbería</small></button>
    </div>
    <form id="register-form">
      <div class="input-group"><input type="text" id="nombre" placeholder="Nombre completo" required></div>
      <div class="input-group"><input type="email" id="email" placeholder="tu@email.com" required></div>
      <div class="input-group"><input type="password" id="password" placeholder="Contraseña (mín. 6)" minlength="6" required></div>
      <button type="submit" class="btn btn-primary" id="btn-register"><i class="fas fa-user-plus"></i> CREAR CUENTA</button>
      <div id="msg"></div>
    </form>
    <hr class="divider"><span>O REGÍSTRATE CON</span>
    <button onclick="registerGoogle()" class="btn btn-google"><i class="fab fa-google"></i> Google</button>
    <div class="login-link">¿Ya tienes cuenta? <a href="auth.html">Inicia sesión</a></div>
  </div>

  <script src="config.js"></script>
  <script>
    let selectedRole = 'cliente';
    window.setRole = r => { selectedRole = r; document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active')); document.getElementById('btn-'+r).classList.add('active'); };
    document.getElementById('register-form').addEventListener('submit', async e => {
      e.preventDefault();
      const msg = document.getElementById('msg'), btn = document.getElementById('btn-register');
      const nombre = document.getElementById('nombre').value.trim(), email = document.getElementById('email').value.trim(), pass = document.getElementById('password').value;
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creando...'; msg.style.display = 'none';
      try {
        const { data, error } = await supabaseClient.auth.signUp({ email, password: pass, options: { data: { nombre, role: selectedRole } } });
        if (error) throw error;
        if (selectedRole === 'barbero') await supabaseClient.from('barbers').insert([{ owner_id: data.user.id, name: nombre+"'s Barbería", location: 'Sin dirección', phone: '', lat: 0, lng: 0 }]);
        msg.textContent = '✅ Cuenta creada. Inicia sesión...'; msg.className = 'ok'; msg.style.display = 'block';
        setTimeout(() => window.location.href = 'auth.html', 2000);
      } catch (err) {
        msg.textContent = '❌ ' + err.message; msg.className = 'err'; msg.style.display = 'block';
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus"></i> CREAR CUENTA';
      }
    });
    window.registerGoogle = async () => { try { await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/index.html' } }); } catch (err) { alert('❌ ' + err.message); } };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - BarberHub</title>
  <!-- 1. Cargar Supabase CDN PRIMERO -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body { background: #0a0a1a; color: #fff; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin:0; }
    form { background: #111; padding: 30px; border-radius: 12px; border: 1px solid #00f2ff; width: 100%; max-width: 350px; }
    h2 { text-align:center; color:#00f2ff; margin-top:0; }
    input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; font-size:1rem; }
    button { width: 100%; padding: 12px; background: #00f2ff; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size:1rem; }
    button:disabled { opacity:0.6; cursor:not-allowed; }
    .msg { margin-top: 15px; text-align: center; font-size: 0.9rem; min-height:20px; }
    .link { text-align:center; margin-top:15px; font-size:0.85rem; }
    .link a { color:#00f2ff; text-decoration:none; }
  </style>
</head>
<body>
  <form id="registro-form">
    <h2>✨ Crear Cuenta</h2>
    <input type="email" id="email" placeholder="📧 Email" required>
    <input type="password" id="password" placeholder="🔑 Contraseña (mín 6)" required minlength="6">
    <input type="text" id="nombre" placeholder="👤 Tu Nombre" required>
    <button type="submit" id="btn">REGISTRARSE</button>
    <div id="msg" class="msg"></div>
    <div class="link"><a href="auth.html">¿Ya tienes cuenta? Inicia sesión</a></div>
  </form>

  <!-- 2. Cargar config.js -->
  <script src="config.js"></script>
  
  <!-- 3. Lógica simple de registro -->
  <script>
    document.getElementById('registro-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      
      // 🔍 Verificación crítica: ¿Cargó supabaseClient?
      if (!window.supabaseClient) {
        msg.style.color = 'red';
        msg.textContent = '❌ ERROR: config.js no cargó o la API Key está vacía.';
        console.error('supabaseClient es undefined');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creando cuenta...';
      msg.textContent = '';

      try {
        const { data, error } = await window.supabaseClient.auth.signUp({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          options: { data: { nombre: document.getElementById('nombre').value } }
        });

        if (error) throw error;

        msg.style.color = '#00ff88';
        msg.textContent = '✅ Cuenta creada. Redirigiendo...';
        setTimeout(() => window.location.href = 'auth.html', 2000);
      } catch (err) {
        msg.style.color = 'red';
        msg.textContent = '❌ ' + err.message;
        btn.disabled = false;
        btn.textContent = 'REGISTRARSE';
        console.error('Error registro:', err);
      }
    });
  </script>
</body>
</html>

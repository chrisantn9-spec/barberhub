<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Contraseña - BarberHub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:linear-gradient(180deg,#050505,#0a0a1a); min-height:100vh; color:#fff; font-family:system-ui,sans-serif; display:flex; justify-content:center; align-items:center; padding:20px; }
    .card { background:rgba(15,15,25,0.9); border:1px solid #00f2ff; border-radius:16px; padding:24px; width:100%; max-width:380px; box-shadow:0 0 20px rgba(0,242,255,0.15); }
    h2 { text-align:center; color:#00f2ff; margin-bottom:15px; }
    input { width:100%; padding:12px; margin:8px 0; background:rgba(0,0,0,0.5); border:1px solid #444; border-radius:8px; color:#fff; font-size:1rem; }
    input:focus { outline:none; border-color:#00f2ff; }
    .btn-submit { width:100%; padding:14px; background:linear-gradient(135deg,#00f2ff,#00a3ff); border:none; border-radius:8px; color:#000; font-weight:bold; cursor:pointer; margin-top:15px; font-size:1rem; }
    .btn-submit:disabled { opacity:0.5; cursor:not-allowed; }
    .msg { margin-top:12px; padding:10px; border-radius:6px; text-align:center; display:none; font-size:0.9rem; }
    .msg.ok { background:rgba(0,255,136,0.15); color:#00ff88; border:1px solid #00ff88; }
    .msg.err { background:rgba(255,68,68,0.15); color:#ff4444; border:1px solid #ff4444; }
    .loading { text-align:center; color:#888; padding:20px; }
  </style>
</head>
<body>
  <div class="card" id="main-card" style="display:none;">
    <h2>🔒 Nueva Contraseña</h2>
    <form id="update-form">
      <input type="password" id="new-pass" placeholder="🔑 Nueva contraseña (mín 6)" required minlength="6">
      <input type="password" id="confirm-pass" placeholder="🔒 Confirmar contraseña" required>
      <button type="submit" class="btn-submit" id="btn">ACTUALIZAR CONTRASEÑA</button>
      <div id="msg" class="msg"></div>
    </form>
  </div>
  <div id="loading" class="loading">Verificando enlace de recuperación...</div>

  <script src="config.js"></script>
  <script>
    (async () => {
      const mainCard = document.getElementById('main-card');
      const loading = document.getElementById('loading');
      
      // Supabase detecta automáticamente el token de recuperación en la URL
      const { data: { session }, error } = await window.supabaseClient.auth.getSession();
      
      if (error || !session) {
        loading.innerHTML = '❌ Enlace inválido o expirado.<br><a href="recuperar-password.html" style="color:#00f2ff;">Solicitar nuevo enlace</a>';
        return;
      }
      
      // Si hay sesión de recuperación, mostrar formulario
      loading.style.display = 'none';
      mainCard.style.display = 'block';
      
      document.getElementById('update-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn');
        const msg = document.getElementById('msg');
        const pass1 = document.getElementById('new-pass').value;
        const pass2 = document.getElementById('confirm-pass').value;
        
        if (pass1 !== pass2) {
          msg.textContent = '❌ Las contraseñas no coinciden';
          msg.className = 'msg err'; msg.style.display = 'block';
          return;
        }
        
        btn.disabled = true; btn.textContent = 'Actualizando...'; msg.style.display = 'none';
        
        try {
          const { error } = await window.supabaseClient.auth.updateUser({ password: pass1 });
          if (error) throw error;
          
          await window.supabaseClient.auth.signOut();
          msg.textContent = '✅ Contraseña actualizada. Redirigiendo...';
          msg.className = 'msg ok'; msg.style.display = 'block';
          setTimeout(() => window.location.href = 'auth.html', 2000);
        } catch (err) {
          msg.textContent = '❌ ' + err.message;
          msg.className = 'msg err'; msg.style.display = 'block';
          btn.disabled = false; btn.textContent = 'ACTUALIZAR CONTRASEÑA';
        }
      });
    })();
  </script>
</body>
</html>

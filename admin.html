<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Barbero</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header><h2>📋 PANEL DE TURNOS</h2><p>Ingresa tu ID o usa el guardado</p></header>
    <div style="max-width:400px; margin:10px auto;">
        <input type="text" id="barber-id-input" placeholder="Pega tu ID aquí" style="width:100%; padding:10px; margin-bottom:5px;">
        <button onclick="loadBookings()" style="background:#00f2ff; color:#000; padding:10px; width:100%; border:none; border-radius:5px; cursor:pointer;">CARGAR AGENDA</button>
    </div>
    <div style="background:var(--glass-bg); padding:15px; border-radius:10px; margin-bottom:20px; border:1px solid var(--glass-border); display:flex; align-items:center; gap:10px;">
    <span style="color:var(--neon-cyan); font-weight:700; font-family:'Orbitron', sans-serif;"> AGENDA:</span>
    <input type="date" id="filter-date" style="
        background:rgba(0,0,0,0.5); 
        color:#fff; 
        border:1px solid var(--neon-pink); 
        padding:8px; 
        border-radius:5px; 
        font-family:'Rajdhani', sans-serif; 
        font-size:1rem;
        flex-grow:1;
    ">
    <button onclick="loadBookings(document.getElementById('filter-date').value)" style="background:var(--neon-pink); border:none; padding:8px 15px; border-radius:5px; cursor:pointer; color:#fff; font-weight:700;">VER</button>
</div>

<!-- Resumen rápido -->
<div id="summary-stats" style="text-align:center; color:#aaa; margin-bottom:15px; font-size:0.9rem;"></div>

<main id="bookings-list"><p class="loading">Verificando acceso...</p></main>
    <main id="bookings-list"></main>
    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>

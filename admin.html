<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin | BarberHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    #app-content { opacity: 0; visibility: hidden; transition: opacity 0.3s ease; }
    #app-content.visible { opacity: 1; visibility: visible; }
  </style>
</head>
<body>

  <div id="app-content">
    <header class="app-header">
      <div class="header-top">
        <h1 class="logo-text" id="admin-title">🔐 Panel <span class="cyan">Admin</span></h1>
        <button class="icon-btn" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </header>

    <main class="feed-container">
      <div class="stats-cyber-grid">
        <div class="stat-card-cyber"><h3 class="stat-number">0</h3><p class="stat-label">Citas Pendientes</p></div>
        <div class="stat-card-cyber" style="border-color: var(--neon-pink);">
          <h3 class="stat-number" style="color: var(--neon-pink);">0</h3><p class="stat-label">Confirmadas Hoy</p>
        </div>
      </div>

      <h3 class="section-title">📅 Próximas Citas</h3>
      <div id="bookings-list" style="min-height: 100px; color: #888; text-align: center; padding: 20px;">Cargando citas...</div>

      <h3 class="section-title">✂️ Mis Servicios</h3>
      <div id="services-list"></div>
      
      <div class="add-form">
        <input id="new-service-name" placeholder="Nombre (ej: Corte Fade)">
        <input id="new-service-price" type="number" placeholder="Precio ($)">
        <button class="btn-book" onclick="addService()">+ Agregar</button>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="admin.html" class="nav-link active"><i class="fas fa-home"></i><span>Inicio</span></a>
      <a href="citas-barbero.html" class="nav-link"><i class="fas fa-calendar"></i><span>Citas</span></a>
      <a href="chat-list.html" class="nav-link"><i class="fas fa-comments"></i><span>Chats</span></a>
      <a href="pagos-barbero.html" class="nav-link"><i class="fas fa-wallet"></i><span>Pagos</span></a>
    </nav>
  </div>

  <script src="config.js"></script>
  <script>
    (async () => {
      try {
        const { data: { user }, error } = await supabaseClient.auth.getUser();
        if (error || !user) { window.location.href = 'auth.html'; return; }
        
        // Si NO es barbero, redirigir a cliente
        if (user.user_metadata?.role !== 'barbero') {
          window.location.href = 'perfil-cliente.html';
          return;
        }

        // Mostrar nombre y contenido
        const nombre = user.user_metadata?.nombre || user.email?.split('@')[0] || 'Barbero';
        document.getElementById('admin-title').innerHTML = `🔐 Hola, <span class="cyan">${nombre}</span>`;
        document.getElementById('app-content').classList.add('visible');
        
        // Aquí puedes cargar datos reales de Supabase
        // loadBarberData(user.id);
      } catch (err) {
        console.error(err);
        window.location.href = 'auth.html';
      }
    })();

    async function cerrarSesion() {
      if (confirm('¿Cerrar sesión?')) {
        await supabaseClient.auth.signOut();
        window.location.href = 'auth.html';
      }
    }

    function addService() {
      const nombre = document.getElementById('new-service-name').value;
      const precio = document.getElementById('new-service-price').value;
      if (nombre && precio) alert(`✅ Servicio "${nombre}" ($${precio}) agregado.`);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin | BarberHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* Agregar esta variable si no existe */
    :root {
      --neon-gold: #FFD700;
    }
    
    /* Estilo específico para botón Premium */
    .nav-btn.premium {
      border-color: var(--neon-gold) !important;
      background: rgba(255, 215, 0, 0.08) !important;
      color: var(--neon-gold) !important;
      position: relative;
      overflow: hidden;
    }
    .nav-btn.premium::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.3), transparent);
      transition: left 0.5s ease;
    }
    .nav-btn.premium:hover::before {
      left: 100%;
    }
    .nav-btn.premium:hover {
      background: rgba(255, 215, 0, 0.15) !important;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4) !important;
      transform: translateY(-2px) !important;
    }
  </style>
</head>
<body>

  <!-- HEADER + NAVEGACIÓN -->
  <div class="admin-header">
    <div>
      <h1 style="margin:0; font-size:1.4rem; font-family:'Orbitron';">🔐 PANEL <span style="color:var(--neon-cyan);">ADMIN</span></h1>
      <p id="barber-name" style="color:#888; margin:5px 0 0;">Cargando perfil...</p>
    </div>
    <div class="admin-nav">
      <a href="editar-perfil.html" class="nav-btn">✏️ Editar</a>
      <a href="horarios.html" class="nav-btn">🕐 Horarios</a>
      
      <!-- 💎 BOTÓN SUSCRIPCIÓN PREMIUM -->
      <a href="pagar-suscripcion.html" class="nav-btn premium">
        <i class="fas fa-crown"></i>
        <span>💎 Premium</span>
      </a>
      
      <a href="pagos-barbero.html" class="nav-btn">💰 Pagos</a>
      <a href="index.html" class="nav-btn">🏠 Directorio</a>
      <button onclick="cerrarSesion()" class="nav-btn" style="background:rgba(255,68,68,0.1); border-color:#ff4444; color:#ff4444;">🚪 Salir</button>
    </div>
  </div>

  <!-- ESTADÍSTICAS RÁPIDAS -->
  <div class="stats-grid">
    <div class="stat-card">
      <h3 id="stat-pending">0</h3>
      <p>Citas Pendientes</p>
    </div>
    <div class="stat-card" style="border-color: var(--neon-pink, #ff00ff); background: rgba(255,0,255,0.05);">
      <h3 id="stat-confirmed" style="color: var(--neon-pink, #ff00ff);">0</h3>
      <p>Confirmadas Hoy</p>
    </div>
  </div>

  <!-- 📅 GESTIÓN DE CITAS -->
  <h2 class="section-title">📅 Próximas Citas</h2>
  <div id="bookings-list" style="min-height: 100px; color: #888; text-align: center; padding: 20px;">Cargando citas...</div>

  <!-- ✂️ GESTIÓN DE SERVICIOS -->
  <h2 class="section-title">✂️ Mis Servicios</h2>
  <div id="services-list"></div>
  
  <div class="add-form">
    <input id="new-service-name" placeholder="Nombre (ej: Corte Fade)">
    <input id="new-service-price" type="number" placeholder="Precio ($)">
    <button onclick="addService()" class="btn-add">+ Agregar</button>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="admin.html" class="nav-link active"><i class="fas fa-home"></i><span>Inicio</span></a>
    <a href="citas-barbero.html" class="nav-link"><i class="fas fa-calendar"></i><span>Citas</span></a>
    <a href="chat-list.html" class="nav-link"><i class="fas fa-comments"></i><span>Chats</span></a>
    <a href="pagos-barbero.html" class="nav-link"><i class="fas fa-wallet"></i><span>Pagos</span></a>
  </nav>

  <script src="config.js"></script>
  <script>
    // Verificar sesión y mostrar nombre
    document.addEventListener('DOMContentLoaded', async () => {
      if (!window.supabaseClient) { window.location.href = 'auth.html'; return; }
      
      try {
        const { data: { user }, error } = await supabaseClient.auth.getUser();
        if (error || !user) { window.location.href = 'auth.html'; return; }
        
        // Verificar que sea barbero
        if (user.user_metadata?.role !== 'barbero') {
          window.location.href = 'perfil-cliente.html';
          return;
        }
        
        // Mostrar nombre
        const nombre = user.user_metadata?.nombre || user.email?.split('@')[0] || 'Barbero';
        document.getElementById('barber-name').textContent = `👋 Hola, ${nombre}`;
        
        // Verificar si viene de suscripción exitosa
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('subscription') === 'active') {
          setTimeout(() => {
            alert('🎉 ¡Bienvenido a Premium! Tus beneficios están activos.');
          }, 1000);
          window.history.replaceState({}, document.title, window.location.pathname);
        }
        
      } catch (err) {
        console.error('Error:', err);
        window.location.href = 'auth.html';
      }
    });
    
    async function cerrarSesion() {
      if (!confirm('¿Cerrar sesión?')) return;
      await supabaseClient.auth.signOut();
      window.location.href = 'auth.html';
    }
    
    // Funciones de ejemplo para citas y servicios
    function addService() {
      const nombre = document.getElementById('new-service-name').value;
      const precio = document.getElementById('new-service-price').value;
      if (nombre && precio) {
        alert(`✅ Servicio "${nombre}" ($${precio}) agregado.`);
        document.getElementById('new-service-name').value = '';
        document.getElementById('new-service-price').value = '';
      }
    }
  </script>
</body>
</html>

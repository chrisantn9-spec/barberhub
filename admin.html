<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | BarberHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body onload="setTimeout(() => { const l = document.getElementById('cyber-loader'); if(l) l.remove(); }, 2000);">

    <!-- 🌀 LOADER ADMIN -->
    <div id="cyber-loader">
        <div class="loader-content">
            <img src="cyber-face.png" alt="Cyber Barber" class="loader-face" onerror="this.style.display='none'">
            <div class="boot-sequence">
                <p class="line">> VERIFYING CREDENTIALS...</p>
                <p class="line">> CONNECTING TO ADMIN DB...</p>
                <p class="line">> LOADING DASHBOARD...</p>
            </div>
            <div class="progress-container"><div class="progress-bar"></div></div>
            <p class="status-text">SYSTEM BOOT IN PROGRESS...</p>
        </div>
        <div class="scanlines"></div>
    </div>

    <!-- ️ SCRIPT DE CIERRE (NO DEPENDE DE ADMIN.JS) -->
    <script>
        setTimeout(() => {
            const l = document.getElementById('cyber-loader');
            if (l) l.remove();
        }, 3000);
    </script>

    <!-- CONTENIDO REAL DEL PANEL (Oculto hasta que cargue) -->
    <div id="admin-dashboard" style="display:none; padding:20px; max-width:900px; margin:0 auto;">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding-bottom:10px; border-bottom:1px solid #333;">
            <h1 style="color:var(--neon-cyan); font-family:'Orbitron'; font-size:1.5rem;">🔐 PANEL ADMIN</h1>
            <div>
                <button onclick="logout()" style="background:#ff3333; color:#fff; border:none; padding:8px 12px; border-radius:4px; cursor:pointer;"> Cerrar Sesión</button>
            </div>
        </header>
        <div id="admin-content">
            <p style="color:#888; text-align:center;">Cargando turnos y configuración...</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>

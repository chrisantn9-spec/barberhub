<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Barbero | BarberHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon-cyan: #00E5EE;
            --neon-pink: #ff00ff;
            --glass-bg: rgba(15, 15, 30, 0.7);
            --glass-border: rgba(0, 229, 238, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            min-height: 100vh;
            background: #030303;
            overflow-x: hidden;
        }

        /* 🔥 FONDO CON BURBUJAS */
        .cyber-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.4), rgba(10,5,20,0.5)), url('./fondomiperfil.jpeg');
            background-size: cover; background-position: center; z-index: -3;
        }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -2; overflow: hidden; }
        .particle {
            position: absolute; width: 4px; height: 4px; background: var(--neon-cyan);
            border-radius: 50%; box-shadow: 0 0 8px var(--neon-cyan), 0 0 15px var(--neon-cyan);
            animation: rise 10s infinite linear; opacity: 0;
        }
        @keyframes rise {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; transform: translateY(100vh) scale(1); }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(0.5); opacity: 0; }
        }
        .cyber-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0,229,238,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,229,238,0.03) 1px, transparent 1px);
            background-size: 60px 60px; z-index: -1; pointer-events: none;
        }

        /* 🎨 LAYOUT PRINCIPAL */
        .dashboard {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        /* 🧭 SIDEBAR - NUEVO ESTILO DE MENÚ */
        .sidebar {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
            width: 260px;
            overflow-y: auto;
            z-index: 100;
        }
        .sidebar-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: #fff;
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
        }
        .sidebar-logo span { color: var(--neon-cyan); }
        
        .nav-menu { display: flex; flex-direction: column; gap: 8px; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 12px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        .nav-item i { width: 22px; text-align: center; font-size: 1.1rem; }
        .nav-item:hover, .nav-item.active {
            background: rgba(0, 229, 238, 0.15);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            transform: translateX(4px);
            box-shadow: 0 0 15px rgba(0, 229, 238, 0.2);
        }
        .nav-item.danger { color: #ff4444; }
        .nav-item.danger:hover {
            background: rgba(255, 68, 68, 0.15);
            border-color: #ff4444;
            color: #ff4444;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.2);
        }
        .nav-item.premium {
            background: linear-gradient(135deg, rgba(255,204,0,0.1), rgba(255,0,255,0.1));
            border: 1px solid #ffcc00;
            color: #ffcc00;
        }
        .nav-item.premium:hover {
            box-shadow: 0 0 20px rgba(255,204,0,0.3);
        }
        .nav-item .badge {
            margin-left: auto;
            background: var(--neon-pink);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
        }

        /* 📦 CONTENIDO PRINCIPAL */
        .main-content {
            margin-left: 260px;
            padding: 40px;
            max-width: 1000px;
        }

        /* 🎴 TARJETAS DE CONTENIDO */
        .content-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
        }
        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--neon-cyan);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 👤 PERSONALIZACIÓN DE PERFIL PÚBLICO */
        .profile-preview {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
            border: 1px dashed var(--glass-border);
        }
        .profile-preview-img {
            width: 120px; height: 120px;
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 3px solid var(--neon-cyan);
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }
        .profile-preview-img img { width: 100%; height: 100%; object-fit: cover; }
        .profile-preview-img::after {
            content: '✏️';
            position: absolute;
            bottom: 5px; right: 5px;
            background: var(--neon-cyan);
            color: #000;
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem;
        }
        .profile-preview-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            margin-bottom: 5px;
        }
        .profile-preview-location {
            color: var(--neon-pink);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .profile-preview-bio {
            color: rgba(255,255,255,0.7);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* 📝 FORMULARIOS */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.8);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 229, 238, 0.3);
        }
        .btn-save {
            background: var(--neon-cyan);
            color: #000;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-save:hover {
            box-shadow: 0 0 20px var(--neon-cyan);
            transform: translateY(-2px);
        }

        /* 🎨 SELECTOR DE COLOR */
        .color-picker {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .color-picker input[type="color"] {
            width: 50px; height: 40px;
            border: none; border-radius: 8px;
            cursor: pointer; background: transparent;
        }

        /* 📱 RESPONSIVE */
        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
            .sidebar {
                position: fixed; bottom: 0; left: 0; right: 0;
                width: 100%; height: auto; max-height: 200px;
                border-right: none; border-top: 1px solid var(--glass-border);
                padding: 15px; overflow-x: auto;
            }
            .nav-menu { flex-direction: row; flex-wrap: wrap; justify-content: center; }
            .nav-item { padding: 10px 14px; font-size: 0.9rem; }
            .main-content { margin-left: 0; padding: 20px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="cyber-grid"></div>
    <div class="particles" id="particles"></div>

    <div class="dashboard">
        <!-- 🧭 SIDEBAR - MENÚ PRINCIPAL -->
        <aside class="sidebar">
            <div class="sidebar-logo">BARBER<span>HUB</span></div>
            <nav class="nav-menu">
                <a href="admin-suscripciones.html" class="nav-item premium">
                    <i class="fas fa-crown"></i> Suscripciones <span class="badge">PRO</span>
                </a>
                <a href="admin-citas.html" class="nav-item">
                    <i class="fas fa-calendar-check"></i> Mis Citas
                </a>
                <a href="#configuracion" class="nav-item active" onclick="showSection('configuracion')">
                    <i class="fas fa-cog"></i> Configuración
                </a>
                <a href="admin-portafolio.html" class="nav-item">
                    <i class="fas fa-images"></i> Portafolio
                </a>
                <a href="barbero-perfil.html?id=preview" class="nav-item" target="_blank">
                    <i class="fas fa-eye"></i> Vista Pública
                </a>
                <a href="admin-productos.html" class="nav-item">
                    <i class="fas fa-store"></i> Mis Productos
                </a>
                <button onclick="cerrarSesion()" class="nav-item danger" style="width:100%; text-align:left; background:none; border:none; cursor:pointer;">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </button>
            </nav>
        </aside>

        <!-- 📦 CONTENIDO PRINCIPAL -->
        <main class="main-content">
            
            <!-- ⚙️ CONFIGURACIÓN DE PERFIL PÚBLICO -->
            <section id="configuracion" class="content-card">
                <h2 class="card-title"><i class="fas fa-paint-brush"></i> Personaliza tu Página Pública</h2>
                
                <!-- Vista previa en vivo -->
                <div class="profile-preview">
                    <div class="profile-preview-img" onclick="document.getElementById('logoInput').click()">
                        <img id="previewLogo" src="https://placehold.co/150x150/111/00E5EE?text=✂️" alt="Logo">
                        <input type="file" id="logoInput" accept="image/*" style="display:none;">
                    </div>
                    <h3 class="profile-preview-name" id="previewName">Tu Barbería</h3>
                    <p class="profile-preview-location" id="previewLocation">📍 Ciudad</p>
                    <p class="profile-preview-bio" id="previewBio">Tu descripción aparecerá aquí...</p>
                </div>

                <!-- Formulario de configuración -->
                <form id="profileForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>🏪 Nombre de la Barbería</label>
                            <input type="text" id="barberName" placeholder="Ej: Neon Cuts Studio" required>
                        </div>
                        <div class="form-group">
                            <label>📍 Ubicación</label>
                            <input type="text" id="barberLocation" placeholder="Ej: Downtown, Ciudad">
                        </div>
                        <div class="form-group full">
                            <label>📝 Descripción / Bio</label>
                            <textarea id="barberBio" rows="3" placeholder="Cuéntale a tus clientes sobre tu estilo..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>📷 Logo (cuadrado recomendado)</label>
                            <input type="file" id="logoFile" accept="image/*">
                        </div>
                        <div class="form-group">
                            <label>🖼️ Imagen de Fondo</label>
                            <input type="file" id="coverFile" accept="image/*">
                        </div>
                        <div class="form-group">
                            <label>📸 Instagram</label>
                            <input type="text" id="instagram" placeholder="@tu_barberia">
                        </div>
                        <div class="form-group">
                            <label>💬 WhatsApp</label>
                            <input type="text" id="whatsapp" placeholder="+52 123 456 7890">
                        </div>
                        <div class="form-group">
                            <label>🎨 Color Principal</label>
                            <div class="color-picker">
                                <input type="color" id="primaryColor" value="#00E5EE">
                                <span style="color:rgba(255,255,255,0.7); font-size:0.9rem;">Cian Neón</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>🎨 Color Secundario</label>
                            <div class="color-picker">
                                <input type="color" id="secondaryColor" value="#ff00ff">
                                <span style="color:rgba(255,255,255,0.7); font-size:0.9rem;">Rosa Neón</span>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn-save">
                        <i class="fas fa-save"></i> GUARDAR CAMBIOS
                    </button>
                </form>
            </section>

            <!-- 📊 RESUMEN RÁPIDO -->
            <section class="content-card">
                <h2 class="card-title"><i class="fas fa-chart-pie"></i> Resumen del Mes</h2>
                <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:15px;">
                    <div style="text-align:center; padding:15px; background:rgba(0,229,238,0.1); border-radius:12px;">
                        <div style="font-family:'Orbitron'; font-size:1.8rem; color:var(--neon-cyan);" id="statCitas">0</div>
                        <div style="color:rgba(255,255,255,0.7); font-size:0.9rem;">Citas Completadas</div>
                    </div>
                    <div style="text-align:center; padding:15px; background:rgba(255,0,255,0.1); border-radius:12px;">
                        <div style="font-family:'Orbitron'; font-size:1.8rem; color:var(--neon-pink);" id="statGanancias">$0</div>
                        <div style="color:rgba(255,255,255,0.7); font-size:0.9rem;">Ganancias</div>
                    </div>
                    <div style="text-align:center; padding:15px; background:rgba(255,204,0,0.1); border-radius:12px;">
                        <div style="font-family:'Orbitron'; font-size:1.8rem; color:#ffcc00;" id="statVisitas">0</div>
                        <div style="color:rgba(255,255,255,0.7); font-size:0.9rem;">Visitas al Perfil</div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="config.js"></script>
    <script>
        // ✨ BURBUJAS
        function createParticles() {
            const c = document.getElementById('particles');
            for(let i=0; i<35; i++) {
                const p = document.createElement('div'); p.className = 'particle';
                p.style.left = Math.random()*100 + '%'; p.style.animationDelay = Math.random()*10 + 's';
                p.style.animationDuration = (8 + Math.random()*7) + 's'; c.appendChild(p);
            }
        }
        createParticles();

        let currentUser = null;

        // 🔐 VERIFICAR SESIÓN
        (async () => {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user || user.user_metadata?.role !== 'barbero') {
                    window.location.href = user ? 'explorar.html' : 'auth.html';
                    return;
                }
                currentUser = user;
                await loadProfileSettings();
                await loadStats();
            } catch (err) {
                console.error(err); window.location.href = 'auth.html';
            }
        })();

        // 📥 CARGAR CONFIGURACIÓN DEL PERFIL
        async function loadProfileSettings() {
            const { data: perfil } = await supabaseClient.from('perfiles').select('*').eq('id', currentUser.id).single();
            if (perfil) {
                document.getElementById('barberName').value = perfil.nombre_barberia || '';
                document.getElementById('barberLocation').value = perfil.ubicacion || '';
                document.getElementById('barberBio').value = perfil.bio || '';
                document.getElementById('instagram').value = perfil.instagram || '';
                document.getElementById('whatsapp').value = perfil.whatsapp || '';
                
                if (perfil.logo_url) {
                    document.getElementById('previewLogo').src = perfil.logo_url;
                }
                if (perfil.cover_url) {
                    document.querySelector('.cyber-bg').style.backgroundImage = `linear-gradient(135deg, rgba(0,0,0,0.4), rgba(10,5,20,0.5)), url('${perfil.cover_url}')`;
                }
                
                // Actualizar vista previa
                updatePreview();
            }
        }

        // 🔄 ACTUALIZAR VISTA PREVIA EN TIEMPO REAL
        function updatePreview() {
            document.getElementById('previewName').textContent = document.getElementById('barberName').value || 'Tu Barbería';
            document.getElementById('previewLocation').textContent = `📍 ${document.getElementById('barberLocation').value || 'Ciudad'}`;
            document.getElementById('previewBio').textContent = document.getElementById('barberBio').value || 'Tu descripción aparecerá aquí...';
        }

        // Escuchar cambios en los inputs para actualizar vista previa
        ['barberName', 'barberLocation', 'barberBio'].forEach(id => {
            document.getElementById(id).addEventListener('input', updatePreview);
        });

        // 💾 GUARDAR CONFIGURACIÓN
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('.btn-save');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
            btn.disabled = true;

            try {
                let logoUrl = null, coverUrl = null;

                // Subir logo si se seleccionó
                const logoFile = document.getElementById('logoFile').files[0];
                if (logoFile) {
                    const fileName = `logos/${currentUser.id}/${Date.now()}_${logoFile.name}`;
                    const { error } = await supabaseClient.storage.from('uploads').upload(fileName, logoFile, { upsert: true });
                    if (error) throw error;
                    logoUrl = supabaseClient.storage.from('uploads').getPublicUrl(fileName).data.publicUrl;
                }

                // Subir cover si se seleccionó
                const coverFile = document.getElementById('coverFile').files[0];
                if (coverFile) {
                    const fileName = `covers/${currentUser.id}/${Date.now()}_${coverFile.name}`;
                    const { error } = await supabaseClient.storage.from('uploads').upload(fileName, coverFile, { upsert: true });
                    if (error) throw error;
                    coverUrl = supabaseClient.storage.from('uploads').getPublicUrl(fileName).data.publicUrl;
                }

                // Actualizar perfil en BD
                const { error } = await supabaseClient.from('perfiles').upsert({
                    id: currentUser.id,
                    nombre_barberia: document.getElementById('barberName').value,
                    ubicacion: document.getElementById('barberLocation').value,
                    bio: document.getElementById('barberBio').value,
                    instagram: document.getElementById('instagram').value,
                    whatsapp: document.getElementById('whatsapp').value,
                    logo_url: logoUrl,
                    cover_url: coverUrl,
                    colores_tema: {
                        primary: document.getElementById('primaryColor').value,
                        secondary: document.getElementById('secondaryColor').value
                    }
                });

                if (error) throw error;

                // Actualizar vista previa con nuevas imágenes
                if (logoUrl) document.getElementById('previewLogo').src = logoUrl;
                if (coverUrl) document.querySelector('.cyber-bg').style.backgroundImage = `linear-gradient(135deg, rgba(0,0,0,0.4), rgba(10,5,20,0.5)), url('${coverUrl}')`;
                
                alert('✅ ¡Tu página pública ha sido actualizada!');
                updatePreview();
            } catch (err) {
                alert('❌ Error: ' + err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // 📊 CARGAR ESTADÍSTICAS
        async function loadStats() {
            try {
                const startOfMonth = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-01`;
                
                // Citas completadas
                const { count: citas } = await supabaseClient.from('citas').select('*', {count:'exact',head:true}).eq('barbero_id', currentUser.id).eq('estado','completada').gte('fecha', startOfMonth);
                
                // Ganancias
                const { data: gananciasData } = await supabaseClient.from('citas').select('precio').eq('barbero_id', currentUser.id).eq('estado','completada').gte('fecha', startOfMonth);
                const ganancias = (gananciasData||[]).reduce((sum,c)=>sum+(c.precio||0),0);
                
                // Visitas (simulado - aquí conectarías con analytics real)
                const visitas = Math.floor(Math.random() * 50) + 10;
                
                document.getElementById('statCitas').textContent = citas || 0;
                document.getElementById('statGanancias').textContent = `$${ganancias.toFixed(0)}`;
                document.getElementById('statVisitas').textContent = visitas;
            } catch (err) { console.error('Stats error:', err); }
        }

        // 🧭 NAVEGACIÓN ENTRE SECCIONES
        function showSection(sectionId) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            event.currentTarget.classList.add('active');
            // Aquí podrías cargar contenido dinámico si tienes más secciones
        }

        // 🚪 CERRAR SESIÓN
        window.cerrarSesion = async () => {
            if (confirm('¿Cerrar sesión?')) {
                await supabaseClient.auth.signOut();
                window.location.href = 'index.html';
            }
        };

        // 📷 Subir logo desde vista previa
        document.getElementById('logoInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const fileName = `logos/${currentUser.id}/${Date.now()}_${file.name}`;
            const { error } = await supabaseClient.storage.from('uploads').upload(fileName, file, { upsert: true });
            if (error) { alert('Error: ' + error.message); return; }
            const publicUrl = supabaseClient.storage.from('uploads').getPublicUrl(fileName).data.publicUrl;
            document.getElementById('previewLogo').src = publicUrl;
            await supabaseClient.from('perfiles').update({ logo_url: publicUrl }).eq('id', currentUser.id);
            alert('✅ Logo actualizado');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin BarberHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:#050505; color:#fff; padding:20px;">

    <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; border-bottom:1px solid #333; padding-bottom:15px;">
        <div>
            <h1 style="color:var(--neon-cyan); font-family:'Orbitron'; margin:0;">🔐 PANEL ADMIN</h1>
            <p id="barber-name" style="color:#888;">Cargando...</p>
        </div>
        <button onclick="logout()" style="background:#ff3333; color:#fff; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">Salir</button>
    </header>

    <!-- 📊 ESTADÍSTICAS RÁPIDAS -->
    <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:15px; margin-bottom:30px;">
        <div style="background:rgba(0,242,255,0.1); border:1px solid var(--neon-cyan); padding:15px; border-radius:10px; text-align:center;">
            <h3 style="font-size:2rem; margin:0; color:var(--neon-cyan);" id="stat-pending">0</h3>
            <p style="margin:0; color:#888; font-size:0.8rem;">Citas Pendientes</p>
        </div>
        <div style="background:rgba(255,0,255,0.1); border:1px solid var(--neon-pink); padding:15px; border-radius:10px; text-align:center;">
            <h3 style="font-size:2rem; margin:0; color:var(--neon-pink);" id="stat-confirmed">0</h3>
            <p style="margin:0; color:#888; font-size:0.8rem;">Confirmadas Hoy</p>
        </div>
    </div>

    <!-- 📅 LISTA DE RESERVAS -->
    <h2 style="color:var(--neon-cyan); font-family:'Orbitron';"> Próximas Citas</h2>
    <div id="bookings-list" style="min-height:200px; color:#888;">Cargando...</div>

    <!-- ✂️ GESTIÓN DE SERVICIOS -->
    <div style="margin-top:40px; border-top:1px solid #333; padding-top:20px;">
        <h2 style="color:var(--neon-pink); font-family:'Orbitron';">✂️ Mis Servicios</h2>
        <div id="services-list" style="margin-bottom:15px;"></div>
        
        <div style="background:rgba(0,0,0,0.5); padding:15px; border-radius:10px;">
            <h3 style="margin-top:0;">+ Agregar Nuevo Servicio</h3>
            <input id="new-service-name" placeholder="Nombre (ej: Corte Fade)" style="width:45%; padding:8px; background:#111; border:1px solid #444; color:#fff; border-radius:4px;">
            <input id="new-service-price" type="number" placeholder="Precio ($)" style="width:20%; padding:8px; background:#111; border:1px solid #444; color:#fff; border-radius:4px;">
            <button onclick="addService()" style="padding:8px 15px; background:var(--neon-pink); color:#fff; border:none; border-radius:4px; cursor:pointer;">Agregar</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>

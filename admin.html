<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Barbero | BarberHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon-cyan: #00E5EE;
            --neon-pink: #ff00ff;
            --glass-bg: rgba(12, 12, 25, 0.85);
            --glass-border: rgba(0, 229, 238, 0.25);
            --text-main: #ffffff;
            --text-muted: rgba(255,255,255,0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-main);
            background: #030303;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /*  FONDOS */
        .cyber-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.5), rgba(8,5,18,0.6)), url('./fondomiperfil.jpeg');
            background-size: cover; background-position: center; z-index: -3;
        }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -2; overflow: hidden; }
        .particle {
            position: absolute; width: 4px; height: 4px; background: var(--neon-cyan);
            border-radius: 50%; box-shadow: 0 0 8px var(--neon-cyan), 0 0 15px var(--neon-cyan);
            animation: rise 10s infinite linear; opacity: 0;
        }
        @keyframes rise {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; transform: translateY(100vh) scale(1); }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(0.5); opacity: 0; }
        }
        .cyber-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0,229,238,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,229,238,0.03) 1px, transparent 1px);
            background-size: 60px 60px; z-index: -1; pointer-events: none;
        }

        /* 🧭 LAYOUT PRINCIPAL (Corrección del lado derecho) */
        .admin-wrapper {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            position: fixed;
            top: 0; left: 0;
            height: 100vh;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            z-index: 100;
            overflow-y: auto;
        }
        .sidebar-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            text-align: center;
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
        }
        .sidebar-logo span { color: var(--neon-cyan); }
        .nav-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 18px; border-radius: 12px;
            color: var(--text-muted); text-decoration: none;
            font-weight: 600; font-size: 1rem;
            transition: all 0.25s ease; border: 1px solid transparent;
            background: transparent; width: 100%; text-align: left; cursor: pointer;
        }
        .nav-item i { width: 22px; text-align: center; font-size: 1.1rem; }
        .nav-item:hover, .nav-item.active {
            background: rgba(0, 229, 238, 0.12);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            transform: translateX(4px);
            box-shadow: 0 0 12px rgba(0, 229, 238, 0.15);
        }
        .nav-item.premium {
            background: linear-gradient(135deg, rgba(255,204,0,0.08), rgba(255,0,255,0.08));
            border: 1px solid rgba(255,204,0,0.4);
            color: #ffcc00;
        }
        .nav-item.premium:hover { box-shadow: 0 0 15px rgba(255,204,0,0.2); }
        .nav-item.danger { color: #ff4444; margin-top: auto; }
        .nav-item.danger:hover {
            background: rgba(255, 68, 68, 0.12);
            border-color: #ff4444; color: #ff4444;
        }
        .badge {
            margin-left: auto; background: var(--neon-pink); color: #fff;
            font-size: 0.65rem; padding: 2px 8px; border-radius: 10px;
            font-family: 'Orbitron', sans-serif; font-weight: 700;
        }

        /* ÁREA PRINCIPAL */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
            max-width: 1100px;
            width: 100%;
        }

        /* TARJETAS */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--neon-cyan);
            margin-bottom: 25px;
            display: flex; align-items: center; gap: 10px;
            text-shadow: 0 0 10px rgba(0,229,238,0.4);
        }

        /* VISTA PREVIA EN VIVO */
        .preview-box {
            background: rgba(0,0,0,0.4);
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }
        .preview-logo {
            width: 100px; height: 100px; border-radius: 50%;
            margin: 0 auto 15px; border: 3px solid var(--neon-cyan);
            overflow: hidden; background: #000; cursor: pointer;
            box-shadow: 0 0 20px rgba(0,229,238,0.3);
        }
        .preview-logo img { width: 100%; height: 100%; object-fit: cover; }
        .preview-name { font-family: 'Orbitron'; font-size: 1.4rem; margin-bottom: 6px; }
        .preview-loc { color: var(--neon-pink); font-size: 0.95rem; margin-bottom: 12px; }
        .preview-bio { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; max-width: 400px; margin: 0 auto; }

        /* FORMULARIOS */
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label {
            display: block; margin-bottom: 8px; color: var(--text-muted);
            font-family: 'Orbitron'; font-size: 0.8rem; letter-spacing: 0.5px;
        }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border); border-radius: 10px;
            color: #fff; font-family: 'Rajdhani'; font-size: 1rem;
            transition: 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none; border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0,229,238,0.2);
        }
        .btn-save {
            background: var(--neon-cyan); color: #000; border: none;
            padding: 14px 30px; border-radius: 10px; font-family: 'Orbitron';
            font-weight: 700; font-size: 0.95rem; cursor: pointer;
            transition: 0.3s; display: inline-flex; align-items: center; gap: 8px;
            margin-top: 10px;
        }
        .btn-save:hover { box-shadow: 0 0 20px var(--neon-cyan); transform: translateY(-2px); }
        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* STATS */
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .stat-box {
            text-align: center; padding: 20px; border-radius: 14px;
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
        }
        .stat-num { font-family: 'Orbitron'; font-size: 1.8rem; font-weight: 700; margin-bottom: 5px; }
        .stat-lbl { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
        .stat-cyan .stat-num { color: var(--neon-cyan); }
        .stat-pink .stat-num { color: var(--neon-pink); }
        .stat-gold .stat-num { color: #ffcc00; }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .admin-wrapper { flex-direction: column; }
            .sidebar {
                position: relative; width: 100%; height: auto;
                border-right: none; border-bottom: 1px solid var(--glass-border);
                padding: 20px;
            }
            .nav-menu { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 10px; }
            .nav-item { padding: 10px 14px; font-size: 0.9rem; }
            .main-content { margin-left: 0; padding: 20px; }
            .form-grid { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="cyber-grid"></div>
    <div class="particles" id="particles"></div>

    <div class="admin-wrapper">
        <!-- 🧭 SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-logo">BARBER<span>HUB</span></div>
            <nav class="nav-menu">
                <a href="admin-suscripciones.html" class="nav-item premium">
                    <i class="fas fa-crown"></i> Suscripciones <span class="badge">PRO</span>
                </a>
                <a href="admin-citas.html" class="nav-item">
                    <i class="fas fa-calendar-check"></i> Mis Citas
                </a>
                <a href="#config" class="nav-item active" onclick="document.getElementById('config').scrollIntoView({behavior:'smooth'})">
                    <i class="fas fa-cog"></i> Configuración
                </a>
                <a href="admin-portafolio.html" class="nav-item">
                    <i class="fas fa-images"></i> Portafolio
                </a>
                <a href="barbero-perfil.html?id=preview" target="_blank" class="nav-item">
                    <i class="fas fa-eye"></i> Vista Pública
                </a>
                <a href="admin-productos.html" class="nav-item">
                    <i class="fas fa-store"></i> Mis Productos
                </a>
                <button onclick="cerrarSesion()" class="nav-item danger">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </button>
            </nav>
        </aside>

        <!--  CONTENIDO PRINCIPAL -->
        <main class="main-content">
            
            <!-- ️ CONFIGURACIÓN -->
            <section id="config" class="card">
                <h2 class="card-title"><i class="fas fa-paint-brush"></i> Personaliza tu Página Pública</h2>
                
                <div class="preview-box">
                    <div class="preview-logo" id="previewLogoWrap">
                        <img id="previewLogo" src="https://placehold.co/150x150/111/00E5EE?text=✂️" alt="Logo">
                    </div>
                    <h3 class="preview-name" id="previewName">Tu Barbería</h3>
                    <p class="preview-loc" id="previewLoc">📍 Ciudad</p>
                    <p class="preview-bio" id="previewBio">Tu descripción aparecerá aquí...</p>
                </div>

                <form id="profileForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>🏪 Nombre de la Barbería</label>
                            <input type="text" id="inputName" placeholder="Ej: Neon Cuts Studio" required>
                        </div>
                        <div class="form-group">
                            <label>📍 Ubicación</label>
                            <input type="text" id="inputLoc" placeholder="Ej: Downtown, Ciudad">
                        </div>
                        <div class="form-group full">
                            <label>📝 Descripción / Bio</label>
                            <textarea id="inputBio" rows="3" placeholder="Cuéntale a tus clientes sobre tu estilo..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>📷 Logo (cuadrado)</label>
                            <input type="file" id="fileLogo" accept="image/*">
                        </div>
                        <div class="form-group">
                            <label>🖼️ Imagen de Fondo</label>
                            <input type="file" id="fileCover" accept="image/*">
                        </div>
                        <div class="form-group">
                            <label>📸 Instagram</label>
                            <input type="text" id="inputInsta" placeholder="@tu_barberia">
                        </div>
                        <div class="form-group">
                            <label>💬 WhatsApp</label>
                            <input type="text" id="inputWsp" placeholder="+52 123 456 7890">
                        </div>
                        <div class="form-group">
                            <label>🎨 Color Principal</label>
                            <input type="color" id="inputColor1" value="#00E5EE" style="height:45px; cursor:pointer;">
                        </div>
                        <div class="form-group">
                            <label>🎨 Color Secundario</label>
                            <input type="color" id="inputColor2" value="#ff00ff" style="height:45px; cursor:pointer;">
                        </div>
                    </div>
                    <button type="submit" class="btn-save" id="saveBtn">
                        <i class="fas fa-save"></i> GUARDAR CAMBIOS
                    </button>
                </form>
            </section>

            <!-- 📊 RESUMEN -->
            <section class="card">
                <h2 class="card-title"><i class="fas fa-chart-pie"></i> Resumen del Mes</h2>
                <div class="stats-row">
                    <div class="stat-box stat-cyan">
                        <div class="stat-num" id="statCitas">0</div>
                        <div class="stat-lbl">Citas Completadas</div>
                    </div>
                    <div class="stat-box stat-pink">
                        <div class="stat-num" id="statGanancias">$0</div>
                        <div class="stat-lbl">Ganancias</div>
                    </div>
                    <div class="stat-box stat-gold">
                        <div class="stat-num" id="statVisitas">--</div>
                        <div class="stat-lbl">Visitas al Perfil</div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="config.js"></script>
    <script>
        // ✨ BURBUJAS
        const pCont = document.getElementById('particles');
        for(let i=0; i<35; i++){
            const p = document.createElement('div'); p.className='particle';
            p.style.left = Math.random()*100+'%'; p.style.animationDelay = Math.random()*10+'s';
            p.style.animationDuration = (8+Math.random()*7)+'s'; pCont.appendChild(p);
        }

        let currentUser = null;

        // 🔐 VERIFICAR SESIÓN
        (async () => {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user || user.user_metadata?.role !== 'barbero') {
                    window.location.href = user ? 'explorar.html' : 'auth.html';
                    return;
                }
                currentUser = user;
                await loadProfile();
                await loadStats();
            } catch (err) {
                console.error(err); window.location.href = 'auth.html';
            }
        })();

        // 📥 CARGAR DATOS
        async function loadProfile() {
            const { data } = await supabaseClient.from('perfiles').select('*').eq('id', currentUser.id).single();
            if (!data) return;

            document.getElementById('inputName').value = data.nombre_barberia || '';
            document.getElementById('inputLoc').value = data.ubicacion || '';
            document.getElementById('inputBio').value = data.bio || '';
            document.getElementById('inputInsta').value = data.instagram || '';
            document.getElementById('inputWsp').value = data.whatsapp || '';
            document.getElementById('inputColor1').value = data.colores_tema?.primary || '#00E5EE';
            document.getElementById('inputColor2').value = data.colores_tema?.secondary || '#ff00ff';

            if (data.logo_url) document.getElementById('previewLogo').src = data.logo_url;
            if (data.cover_url) {
                document.querySelector('.cyber-bg').style.backgroundImage = `linear-gradient(135deg, rgba(0,0,0,0.5), rgba(8,5,18,0.6)), url('${data.cover_url}')`;
            }
            updatePreview();
        }

        // 🔄 VISTA PREVIA EN TIEMPO REAL
        function updatePreview() {
            document.getElementById('previewName').textContent = document.getElementById('inputName').value || 'Tu Barbería';
            document.getElementById('previewLoc').textContent = `📍 ${document.getElementById('inputLoc').value || 'Ciudad'}`;
            document.getElementById('previewBio').textContent = document.getElementById('inputBio').value || 'Tu descripción aparecerá aquí...';
        }
        ['inputName', 'inputLoc', 'inputBio'].forEach(id => {
            document.getElementById(id).addEventListener('input', updatePreview);
        });

        // 💾 GUARDAR
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
            btn.disabled = true;

            try {
                let logoUrl = null, coverUrl = null;
                const logoFile = document.getElementById('fileLogo').files[0];
                const coverFile = document.getElementById('fileCover').files[0];

                if (logoFile) {
                    const name = `logos/${currentUser.id}/${Date.now()}_${logoFile.name}`;
                    const { error } = await supabaseClient.storage.from('uploads').upload(name, logoFile, { upsert: true });
                    if (error) throw error;
                    logoUrl = supabaseClient.storage.from('uploads').getPublicUrl(name).data.publicUrl;
                }
                if (coverFile) {
                    const name = `covers/${currentUser.id}/${Date.now()}_${coverFile.name}`;
                    const { error } = await supabaseClient.storage.from('uploads').upload(name, coverFile, { upsert: true });
                    if (error) throw error;
                    coverUrl = supabaseClient.storage.from('uploads').getPublicUrl(name).data.publicUrl;
                }

                const payload = {
                    id: currentUser.id,
                    nombre_barberia: document.getElementById('inputName').value,
                    ubicacion: document.getElementById('inputLoc').value,
                    bio: document.getElementById('inputBio').value,
                    instagram: document.getElementById('inputInsta').value,
                    whatsapp: document.getElementById('inputWsp').value,
                    colores_tema: {
                        primary: document.getElementById('inputColor1').value,
                        secondary: document.getElementById('inputColor2').value
                    }
                };
                if (logoUrl) payload.logo_url = logoUrl;
                if (coverUrl) payload.cover_url = coverUrl;

                const { error } = await supabaseClient.from('perfiles').upsert(payload);
                if (error) throw error;

                if (logoUrl) document.getElementById('previewLogo').src = logoUrl;
                if (coverUrl) document.querySelector('.cyber-bg').style.backgroundImage = `linear-gradient(135deg, rgba(0,0,0,0.5), rgba(8,5,18,0.6)), url('${coverUrl}')`;
                
                alert('✅ ¡Página pública actualizada!');
                updatePreview();
            } catch (err) {
                alert('❌ Error: ' + err.message);
            } finally {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        });

        // 📊 STATS
        async function loadStats() {
            try {
                const start = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-01`;
                const { count } = await supabaseClient.from('citas').select('*', {count:'exact',head:true}).eq('barbero_id', currentUser.id).eq('estado','completada').gte('fecha', start);
                const { data } = await supabaseClient.from('citas').select('precio').eq('barbero_id', currentUser.id).eq('estado','completada').gte('fecha', start);
                const total = (data||[]).reduce((s,c)=>s+(c.precio||0),0);
                document.getElementById('statCitas').textContent = count || 0;
                document.getElementById('statGanancias').textContent = `$${total.toFixed(0)}`;
            } catch(e) { console.error(e); }
        }

        // 🚪 LOGOUT
        window.cerrarSesion = async () => {
            if (confirm('¿Cerrar sesión?')) {
                await supabaseClient.auth.signOut();
                window.location.href = 'index.html';
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BarberHub | Panel Admin</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1115; color: #e4e4e7; padding: 2rem; }
    #loader { text-align: center; margin-top: 20vh; font-size: 1.2rem; }
    #admin-panel { display: none; }
    .btn-logout { background: #ef4444; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; margin-top: 1rem; }
  </style>
</head>
<body>
  <div id="loader">🔐 Verificando permisos de administrador...</div>
  
  <div id="admin-panel">
    <h1>👑 Panel de Administración</h1>
    <p>Bienvenido. Aquí gestionarás barberos, servicios y pagos.</p>
    <button id="logout-btn" class="btn-logout">Cerrar sesión</button>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const supabase = createClient('TU_SUPABASE_URL', 'TU_SUPABASE_ANON_KEY');

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { window.location.href = '/auth.html?mode=login'; return; }

      // 🔍 Verificar rol (ajusta según cómo guardes el rol)
      const { data: profile } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (profile?.role !== 'admin') {
        alert('⛔ Acceso restringido a administradores.');
        window.location.href = '/dashboard.html';
        return;
      }

      // ✅ Rol verificado → mostrar panel
      document.getElementById('loader').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = '/auth.html?mode=login';
      });
    });
  </script>
  <!-- ... tu contenido existente ... -->
<script type="module" src="./js/config.js"></script>
<script type="module" src="./js/admin.js"></script>
</body>
</body>
</html>

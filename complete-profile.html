<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completa tu Perfil | BarberHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --neon-cyan: #00E5EE; --neon-pink: #ff00ff; --dark-bg: #050505; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--dark-bg); font-family: 'Inter', sans-serif; color: #fff;
      background-image: 
        linear-gradient(180deg, rgba(5,5,5,0.95), rgba(10,10,20,0.98)),
        url('fondo.jpeg');
      background-size: cover; background-position: center;
    }
    .card {
      background: rgba(15,15,25,0.9); backdrop-filter: blur(20px);
      border: 1px solid var(--neon-cyan); border-radius: 20px;
      padding: 40px 30px; max-width: 450px; width: 90%;
      box-shadow: 0 0 40px rgba(0,229,238,0.2);
      animation: float 6s ease-in-out infinite;
      text-align: center;
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    
    .brand {
      font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 900;
      letter-spacing: 3px; margin-bottom: 10px;
    }
    .brand .b { color: #fff; } .brand .h { color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan); }
    
    .subtitle { color: #aaa; margin-bottom: 30px; }
    
    .role-selector {
      display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px;
    }
    .role-btn {
      padding: 20px; border: 2px solid rgba(255,255,255,0.1); border-radius: 16px;
      background: rgba(255,255,255,0.03); color: #fff; cursor: pointer;
      transition: all 0.3s; display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .role-btn:hover, .role-btn.active {
      border-color: var(--neon-cyan); background: rgba(0,229,238,0.1);
      box-shadow: 0 0 20px rgba(0,229,238,0.3); transform: translateY(-3px);
    }
    .role-btn i { font-size: 2rem; color: var(--neon-cyan); }
    .role-btn span { font-weight: 600; font-size: 1rem; }
    
    .barber-fields {
      display: none; margin-bottom: 20px; text-align: left;
      animation: fadeIn 0.3s ease;
    }
    .barber-fields.active { display: block; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
    
    .input-group { margin-bottom: 15px; }
    .input-group input {
      width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05); color: #fff; font-size: 1rem; box-sizing: border-box;
    }
    .input-group input:focus {
      border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,229,238,0.2); outline: none;
    }
    
    .btn-save {
      width: 100%; padding: 16px; border: none; border-radius: 12px;
      background: var(--neon-cyan); color: #000; font-weight: 700; font-size: 1rem;
      cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px;
    }
    .btn-save:hover { background: #fff; box-shadow: 0 0 30px rgba(255,255,255,0.6); transform: translateY(-2px); }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    
    #msg { margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 0.9rem; display: none; }
    #msg.err { background: rgba(255,0,0,0.1); color: #ff5555; border: 1px solid #ff5555; }
    #msg.ok { background: rgba(0,255,0,0.1); color: #00ff88; border: 1px solid #00ff88; }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="brand"><span class="b">BARBER</span><span class="h">HUB</span></h1>
    <p class="subtitle">Elige tu tipo de cuenta para continuar</p>
    
    <div class="role-selector">
      <button class="role-btn active" id="btn-cliente" onclick="setRole('cliente')">
        <i class="fas fa-user"></i>
        <span>Cliente</span>
      </button>
      <button class="role-btn" id="btn-barbero" onclick="setRole('barbero')">
        <i class="fas fa-scissors"></i>
        <span>Barbero</span>
      </button>
    </div>
    
    <form id="complete-form">
      <div id="barber-fields" class="barber-fields">
        <div class="input-group">
          <input type="text" id="barberia" placeholder="Nombre de tu barbería">
        </div>
        <div class="input-group">
          <input type="text" id="direccion" placeholder="Dirección del local">
        </div>
      </div>
      
      <button type="submit" class="btn-save" id="btn-save">✅ Guardar y Continuar</button>
      <div id="msg"></div>
    </form>
  </div>
<script src="config.js"></script>
<script>
  let selectedRole = 'cliente';
  
  window.setRole = (role) => {
    selectedRole = role;
    document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + role).classList.add('active');
    const fields = document.getElementById('barber-fields');
    if (role === 'barbero') fields.classList.add('active');
    else fields.classList.remove('active');
  };

  (async () => {
    try {
      const { data: { user }, error } = await supabaseClient.auth.getUser();
      if (error || !user) {
        window.location.href = 'auth.html';
        return;
      }

      // ✅ SI YA TIENE ROL, REDIRIGE DIRECTO (NO MUESTRA FORMULARIO)
      if (user.user_metadata?.role) {
        const msg = document.getElementById('msg');
        msg.textContent = '✅ Bienvenido de vuelta. Redirigiendo...';
        msg.className = 'ok'; msg.style.display = 'block';
        
        setTimeout(() => {
          window.location.href = user.user_metadata.role === 'barbero' ? 'admin.html' : 'perfil-cliente.html';
        }, 1000);
        return;
      }

      // ❌ SI NO TIENE ROL, MUESTRA EL FORMULARIO DE REGISTRO
      document.getElementById('complete-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-save');
        const msg = document.getElementById('msg');
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
        
        try {
          const { error: updateError } = await supabaseClient.auth.updateUser({
            data: { role: selectedRole }
          });
          if (updateError) throw updateError;
          
          if (selectedRole === 'barbero') {
            const barberia = document.getElementById('barberia').value || user.user_metadata?.nombre + "'s Barbería";
            const direccion = document.getElementById('direccion').value || 'Sin dirección';
            await supabaseClient.from('barbers').insert([{
              owner_id: user.id, name: barberia, location: direccion, phone: '', lat: 0, lng: 0
            }]);
          }
          
          msg.textContent = '✅ Perfil completado. Redirigiendo...';
          msg.className = 'ok'; msg.style.display = 'block';
          setTimeout(() => {
            window.location.href = 'inicio.html'; 
          }, 1500);
        } catch (err) {
          msg.textContent = '❌ Error: ' + err.message;
          msg.className = 'err'; msg.style.display = 'block';
          btn.disabled = false; btn.innerHTML = '✅ Guardar y Continuar';
        }
      });
    } catch (err) {
      console.error(err);
      window.location.href = 'auth.html';
    }
  })();
</script>
 
</body>
</html>

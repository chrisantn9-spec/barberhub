<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberHub | Cyberpunk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon-cyan: #00E5EE;
            --neon-pink: #ff00ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background: #030303;
        }

        /* 🔥 FONDO: Tu imagen visible con filtro muy sutil */
        .cyber-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                linear-gradient(135deg, rgba(0,0,0,0.2) 0%, rgba(10,5,20,0.3) 100%),
                url('./fondo.jpeg');
            background-size: cover;
            background-position: center;
            z-index: -3;
        }

        /* ✨ BURBUJAS / PARTÍCULAS */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-cyan), 0 0 15px var(--neon-cyan);
            animation: rise 10s infinite linear;
            opacity: 0;
        }
        @keyframes rise {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; transform: translateY(100vh) scale(1); }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(0.5); opacity: 0; }
        }

        /* 🔲 REJILLA SUTIL */
        .cyber-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 229, 238, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 238, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -2;
            pointer-events: none;
        }

        /*  CONTENIDO: Grande, Arriba, Derecha */
        .hero {
            position: absolute;
            top: 0; right: 0;
            width: 100%;
            padding: 12vh 60px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            z-index: 10;
            pointer-events: none;
        }
        .hero > * { pointer-events: auto; }

        /*  LOGO: TUBO DE NEÓN CIAN */
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(3rem, 9vw, 6rem);
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
            color: #fff; /* Núcleo blanco (gas encendido) */
            /* Efecto tubo de neón: múltiples capas de sombra para simular cristal y difusión */
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px var(--neon-cyan),
                0 0 40px var(--neon-cyan),
                0 0 80px var(--neon-cyan),
                0 0 120px rgba(0, 229, 238, 0.6);
            animation: tubeFlicker 4s infinite alternate;
        }
        .logo span { 
            color: var(--neon-cyan);
            text-shadow: 
                0 0 5px #fff,
                0 0 10px var(--neon-cyan),
                0 0 20px var(--neon-cyan),
                0 0 40px var(--neon-cyan),
                0 0 80px var(--neon-cyan);
        }

        /* Luz recorriendo el tubo (efecto electricidad) */
        .logo::after {
            content: 'BARBERHUB';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            color: transparent;
            -webkit-text-stroke: 1px transparent;
            background: linear-gradient(90deg, transparent 45%, rgba(255,255,255,0.9) 50%, transparent 55%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: traceElectric 3.5s linear infinite;
            pointer-events: none;
        }

        @keyframes tubeFlicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.9; }
        }
        @keyframes traceElectric {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /*  BOTONES */
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 35px;
            border-radius: 4px;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: 2px solid var(--neon-cyan);
            background: rgba(0, 229, 238, 0.1);
            backdrop-filter: blur(5px);
            color: var(--neon-cyan);
            cursor: pointer;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
        }
        .btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--neon-cyan);
            transform: translateY(-3px);
        }
        .btn i { margin-right: 8px; }

        /*  FOOTER: Centrado, Blanco fuerte, Inglés, Transparente */
        .footer {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            padding: 20px;
            z-index: 10;
            text-align: center;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .footer-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,1);
        }

        /*  BYLINE: ROSA NEÓN */
        .byline-flash {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--neon-pink);
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: neonFlashPink 1.5s infinite alternate;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px var(--neon-pink),
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink);
        }
        @keyframes neonFlashPink {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
                text-shadow: 0 0 5px #fff, 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
            }
            20%, 24%, 55% {
                opacity: 0.5;
                text-shadow: 0 0 2px var(--neon-pink);
            }
        }

        /*  RESPONSIVE */
        @media (max-width: 768px) {
            .hero {
                padding: 10vh 20px 20px 20px;
                align-items: center;
                text-align: center;
            }
            .btn-group { justify-content: center; }
            .logo { font-size: clamp(2.5rem, 10vw, 4rem); }
        }
    </style>
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="cyber-grid"></div>
    <div class="particles" id="particles"></div>

    <!-- Contenido: Arriba a la derecha -->
    <main class="hero">
        <h1 class="logo">
            BARBER<span>HUB</span>
        </h1>
        <div id="auth-container"></div>
    </main>

    <!-- Footer: Centro abajo -->
    <footer class="footer">
        <p class="footer-text">© 2026 All Rights Reserved</p>
        <p class="byline-flash">by B-U4ALL</p>
    </footer>

    <script src="config.js"></script>
    <script>
        // ✨ Burbujas
        function createParticles() {
            const c = document.getElementById('particles');
            for(let i=0; i<40; i++){
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random()*100 + '%';
                p.style.animationDelay = Math.random()*10 + 's';
                p.style.animationDuration = (7 + Math.random()*8) + 's';
                c.appendChild(p);
            }
        }
        createParticles();

        //  Auth Check
        (async () => {
            const box = document.getElementById('auth-container');
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if(session?.user) {
                    const name = session.user.user_metadata?.nombre || session.user.email?.split('@')[0] || 'Usuario';
                    box.innerHTML = `
                        <p style="font-size:1.3rem; margin-bottom:15px; color:#fff; font-weight:700; text-shadow:0 2px 8px rgba(0,0,0,0.9);">
                            👋 Hola, <strong style="color:var(--neon-cyan)">${name}</strong>
                        </p>
                        <div class="btn-group">
                            <a href="mi-perfil.html" class="btn"><i class="fas fa-user"></i> Mi Perfil</a>
                            <a href="explorar.html" class="btn"><i class="fas fa-compass"></i> Explorar</a>
                        </div>`;
                } else {
                    box.innerHTML = `
                        <div class="btn-group">
                            <a href="auth.html?mode=login" class="btn"><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</a>
                            <a href="auth.html?mode=register" class="btn"><i class="fas fa-user-plus"></i> Registrarse</a>
                        </div>`;
                }
            } catch(e) {
                console.error(e);
            }
        })();
    </script>
</body>
</html>

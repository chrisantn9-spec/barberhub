<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberHub - Tu estilo, tu momento</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ... tus estilos de landing ... */
        :root {
            --neon-cyan: #00E5EE;
            --dark-bg: #050505;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--dark-bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .hero {
            text-align: center;
            padding: 100px 20px;
        }
        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .hero h1 span { color: var(--neon-cyan); }
        .hero p {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 40px;
        }
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            border: 2px solid var(--neon-cyan);
        }
        .btn-primary {
            background: var(--neon-cyan);
            color: #000;
        }
        .btn-primary:hover {
            box-shadow: 0 0 30px var(--neon-cyan);
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: transparent;
            color: var(--neon-cyan);
        }
        .btn-secondary:hover {
            background: rgba(0,229,238,0.1);
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1><span>BARBER</span>HUB</h1>
        <p>Reserva tu cita con los mejores barberos de la ciudad</p>
        <div class="btn-group" id="auth-buttons">
            <!-- Los botones se cargan dinámicamente con JS -->
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // Verificar sesión y mostrar botones apropiados
        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authButtons = document.getElementById('auth-buttons');
            
            if (session?.user) {
                // Usuario logueado: mostrar botón a perfil
                authButtons.innerHTML = `
                    <a href="mi-perfil.html" class="btn btn-primary">
                        <i class="fas fa-user"></i> Mi Perfil
                    </a>
                    <a href="explorar.html" class="btn btn-secondary">
                        <i class="fas fa-compass"></i> Explorar Barberos
                    </a>
                `;
            } else {
                // Usuario NO logueado: mostrar login/registro
                authButtons.innerHTML = `
                    <a href="auth.html?mode=login" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                    </a>
                    <a href="auth.html?mode=register" class="btn btn-secondary">
                        <i class="fas fa-user-plus"></i> Registrarse
                    </a>
                `;
            }
        })();
    </script>
</body>
</html>

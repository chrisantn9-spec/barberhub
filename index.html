<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon-cyan: #00E5EE;
            --neon-pink: #ff00ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background: #030303;
        }

        /* 🔥 FONDO */
        .cyber-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                linear-gradient(135deg, rgba(0,0,0,0.25) 0%, rgba(10,5,20,0.3) 100%),
                url('./fondo.jpeg');
            background-size: cover;
            background-position: center;
            z-index: -3;
        }

        /* ✨ BURBUJAS */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -2;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-cyan), 0 0 15px var(--neon-cyan);
            animation: rise 10s infinite linear;
            opacity: 0;
        }
        @keyframes rise {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; transform: translateY(100vh) scale(1); }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(0.5); opacity: 0; }
        }

        /* 🔲 REJILLA */
        .cyber-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 229, 238, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 238, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -1;
            pointer-events: none;
        }

        /* 📍 CONTENIDO A LA IZQUIERDA */
        .hero {
            position: absolute;
            top: 50%;
            left: 60px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            z-index: 10;
            max-width: 400px;
        }

        /* 🔘 BOTONES NEÓN */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }
        .btn {
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: 2px solid var(--neon-cyan);
            background: rgba(0, 229, 238, 0.1);
            color: var(--neon-cyan);
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 10px rgba(0, 229, 238, 0.2);
        }
        .btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--neon-cyan);
            transform: translateX(4px);
        }
        .btn-secondary {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            background: rgba(255, 0, 255, 0.1);
        }
        .btn-secondary:hover {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 25px var(--neon-pink);
        }
        .btn i {
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        /* Saludo usuario */
        .user-greeting {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 229, 238, 0.6), 0 2px 4px rgba(0,0,0,0.9);
        }
        .user-greeting strong { color: var(--neon-cyan); }

        /* 🦶 FOOTER */
        .footer {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            padding: 20px 60px;
            text-align: left;
            z-index: 10;
            background: transparent;
        }
        .footer-text {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            font-family: 'Rajdhani', sans-serif;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
        }
        .byline-flash {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
            animation: neonFlash 1.5s infinite alternate;
            text-shadow: 0 0 8px var(--neon-cyan);
        }
        @keyframes neonFlash {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.4; }
        }

        /* 📱 RESPONSIVE */
        @media (max-width: 768px) {
            .hero {
                left: 50%;
                transform: translate(-50%, -50%);
                align-items: center;
                text-align: center;
                max-width: 90%;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
            .footer {
                padding: 15px 20px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="cyber-grid"></div>
    <div class="particles" id="particles"></div>

    <!-- CONTENIDO A LA IZQUIERDA -->
    <main class="hero">
        <div id="auth-container">
            <!-- Se llena dinámicamente con JS -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p class="footer-text">© 2026 All Rights Reserved</p>
        <p class="byline-flash">by B-U4ALL</p>
    </footer>

    <script src="config.js"></script>
    <script>
        // ✨ Burbujas
        function createParticles() {
            const c = document.getElementById('particles');
            for(let i=0; i<35; i++){
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random()*100 + '%';
                p.style.animationDelay = Math.random()*10 + 's';
                p.style.animationDuration = (8 + Math.random()*7) + 's';
                c.appendChild(p);
            }
        }
        createParticles();

        // 🔐 Auth Check
        (async () => {
            const container = document.getElementById('auth-container');
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                
                if (session?.user) {
                    const name = session.user.user_metadata?.nombre || session.user.email?.split('@')[0] || 'Usuario';
                    container.innerHTML = `
                        <p class="user-greeting">👋 Hola, <strong>${name}</strong></p>
                        <div class="btn-group">
                            <a href="mi-perfil.html" class="btn">
                                <i class="fas fa-user"></i> Mi Perfil
                            </a>
                            <a href="explorar.html" class="btn btn-secondary">
                                <i class="fas fa-compass"></i> Explorar
                            </a>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="btn-group">
                            <a href="auth.html?mode=login" class="btn">
                                <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                            </a>
                            <a href="auth.html?mode=register" class="btn btn-secondary">
                                <i class="fas fa-user-plus"></i> Registrarse
                            </a>
                        </div>
                    `;
                }
            } catch (err) {
                console.error('Auth error:', err);
                container.innerHTML = `
                    <div class="btn-group">
                        <a href="auth.html?mode=login" class="btn">Iniciar Sesión</a>
                        <a href="auth.html?mode=register" class="btn btn-secondary">Registrarse</a>
                    </div>
                `;
            }
        })();
    </script>
</body>
</html>

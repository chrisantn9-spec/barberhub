<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BarberHub | Cyberpunk Directory</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- 🌀 LOADER CYBERPUNK -->
    <div id="cyber-loader">
        <div class="loader-content">
            <!-- Imagen del rostro (si falla, se oculta sola) -->
            <img src="cyber-face.png" alt="Cyber Barber" class="loader-face" onerror="this.style.display='none'">
            
            
            <div class="boot-sequence">
                <p class="line">> INITIALIZING CORE...</p>
                <p class="line">> CONNECTING TO DATABASE...</p>
                <p class="line">> LOADING UI MODULES...</p>
                <p class="line">> SYNCING BARBER NETWORK...</p>
            </div>
            <div class="progress-container"><div class="progress-bar"></div></div>
            <p class="status-text">SYSTEM BOOT IN PROGRESS...</p>
        </div>
        <div class="scanlines"></div>
    </div>

    <!-- ENCABEZADO -->
    <header style="text-align: center; padding: 20px 10px;">
        <img src="logo.png" alt="BarberHub Logo" style="width: 220px; max-width: 85vw; height: auto; margin-bottom: 15px; filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.5));">
        <h1 style="font-family: 'Orbitron', sans-serif; letter-spacing: 2px; font-size: 1.8rem; margin-bottom: 5px; background: linear-gradient(90deg, #00f2ff, #ff00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">BARBERHUB</h1>
        <p style="color: #888; font-size: 0.9rem; margin-bottom: 10px;">Reserva tu turno al instante</p>
        <a href="admin.html" style="background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 15px; border-radius: 4px; text-decoration: none; font-size: 0.8rem; font-weight: bold;">🔐 MI PANEL</a>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main style="max-width: 480px; margin: 0 auto; padding: 10px 15px 60px;">
        <div style="margin-bottom: 15px;">
            <input type="text" id="search-bar" placeholder=" Buscar barbería..." style="width: 100%; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box;">
        </div>
        <div id="barber-list">
            <div style="text-align: center; padding: 20px; color: #666;"><p>Cargando directorio...</p></div>
        </div>
    </main>

    <!-- FOOTER -->
    <div style="text-align: center; padding: 10px; border-top: 1px solid #222; background: #050505; position: fixed; bottom: 0; width: 100%; z-index: 9;">
        <a href="mis-citas.html" style="color: #666; font-size: 0.8rem; text-decoration: none;">¿Ya tienes turno? Consultar</a>
    </div>

    <script src="config.js"></script>
    <script src="main.js"></script>
    
   <script>
    // ⏱️ ESPERAR 3.5 SEGUNDOS PARA VER LA ANIMACIÓN E IMAGEN
    setTimeout(() => {
        const loader = document.getElementById('cyber-loader');
        if (loader) loader.remove(); // Lo borra completamente
    }, 3500);
</script>

</body>
</html>

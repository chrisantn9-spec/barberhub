<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberHub | Cyberpunk Landing</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon-cyan: #00E5EE; /* Mismo tono que tu app */
            --neon-pink: #ff00ff;
            --dark-bg: #030303;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background: var(--dark-bg);
        }

        /* 🔥 FONDO CON TU IMAGEN fondo.jpeg */
        .cyber-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                linear-gradient(135deg, rgba(3,3,3,0.85) 0%, rgba(10,5,20,0.9) 50%, rgba(3,3,3,0.95) 100%),
                url('./fondo.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -3;
        }

        /* Rejilla 3D */
        .cyber-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 229, 238, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 238, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -2;
            pointer-events: none;
            animation: gridMove 25s linear infinite;
        }
        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(60px); }
        }

        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: -1;
            pointer-events: none;
            opacity: 0.5;
        }

        /* Partículas */
        .particles {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
        }
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-cyan);
            animation: float 15s infinite linear;
            opacity: 0.6;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-50px) rotate(720deg); opacity: 0; }
        }

        /* 🎯 HERO CENTRADO */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        /*  LOGO BARBERHUB */
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.8rem, 9vw, 5rem);
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 8px;
            position: relative;
            display: inline-block;
            text-transform: uppercase;
            /* Contorno base + brillo */
            -webkit-text-stroke: 1.5px var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 25px rgba(0, 229, 238, 0.4);
        }
        .logo-barber { color: #ffffff; }
        .logo-hub { color: var(--neon-cyan); }

        /*  Luz neón que recorre el contorno */
        .logo::after {
            content: 'BARBERHUB';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            color: transparent;
            -webkit-text-stroke: 2px var(--neon-cyan);
            background: linear-gradient(90deg, transparent 35%, var(--neon-cyan) 50%, transparent 65%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: traceLight 3s linear infinite;
            pointer-events: none;
            text-shadow: none;
        }
        @keyframes traceLight {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 🏷️ SUBTÍTULO */
        .tagline {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.75rem, 2.2vw, 0.95rem);
            color: rgba(255,255,255,0.9);
            letter-spacing: 4px;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* ⚡ BYLINE FLASH */
        .byline {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.9rem, 2.8vw, 1.2rem);
            font-weight: 700;
            color: var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan), 0 0 15px var(--neon-cyan);
            margin-bottom: 35px;
            animation: flashNeon 2.5s infinite alternate;
            letter-spacing: 2px;
        }
        @keyframes flashNeon {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                opacity: 1;
                text-shadow: 0 0 5px var(--neon-cyan), 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-cyan);
            }
            20%, 24%, 55% {
                opacity: 0.3;
                text-shadow: none;
            }
        }

        /* 🔘 BOTONES */
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .btn {
            position: relative;
            padding: 14px 36px;
            border-radius: 4px;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: 2px solid var(--neon-cyan);
            background: transparent;
            color: var(--neon-cyan);
            overflow: hidden;
            cursor: pointer;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 229, 238, 0.4), transparent);
            transition: left 0.5s ease;
        }
        .btn:hover::before { left: 100%; }
        .btn-primary {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 229, 238, 0.5);
        }
        .btn-primary:hover {
            box-shadow: 0 0 35px rgba(0, 229, 238, 0.8), 0 0 70px rgba(0, 229, 238, 0.3);
            transform: translateY(-2px);
        }
        .btn-secondary {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }
        .btn-secondary:hover {
            background: rgba(255, 0, 255, 0.1);
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.4);
            transform: translateY(-2px);
        }
        .btn i { margin-right: 8px; }

        /* Saludo usuario */
        .user-greeting {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: rgba(255,255,255,0.9);
        }
        .user-greeting strong { color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); }

        @media (max-width: 600px) {
            .btn-group { flex-direction: column; align-items: center; }
            .btn { width: 100%; max-width: 280px; }
        }
    </style>
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="cyber-grid"></div>
    <div class="scanlines"></div>
    <div class="particles" id="particles"></div>

    <main class="hero">
        <!-- ✨ LOGO CON EFECTOS -->
        <h1 class="logo">
            <span class="logo-barber">BARBER</span><span class="logo-hub">HUB</span>
        </h1>
        
        <!-- 🏷️ SUBTÍTULO -->
        <p class="tagline">!! URBAN STYLE !!</p>
        
        <!-- ⚡ BYLINE FLASH -->
        <p class="byline">by B-U4ALL</p>

        <!-- 🔐 CONTENIDO DINÁMICO (LOGIN/PERFIL) -->
        <div id="auth-container"></div>
    </main>

    <script src="config.js"></script>
    <script>
        // ✨ Partículas
        function createParticles() {
            const c = document.getElementById('particles');
            for(let i=0; i<30; i++){
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random()*100 + '%';
                p.style.animationDelay = Math.random()*15 + 's';
                p.style.animationDuration = (12 + Math.random()*8) + 's';
                c.appendChild(p);
            }
        }
        createParticles();

        // 🔐 Auth Check (Sin redirección forzada)
        (async () => {
            const box = document.getElementById('auth-container');
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if(session?.user) {
                    const name = session.user.user_metadata?.nombre || session.user.email?.split('@')[0] || 'Usuario';
                    box.innerHTML = `
                        <p class="user-greeting">👋 Hola, <strong>${name}</strong></p>
                        <div class="btn-group">
                            <a href="mi-perfil.html" class="btn btn-primary"><i class="fas fa-user"></i> Mi Perfil</a>
                            <a href="explorar.html" class="btn btn-secondary"><i class="fas fa-compass"></i> Explorar</a>
                        </div>`;
                } else {
                    box.innerHTML = `
                        <div class="btn-group">
                            <a href="auth.html?mode=login" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</a>
                            <a href="auth.html?mode=register" class="btn btn-secondary"><i class="fas fa-user-plus"></i> Registrarse</a>
                        </div>`;
                }
            } catch(e) {
                box.innerHTML = `<div class="btn-group"><a href="auth.html?mode=login" class="btn btn-primary">Iniciar Sesión</a><a href="auth.html?mode=register" class="btn btn-secondary">Registrarse</a></div>`;
            }
        })();
    </script>
</body>
</html>

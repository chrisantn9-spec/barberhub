<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberHub | Estilo Cyberpunk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-purple: #bc13fe;
            --dark-bg: #030303;
            --glass: rgba(10, 10, 20, 0.7);
            --border-glow: rgba(0, 243, 255, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background: var(--dark-bg);
        }

        /* 🔥 FONDO CYBERPUNK CON TU IMAGEN fondo.jpeg */
        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(135deg, rgba(3,3,3,0.85) 0%, rgba(10,5,20,0.9) 50%, rgba(3,3,3,0.95) 100%),
                url('./fondo.jpeg'); /* ✅ TU IMAGEN: fondo.jpeg */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -3;
        }

        /* Efecto de rejilla cyberpunk */
        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2;
            pointer-events: none;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        /* Efecto de scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: -1;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Contenedor principal */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        /* Logo con efecto glitch */
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 20px;
            position: relative;
            text-transform: uppercase;
            animation: flicker 2s infinite alternate;
        }

        .logo .text {
            position: relative;
            color: #fff;
        }

        .logo .text::before,
        .logo .text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .logo .text::before {
            color: var(--neon-cyan);
            animation: glitch-1 2s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            opacity: 0.8;
        }

        .logo .text::after {
            color: var(--neon-pink);
            animation: glitch-2 3s infinite linear alternate-reverse;
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
            opacity: 0.8;
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan); }
            20%, 24%, 55% { text-shadow: none; }
        }

        @keyframes glitch-1 {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        @keyframes glitch-2 {
            0% { transform: translate(0); }
            20% { transform: translate(2px, -2px); }
            40% { transform: translate(-2px, 2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(-2px, -2px); }
            100% { transform: translate(0); }
        }

        /* Subtítulo */
        .subtitle {
            font-size: clamp(1rem, 3vw, 1.4rem);
            color: rgba(255,255,255,0.85);
            max-width: 600px;
            margin-bottom: 40px;
            line-height: 1.6;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        /* Botones cyberpunk */
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .btn {
            position: relative;
            padding: 16px 40px;
            border-radius: 5px;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: 2px solid var(--neon-cyan);
            background: transparent;
            color: var(--neon-cyan);
            overflow: hidden;
            cursor: pointer;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.4), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
        }

        .btn-primary:hover {
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.9), 0 0 80px rgba(0, 243, 255, 0.4);
            transform: translateY(-3px);
        }

        .btn-secondary {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        .btn-secondary:hover {
            background: rgba(255, 0, 255, 0.15);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.5);
            transform: translateY(-3px);
        }

        .btn i { margin-right: 8px; }

        /* Saludo para usuarios logueados */
        .user-greeting {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: rgba(255,255,255,0.9);
        }

        .user-greeting strong {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        /* Efecto de partículas flotantes */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: float 15s infinite linear;
            opacity: 0.6;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .btn-group { flex-direction: column; align-items: center; }
            .btn { width: 100%; max-width: 300px; }
        }
    </style>
</head>
<body>
    <!-- Capas de fondo cyberpunk -->
    <div class="cyber-bg"></div>
    <div class="cyber-grid"></div>
    <div class="scanlines"></div>
    <div class="particles" id="particles"></div>

    <!-- Contenido principal -->
    <main class="hero">
        <h1 class="logo">
            <span class="text" data-text="BARBERHUB">BARBERHUB</span>
        </h1>
        <p class="subtitle">
            Donde el estilo clásico se encuentra con el futuro. 
            Reserva tu corte con barberos de élite en una experiencia inmersiva.
        </p>
        
        <div id="auth-container">
            <!-- Se llena dinámicamente con JS -->
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        // ✨ Efecto de partículas flotantes
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        // 🔐 Lógica de autenticación (NO redirige, solo muestra contenido)
        (async () => {
            const container = document.getElementById('auth-container');
            
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                
                if (session?.user) {
                    const nombre = session.user.user_metadata?.nombre || session.user.email?.split('@')[0] || 'Usuario';
                    container.innerHTML = `
                        <p class="user-greeting">👋 Bienvenido, <strong>${nombre}</strong></p>
                        <div class="btn-group">
                            <a href="mi-perfil.html" class="btn btn-primary">
                                <i class="fas fa-user"></i> Mi Perfil
                            </a>
                            <a href="explorar.html" class="btn btn-secondary">
                                <i class="fas fa-compass"></i> Explorar Barberos
                            </a>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="btn-group">
                            <a href="auth.html?mode=login" class="btn btn-primary">
                                <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                            </a>
                            <a href="auth.html?mode=register" class="btn btn-secondary">
                                <i class="fas fa-user-plus"></i> Registrarse
                            </a>
                        </div>
                    `;
                }
            } catch (err) {
                console.error("Error auth:", err);
                container.innerHTML = `
                    <div class="btn-group">
                        <a href="auth.html?mode=login" class="btn btn-primary">Iniciar Sesión</a>
                        <a href="auth.html?mode=register" class="btn btn-secondary">Registrarse</a>
                    </div>
                `;
            }
        })();
    </script>
</body>
</html>

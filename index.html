<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BarberHub | Cyberpunk Directory</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body onload="setTimeout(() => { const l = document.getElementById('cyber-loader'); if(l) l.remove(); }, 2000);">

    <!-- 🌀 LOADER (Se eliminará automáticamente en 2s) -->
    <div id="cyber-loader">
        <div class="loader-content">
            <img src="cyber-face.png" alt="Cyber Barber" class="loader-face" onerror="this.style.display='none'">
            <div class="boot-sequence">
                <p class="line">> INITIALIZING CORE...</p>
                <p class="line">> CONNECTING TO DATABASE...</p>
                <p class="line">> LOADING UI MODULES...</p>
                <p class="line">> SYNCING BARBER NETWORK...</p>
            </div>
            <div class="progress-container"><div class="progress-bar"></div></div>
            <p class="status-text">SYSTEM BOOT IN PROGRESS...</p>
        </div>
        <div class="scanlines"></div>
    </div>

    <!--  SI EL SCRIPT DE ARRIBA FALLA, ESTE LO MATA EN 3S -->
    <script>
        setTimeout(() => {
            const l = document.getElementById('cyber-loader');
            if (l) l.remove();
        }, 3000);
    </script>

    <!-- ENCABEZADO -->
    <header style="text-align: center; padding: 20px 10px;">
        <img src="logo.png" alt="Logo" style="width: 220px; max-width: 85vw; height: auto; margin-bottom: 15px; filter: drop-shadow(0 0 8px rgba(0,242,255,0.5));">
        <h1 style="font-family:'Orbitron'; font-size:1.8rem; margin-bottom:5px; background:linear-gradient(90deg,#00f2ff,#ff00ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">BARBERHUB</h1>
        <p style="color:#888; font-size:0.9rem; margin-bottom:15px;">Reserva tu turno al instante</p>
        
        <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
            <a href="auth.html" style="background:var(--neon-cyan); color:#000; padding:10px 20px; border-radius:5px; text-decoration:none; font-weight:bold; border:2px solid var(--neon-cyan); box-shadow:0 0 10px rgba(0,242,255,0.5);"> INICIAR SESIÓN</a>
            <a href="registro-barbero.html" style="background:transparent; color:var(--neon-pink); padding:10px 20px; border-radius:5px; text-decoration:none; font-weight:bold; border:2px solid var(--neon-pink); box-shadow:0 0 10px rgba(255,0,255,0.3);">💈 REGISTRAR BARBERÍA</a>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main style="max-width:800px; margin:0 auto; padding:10px 15px 60px;">
        <input type="text" id="search-bar" placeholder=" Buscar por nombre o zona..." style="width:100%; padding:12px; background:rgba(0,0,0,0.6); border:1px solid var(--neon-cyan); color:#fff; border-radius:6px; box-sizing:border-box; margin-bottom:15px; font-size:0.95rem;">
        <div id="barber-list">
            <div style="text-align:center; padding:20px; color:#666;"><p>Cargando directorio...</p></div>
        </div>
    </main>

    <!-- FOOTER -->
    <div style="text-align:center; padding:15px; border-top:1px solid #222; background:rgba(0,0,0,0.8); position:fixed; bottom:0; width:100%; z-index:9;">
        <a href="mis-citas.html" style="color:var(--neon-cyan); font-size:0.85rem; text-decoration:none; font-weight:600;">📅 ¿Ya tienes turno? Consultar aquí</a>
    </div>

    <!--  SOLO ESTOS DOS ARCHIVOS. NADA MÁS. -->
    <script src="config.js"></script>
    <script src="main.js"></script>

</body>
</html>

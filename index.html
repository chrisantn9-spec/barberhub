<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 🌀 LOADER DE INICIO -->
  <div id="cyber-loader">
    <div class="loader-content">
      <img src="logo.png" alt="BarberHub Logo" class="loader-face">
      <div class="boot-sequence">
        <div class="line">> Inicializando sistema...</div>
        <div class="line">> Conectando a BarberHub...</div>
      </div>
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- 🏠 CONTENIDO PRINCIPAL (Solo bienvenida + acceso) -->
<main class="container landing-view">
  <header class="landing-header">
    <h1 class="brand-title">BARBER<span style="color: var(--neon-cyan);">HUB</span></h1>
  </header>

  <section class="hero-section">
    <!-- ✅ TÍTULO CAMBIADO -->
    <h2 class="hero-title">URBAN STYLE</h2>
    
    <div class="auth-buttons">
      <a href="auth.html" class="btn-primary">Iniciar Sesión</a>
      <a href="registro.html" class="btn-secondary">Crear Cuenta</a>
    </div>
  </section>

  <!-- ✅ PIE DE PÁGINA AGREGADO -->
  <footer class="landing-footer">
    &copy; 2026 Derechos reservados by <strong>B-U4ALL SL</strong>
  </footer>
</main>

  <!-- ⚡ SCRIPT PARA OCULTAR LOADER -->
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('cyber-loader');
        if (loader) loader.classList.add('loader-hidden');
      }, 2800);
    });
  </script>

</body>
</html>

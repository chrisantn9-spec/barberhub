<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio | BarberHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --neon-cyan: #00E5EE; --neon-pink: #ff00ff; --dark-bg: #050505; --card-bg: rgba(15,15,25,0.9); --glass-border: rgba(0,229,238,0.3); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: var(--dark-bg); font-family: 'Inter', sans-serif; color: #fff; overflow-x: hidden; position: relative; padding-bottom: 80px; }
    .bg-text-layer { position: fixed; top: -10%; left: -10%; width: 120%; height: 120%; z-index: -2; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 40px; transform: rotate(-15deg); pointer-events: none; opacity: 0.25; }
    .bg-text-layer span { font-family: 'Orbitron', sans-serif; font-size: 4vw; font-weight: 900; color: transparent; -webkit-text-stroke: 1px rgba(0,229,238,0.2); white-space: nowrap; }
    .bg-light-beam { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(90deg, transparent 0%, transparent 45%, rgba(0,229,238,0.1) 50%, transparent 55%, transparent 100%); animation: sweep 6s linear infinite; pointer-events: none; }
    @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .app-container { max-width: 900px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }
    .app-header { background: rgba(5,5,15,0.95); backdrop-filter: blur(16px); border-bottom: 1px solid var(--glass-border); padding: 15px 20px; position: sticky; top: 0; z-index: 900; display: flex; flex-direction: column; gap: 10px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .logo-text { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 700; margin: 0; }
    .logo-text .cyan { color: var(--neon-cyan); }
    .icon-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: var(--neon-cyan); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; transition: 0.3s; }
    .icon-btn:hover { background: var(--neon-cyan); color: #000; }
    .search-bar { display: flex; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 50px; padding: 8px 15px; }
    .search-bar input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 0.95rem; }
    .search-bar i { color: var(--neon-cyan); margin-right: 8px; }
    .filter-scroller { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
    .filter-scroller::-webkit-scrollbar { display: none; }
    .chip { padding: 8px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; white-space: nowrap; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
    .chip.active { background: rgba(0,229,238,0.15); border-color: var(--neon-cyan); color: var(--neon-cyan); }
    .section-title { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; color: var(--neon-cyan); margin: 30px 0 15px; display: flex; align-items: center; gap: 10px; }
    .prices-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .price-item { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .price-val { color: var(--neon-cyan); font-weight: 700; }
    .barber-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .barber-card { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 16px; overflow: hidden; transition: 0.3s; cursor: pointer; }
    .barber-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,229,238,0.2); border-color: var(--neon-cyan); }
    .card-img-wrap { position: relative; height: 160px; overflow: hidden; }
    .card-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
    .barber-card:hover .card-img { transform: scale(1.05); }
    .fav-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
    .card-body { padding: 15px; }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .barber-name { font-size: 1.05rem; margin: 0; }
    .rating { color: #ffcc00; font-weight: 600; font-size: 0.85rem; }
    .location { color: #aaa; font-size: 0.8rem; margin: 0 0 10px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag { background: rgba(0,229,238,0.1); color: var(--neon-cyan); padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; }
    .card-foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; }
    .price { color: var(--neon-cyan); font-weight: 700; }
    .btn-book { background: var(--neon-cyan); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-book:hover { background: #fff; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: rgba(10,10,20,0.95); backdrop-filter: blur(16px); border-top: 1px solid var(--glass-border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-link { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #666; font-size: 0.7rem; padding: 8px; transition: 0.2s; border-radius: 10px; }
    .nav-link i { font-size: 1.4rem; margin-bottom: 4px; }
    .nav-link.active, .nav-link:hover { color: var(--neon-cyan); background: rgba(0,229,238,0.1); }
    @media (max-width: 600px) { .barber-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="bg-text-layer"><span>BARBERHUB</span><span>BARBERHUB</span><span>BARBERHUB</span><span>BARBERHUB</span><span>BARBERHUB</span><span>BARBERHUB</span></div>
  <div class="bg-light-beam"></div>

  <header class="app-header">
    <div class="header-top">
      <h1 class="logo-text">Barber<span class="cyan">Hub</span></h1>
      <button class="icon-btn" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i></button>
    </div>
    <div class="search-bar"><i class="fas fa-search"></i><input type="text" id="search-input" placeholder="Buscar barbero, estilo o ubicación..."></div>
  </header>

  <div class="app-container">
    <div class="filter-scroller">
      <div class="chip active">🔥 Tendencias</div><div class="chip">✂️ Cortes</div><div class="chip">🪒 Barba</div><div class="chip">📍 Cerca de ti</div><div class="chip">⭐ Mejor valorados</div>
    </div>

    <div class="prices-grid">
      <div class="price-item"><span>Corte Clásico</span><span class="price-val">$15</span></div>
      <div class="price-item"><span>Barba Completa</span><span class="price-val">$10</span></div>
      <div class="price-item"><span>Corte + Barba</span><span class="price-val">$22</span></div>
      <div class="price-item"><span>Afeitado</span><span class="price-val">$12</span></div>
      <div class="price-item"><span>Cejas</span><span class="price-val">$5</span></div>
    </div>

    <h2 class="section-title"><i class="fas fa-fire" style="color:#ff6600"></i> Barberos Destacados</h2>
    <div class="barber-grid" id="barbers-list"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-link active"><i class="fas fa-home"></i><span>Inicio</span></a>
    <a href="explorar.html" class="nav-link"><i class="fas fa-compass"></i><span>Explorar</span></a>
    <a href="mis-citas.html" class="nav-link"><i class="fas fa-calendar-check"></i><span>Citas</span></a>
    <a href="mi-perfil.html" class="nav-link"><i class="fas fa-user"></i><span>Perfil</span></a>
  </nav>

  <script src="config.js"></script>
  <script>
    const barbers = [
      { id: 1, name: "CyberCuts Studio", location: "Centro, Madrid", rating: 4.9, price: "$15", img: "https://placehold.co/400x300/111/00f2ff?text=CyberCuts", services: ["Corte","Barba","Cejas"] },
      { id: 2, name: "Neon Barber Shop", location: "Malasaña, Madrid", rating: 4.8, price: "$18", img: "https://placehold.co/400x300/111/ff00ff?text=Neon", services: ["Fade","Barba"] },
      { id: 3, name: "Urban Blade", location: "Lavapiés, Madrid", rating: 4.7, price: "$14", img: "https://placehold.co/400x300/111/00ff88?text=Urban", services: ["Clásico","Afeitado"] },
      { id: 4, name: "Razor & Code", location: "Chueca, Madrid", rating: 5.0, price: "$20", img: "https://placehold.co/400x300/111/ffaa00?text=Razor", services: ["Premium","Barba"] }
    ];

    function render(list) {
      const c = document.getElementById('barbers-list');
      c.innerHTML = '';
      list.forEach((b,i) => {
        const card = document.createElement('div');
        card.className = 'barber-card';
        card.style.animationDelay = `${i*0.1}s`;
        card.innerHTML = `
          <div class="card-img-wrap"><img src="${b.img}" class="card-img"><button class="fav-btn" onclick="event.stopPropagation();this.querySelector('i').classList.toggle('fas');this.querySelector('i').classList.toggle('far');"><i class="far fa-heart"></i></button></div>
          <div class="card-body">
            <div class="card-head"><h3 class="barber-name">${b.name}</h3><div class="rating"><i class="fas fa-star"></i> ${b.rating}</div></div>
            <p class="location"><i class="fas fa-map-marker-alt"></i> ${b.location}</p>
            <div class="tags">${b.services.map(s=>`<span class="tag">${s}</span>`).join('')}</div>
            <div class="card-foot"><span class="price">Desde ${b.price}</span><button class="btn-book">Reservar</button></div>
          </div>`;
        c.appendChild(card);
      });
    }

    document.getElementById('search-input')?.addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      render(barbers.filter(b => b.name.toLowerCase().includes(q) || b.location.toLowerCase().includes(q)));
    });

    (async () => {
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { window.location.href = 'auth.html'; return; }
        if (user.user_metadata?.role === 'barbero') { window.location.href = 'admin.html'; return; }
      } catch { window.location.href = 'auth.html'; }
    })();

    window.cerrarSesion = async () => { if(confirm('¿Cerrar sesión?')) { await supabaseClient.auth.signOut(); window.location.href = 'auth.html'; } };
    document.addEventListener('DOMContentLoaded', () => render(barbers));
  </script>
</body>
</html>

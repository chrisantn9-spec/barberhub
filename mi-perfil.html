<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - BarberHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { 
      background: linear-gradient(180deg, #050505 0%, #0a0a1a 100%); 
      min-height: 100vh; padding-bottom: 80px; color: #fff;
    }
    .header {
      padding: 20px; text-align: center;
      background: rgba(10,10,20,0.9); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,242,255,0.2);
      position: sticky; top: 0; z-index: 100;
    }
    .header h1 { font-family: 'Orbitron'; margin: 0; font-size: 1.5rem; }
    .header h1 span { color: var(--neon-cyan); }
    
    .profile-container { padding: 20px; max-width: 500px; margin: 0 auto; }
    
    .profile-header {
      text-align: center; padding: 30px 20px;
      background: rgba(20,20,30,0.8); border-radius: 20px;
      border: 1px solid rgba(0,242,255,0.2); margin-bottom: 20px;
    }
    .avatar-wrapper {
      position: relative; width: 100px; height: 100px;
      margin: 0 auto 15px;
    }
    .avatar-wrapper img {
      width: 100%; height: 100%; border-radius: 50%;
      border: 3px solid var(--neon-cyan); object-fit: cover;
      background: #1a1a2e;
    }
    .edit-avatar-btn {
      position: absolute; bottom: 0; right: 0;
      background: var(--neon-pink); color: #fff;
      border: none; border-radius: 50%;
      width: 30px; height: 30px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem;
    }
    .profile-name { font-size: 1.3rem; font-weight: 600; margin: 10px 0 5px; }
    .profile-email { color: #888; font-size: 0.9rem; }
    
    .menu-list {
      background: rgba(20,20,30,0.8); border-radius: 16px;
      border: 1px solid rgba(0,242,255,0.2); overflow: hidden;
    }
    .menu-item {
      display: flex; align-items: center; gap: 15px;
      padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer; transition: background 0.2s;
      text-decoration: none; color: #fff;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: rgba(0,242,255,0.1); }
    .menu-item i:first-child {
      color: var(--neon-cyan); font-size: 1.2rem; width: 24px; text-align: center;
    }
    .menu-item .text { flex: 1; }
    .menu-item .text span { display: block; font-weight: 500; }
    .menu-item .text small { color: #888; font-size: 0.8rem; }
    .menu-item i:last-child { color: #555; }
    
    .btn-logout {
      width: 100%; padding: 14px; margin-top: 20px;
      background: rgba(255,68,68,0.1); color: #ff4444;
      border: 1px solid rgba(255,68,68,0.3);
      border-radius: 12px; cursor: pointer; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-logout:hover { background: rgba(255,68,68,0.2); }
    
    /* Bottom Nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(10,10,20,0.95); backdrop-filter: blur(10px);
      border-top: 1px solid rgba(0,242,255,0.2);
      display: flex; justify-content: space-around; padding: 10px 0;
      z-index: 1000;
    }
    .nav-link {
      display: flex; flex-direction: column; align-items: center;
      color: #888; text-decoration: none; font-size: 0.75rem;
      padding: 5px 10px; border-radius: 8px; transition: all 0.2s;
    }
    .nav-link i { font-size: 1.3rem; margin-bottom: 3px; }
    .nav-link:hover, .nav-link.active {
      color: var(--neon-cyan); background: rgba(0,242,255,0.1);
    }
    .nav-link.active i { text-shadow: 0 0 10px var(--neon-cyan); }
  </style>
</head>
<body>
  <header class="header">
    <h1>Mi <span>Perfil</span></h1>
  </header>
  
  <main class="profile-container">
    <!-- Foto y Datos -->
    <div class="profile-header">
      <div class="avatar-wrapper">
        <img src="https://i.pravatar.cc/150?img=33" alt="Mi Foto" id="my-avatar">
        <button class="edit-avatar-btn" onclick="document.getElementById('file-input').click()">
          <i class="fas fa-camera"></i>
        </button>
        <input type="file" id="file-input" hidden accept="image/*" onchange="previewImage(event)">
      </div>
      <div class="profile-name" id="profile-name">Cargando...</div>
      <div class="profile-email" id="profile-email">...</div>
    </div>
    
    <!-- Menú -->
    <div class="menu-list">
      <div class="menu-item" onclick="alert('📬 Mensajes: Próximamente')">
        <i class="fas fa-comment-alt"></i>
        <div class="text"><span>Mensajes</span><small>Notificaciones y chats</small></div>
        <i class="fas fa-chevron-right"></i>
      </div>
      <div class="menu-item" onclick="alert('📅 Historial: Próximamente')">
        <i class="fas fa-history"></i>
        <div class="text"><span>Historial de Cortes</span><small>Ver todas tus reservas</small></div>
        <i class="fas fa-chevron-right"></i>
      </div>
      <div class="menu-item" onclick="alert('⚙️ Ajustes: Próximamente')">
        <i class="fas fa-cog"></i>
        <div class="text"><span>Configuración</span><small>Cuenta y privacidad</small></div>
        <i class="fas fa-chevron-right"></i>
      </div>
    </div>
    
    <button class="btn-logout" onclick="doLogout()">
      <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
    </button>
  </main>
  
  <!-- Bottom Navigation (CORREGIDO) -->
  <nav class="bottom-nav">
    <a href="perfil-cliente.html" class="nav-link">
      <i class="fas fa-home"></i><span>Inicio</span>
    </a>
    <a href="explorar.html" class="nav-link">
      <i class="fas fa-compass"></i><span>Explorar</span>
    </a>
    <a href="mis-citas.html" class="nav-link">
      <i class="fas fa-calendar-check"></i><span>Citas</span>
    </a>
    <!-- ✅ Perfil activo -->
    <a href="mi-perfil.html" class="nav-link active">
      <i class="fas fa-user"></i><span>Perfil</span>
    </a>
  </nav>
  
  <script src="config.js"></script>
  <script>
    // Cargar datos del usuario
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session?.user) {
          const user = session.user;
          document.getElementById('profile-name').textContent = user.user_metadata?.nombre || 'Usuario';
          document.getElementById('profile-email').textContent = user.email;
          
          // Foto personalizada si existe
          if (user.user_metadata?.avatar) {
            document.getElementById('my-avatar').src = user.user_metadata.avatar;
          }
        }
      } catch (err) {
        console.error('Error cargando perfil:', err);
      }
    });
    
    // Previsualizar foto
    window.previewImage = (event) => {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById('my-avatar').src = e.target.result;
          // Aquí podrías subir a Supabase Storage si quieres
        };
        reader.readAsDataURL(file);
      }
    };
    
    // Logout
    window.doLogout = async () => {
      if (confirm('¿Cerrar sesión?')) {
        await supabaseClient.auth.signOut();
        window.location.href = 'auth.html';
      }
    };
  </script>
</body>
</html>

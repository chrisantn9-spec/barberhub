<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | BarberHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon-cyan: #00E5EE;
            --neon-pink: #ff00ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            min-height: 100vh;
            background: #030303;
            overflow-x: hidden;
            position: relative;
        }

        /* 🔥 FONDO CON TU IMAGEN */
        .cyber-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                linear-gradient(135deg, rgba(0,0,0,0.3) 0%, rgba(10,5,20,0.4) 100%),
                url('./fondomiperfil.jpeg');
            background-size: cover;
            background-position: center;
            z-index: -3;
        }

        /* ⚡ RAYOS DE NEÓN FLOTANTES */
        .rays {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -2;
            overflow: hidden;
        }
        .ray {
            position: absolute;
            width: 2px;
            height: 0;
            background: linear-gradient(to bottom, transparent, var(--neon-cyan), transparent);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            animation: riseRay 4s infinite linear;
            opacity: 0;
        }
        @keyframes riseRay {
            0% {
                height: 0;
                top: 100%;
                opacity: 0;
            }
            10% {
                opacity: 0.8;
                height: 60px;
            }
            50% {
                height: 120px;
            }
            90% {
                opacity: 0.8;
                height: 60px;
            }
            100% {
                height: 0;
                top: -20%;
                opacity: 0;
            }
        }

        /* 🔲 REJILLA SUTIL */
        .cyber-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 229, 238, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 238, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -1;
            pointer-events: none;
        }

        /* 📦 CONTENIDO PRINCIPAL */
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px 60px;
            position: relative;
            z-index: 10;
        }

        /* 🎴 TARJETA TRANSPARENTE CON BORDE CRISTAL */
        .card {
            background: transparent;
            border: 1.5px solid rgba(0, 229, 238, 0.4);
            border-radius: 20px;
            padding: 30px 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 229, 238, 0.3), inset 0 0 20px rgba(0, 229, 238, 0.05);
        }

        /* 🏷️ LOGO */
        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 25px;
            color: #fff;
            text-shadow: 0 0 12px rgba(0, 229, 238, 0.7);
        }
        .brand .b { color: #fff; }
        .brand .h { color: var(--neon-cyan); }

        /* 👤 AVATAR Y DATOS DE USUARIO */
        .avatar-section { text-align: center; margin-bottom: 25px; }
        .avatar-wrap {
            width: 100px; height: 100px;
            margin: 0 auto 15px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 229, 238, 0.5);
        }
        .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .user-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            margin: 0 0 5px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 229, 238, 0.6), 0 2px 4px rgba(0,0,0,0.9);
        }
        .user-email {
            color: var(--neon-cyan);
            font-size: 0.95rem;
            margin: 0;
            text-shadow: 0 0 8px rgba(0, 229, 238, 0.5);
        }

        /* 📊 ESTADÍSTICAS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }
        .stat {
            background: rgba(0, 229, 238, 0.1);
            border: 1px solid rgba(0, 229, 238, 0.3);
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
        }
        .stat-num {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--neon-cyan);
            margin-bottom: 3px;
            text-shadow: 0 0 8px rgba(0, 229, 238, 0.6);
        }
        .stat-lbl {
            color: rgba(255,255,255,0.8);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 🧭 MENÚ DE OPCIONES */
        .menu-grid { display: grid; gap: 12px; }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: transparent;
            border: 1.5px solid rgba(0, 229, 238, 0.3);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .menu-item:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 229, 238, 0.3);
            transform: translateX(4px);
        }
        .menu-item i {
            font-size: 1.2rem;
            color: var(--neon-cyan);
            width: 24px;
            text-align: center;
            text-shadow: 0 0 8px rgba(0, 229, 238, 0.6);
        }
        .menu-item .arrow {
            margin-left: auto;
            color: rgba(255,255,255,0.4);
        }
        .menu-item.danger {
            border-color: rgba(255, 68, 68, 0.4);
        }
        .menu-item.danger i { color: #ff4444; text-shadow: 0 0 8px rgba(255, 68, 68, 0.6); }
        .menu-item.danger:hover {
            border-color: #ff4444;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
        }

        /* 📱 RESPONSIVE */
        @media (max-width: 500px) {
            .stats-grid { grid-template-columns: 1fr; }
            .brand { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- Fondo y efectos -->
    <div class="cyber-bg"></div>
    <div class="cyber-grid"></div>
    <div class="rays" id="rays"></div>

    <!-- Contenido principal -->
    <div class="app-container">
        <div class="card">
            <h1 class="brand"><span class="b">BARBER</span><span class="h">HUB</span></h1>
            
            <div class="avatar-section">
                <div class="avatar-wrap">
                    <img src="https://placehold.co/150x150/111/00E5EE?text=👤" alt="Avatar">
                </div>
                <h2 class="user-name" id="display-name">Cargando...</h2>
                <p class="user-email" id="display-email">email@ejemplo.com</p>
            </div>
            
            <div class="stats-grid">
                <div class="stat">
                    <div class="stat-num" id="stat-citas">12</div>
                    <div class="stat-lbl">Citas</div>
                </div>
                <div class="stat">
                    <div class="stat-num" id="stat-gastado">$340</div>
                    <div class="stat-lbl">Gastado</div>
                </div>
                <div class="stat">
                    <div class="stat-num" id="stat-favoritos">5</div>
                    <div class="stat-lbl">Favoritos</div>
                </div>
            </div>
            
            <div class="menu-grid">
                <a href="mis-citas.html" class="menu-item">
                    <i class="fas fa-calendar-check"></i>
                    <span>Mis Citas</span>
                    <i class="fas fa-chevron-right arrow"></i>
                </a>
                <a href="pagos.html" class="menu-item">
                    <i class="fas fa-wallet"></i>
                    <span>Mis Pagos</span>
                    <i class="fas fa-chevron-right arrow"></i>
                </a>
                <a href="suscripcion-cliente.html" class="menu-item">
                    <i class="fas fa-crown" style="color:var(--neon-cyan)"></i>
                    <span>💎 Premium</span>
                    <i class="fas fa-chevron-right arrow"></i>
                </a>
                <a href="configuracion.html" class="menu-item">
                    <i class="fas fa-cog"></i>
                    <span>Configuración</span>
                    <i class="fas fa-chevron-right arrow"></i>
                </a>
                <button onclick="cerrarSesion()" class="menu-item danger" style="width:100%; text-align:left; background:none; border:none; cursor:pointer;">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Cerrar Sesión</span>
                    <i class="fas fa-chevron-right arrow"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Sin barra inferior (bottom-nav eliminada) -->

    <script src="config.js"></script>
    <script>
        // ⚡ CREAR RAYOS DE NEÓN
        function createRays() {
            const container = document.getElementById('rays');
            for (let i = 0; i < 20; i++) {
                const ray = document.createElement('div');
                ray.className = 'ray';
                ray.style.left = Math.random() * 100 + '%';
                ray.style.animationDelay = Math.random() * 4 + 's';
                ray.style.animationDuration = (3 + Math.random() * 3) + 's';
                container.appendChild(ray);
            }
        }
        createRays();

        // 🔐 VERIFICAR SESIÓN Y CARGAR DATOS
        (async () => {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                
                if (!user) {
                    window.location.href = 'auth.html';
                    return;
                }
                
                // Si es barbero, redirigir a admin
                if (user.user_metadata?.role === 'barbero') {
                    window.location.href = 'admin.html';
                    return;
                }
                
                // Mostrar datos del usuario
                const nombre = user.user_metadata?.nombre || user.email?.split('@')[0] || 'Usuario';
                document.getElementById('display-name').textContent = nombre;
                document.getElementById('display-email').textContent = user.email || '';
                
                // Aquí podrías cargar datos reales de Supabase después:
                // const { data: stats } = await supabaseClient.from('user_stats').select('*').eq('user_id', user.id).single();
                // if (stats) {
                //     document.getElementById('stat-citas').textContent = stats.citas || '0';
                //     document.getElementById('stat-gastado').textContent = `$${stats.gastado || '0'}`;
                //     document.getElementById('stat-favoritos').textContent = stats.favoritos || '0';
                // }
                
            } catch (err) {
                console.error('Error cargando perfil:', err);
                window.location.href = 'auth.html';
            }
        })();
        
        // 🚪 CERRAR SESIÓN
        window.cerrarSesion = async () => {
            if (confirm('¿Cerrar sesión?')) {
                await supabaseClient.auth.signOut();
                window.location.href = 'index.html';
            }
        };
    </script>
</body>
</html>

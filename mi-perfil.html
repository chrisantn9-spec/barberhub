<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | BarberHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    
    <!-- ✅ 1. CDN de Supabase (SIEMPRE primero) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- ✅ 2. TU configuración (ahora en <head> para que esté listo antes de cualquier script) -->
    <script src="config.js"></script>
    
    <style>
        :root { --neon-cyan: #00E5EE; --neon-pink: #ff00ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Rajdhani', sans-serif; color: #fff; min-height: 100vh; background: #030303; overflow-x: hidden; position: relative; }
        .cyber-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(0,0,0,0.3) 0%, rgba(10,5,20,0.4) 100%), url('./fondomiperfil.jpeg'); background-size: cover; background-position: center; z-index: -3; }
        .rays { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -2; overflow: hidden; }
        .ray { position: absolute; width: 2px; height: 0; background: linear-gradient(to bottom, transparent, var(--neon-cyan), transparent); border-radius: 2px; box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); animation: riseRay 4s infinite linear; opacity: 0; }
        @keyframes riseRay { 0% { height: 0; top: 100%; opacity: 0; } 10% { opacity: 0.8; height: 60px; } 50% { height: 120px; } 90% { opacity: 0.8; height: 60px; } 100% { height: 0; top: -20%; opacity: 0; } }
        .cyber-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 229, 238, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 238, 0.03) 1px, transparent 1px); background-size: 60px 60px; z-index: -1; pointer-events: none; }
        .app-container { max-width: 600px; margin: 0 auto; padding: 40px 20px 60px; position: relative; z-index: 10; }
        .card { background: transparent; border: 1.5px solid rgba(0, 229, 238, 0.4); border-radius: 20px; padding: 30px 25px; margin-bottom: 20px; transition: all 0.3s ease; }
        .card:hover { border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0, 229, 238, 0.3), inset 0 0 20px rgba(0, 229, 238, 0.05); }
        .brand { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; text-align: center; margin-bottom: 25px; color: #fff; text-shadow: 0 0 12px rgba(0, 229, 238, 0.7); }
        .brand .b { color: #fff; } .brand .h { color: var(--neon-cyan); }
        .avatar-section { text-align: center; margin-bottom: 25px; }
        .avatar-wrap { width: 100px; height: 100px; margin: 0 auto 15px; border-radius: 50%; overflow: hidden; border: 3px solid var(--neon-cyan); box-shadow: 0 0 20px rgba(0, 229, 238, 0.5); position: relative; cursor: pointer; }
        .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-wrap:hover::after {
            content: '📷';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        #avatar-input { display: none; }
        .user-name { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; margin: 0 0 5px; color: #fff; text-shadow: 0 0 10px rgba(0, 229, 238, 0.6), 0 2px 4px rgba(0,0,0,0.9); }
        .user-email { color: var(--neon-cyan); font-size: 0.95rem; margin: 0; text-shadow: 0 0 8px rgba(0, 229, 238, 0.5); }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 25px; }
        .stat { background: rgba(0, 229, 238, 0.1); border: 1px solid rgba(0, 229, 238, 0.3); border-radius: 12px; padding: 15px 10px; text-align: center; }
        .stat-num { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: var(--neon-cyan); margin-bottom: 3px; text-shadow: 0 0 8px rgba(0, 229, 238, 0.6); }
        .stat-lbl { color: rgba(255,255,255,0.8); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .menu-grid { display: grid; gap: 12px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 16px; background: transparent; border: 1.5px solid rgba(0, 229, 238, 0.3); border-radius: 12px; color: #fff; text-decoration: none; transition: all 0.3s ease; position: relative; }
        .menu-item:hover { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 229, 238, 0.3); transform: translateX(4px); }
        .menu-item i { font-size: 1.2rem; color: var(--neon-cyan); width: 24px; text-align: center; text-shadow: 0 0 8px rgba(0, 229, 238, 0.6); }
        .menu-item .arrow { margin-left: auto; color: rgba(255,255,255,0.4); }
        .menu-item.danger { border-color: rgba(255, 68, 68, 0.4); }
        .menu-item.danger i { color: #ff4444; text-shadow: 0 0 8px rgba(255, 68, 68, 0.6); }
        .menu-item.danger:hover { border-color: #ff4444; box-shadow: 0 0 15px rgba(255, 68, 68, 0.3); }
        @media (max-width: 500px) { .stats-grid { grid-template-columns: 1fr; } .brand { font-size: 1.5rem; } }
        
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3,3,3,0.95); display: flex; align-items: center; justify-content: center;
            z-index: 100; flex-direction: column; gap: 1rem;
        }
        .loading-spinner {
            width: 50px; height: 50px; border: 4px solid rgba(0,229,238,0.2);
            border-top-color: var(--neon-cyan); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .floating-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 229, 238, 0.6), 0 0 40px rgba(255, 0, 255, 0.3);
            z-index: 1000;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .floating-btn:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 0 30px rgba(0, 229, 238, 0.8), 0 0 60px rgba(255, 0, 255, 0.5);
        }
        
        /* 🆕 BADGE DE NOTIFICACIÓN */
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4444;
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.6);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        /* 🆕 TOAST DE NOTIFICACIÓN */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 229, 238, 0.95);
            color: #000;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 229, 238, 0.6);
            z-index: 10000;
            display: none;
            animation: slideInRight 0.3s ease;
            max-width: 300px;
        }
        .toast.show {
            display: block;
        }
        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .toast-title {
            font-weight: 700;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .toast-message {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p>Verificando sesión...</p>
    </div>

    <a href="/explorar.html" class="floating-btn" title="Explorar">
        <i class="fas fa-compass"></i>
    </a>

    <div class="cyber-bg"></div>
    <div class="cyber-grid"></div>
    <div class="rays" id="rays"></div>

    <div class="app-container">
        <div class="card">
            <h1 class="brand"><span class="b">BARBER</span><span class="h">HUB</span></h1>
            
            <div class="avatar-section">
                <div class="avatar-wrap" id="avatar-container">
                    <img src="https://placehold.co/150x150/111/00E5EE?text=👤" alt="Avatar" id="user-avatar">
                    <input type="file" id="avatar-input" accept="image/*">
                </div>
                <h2 class="user-name" id="display-name">Cargando...</h2>
                <p class="user-email" id="display-email">email@ejemplo.com</p>
            </div>
            
            <div class="stats-grid">
                <div class="stat">
                    <div class="stat-num" id="stat-citas">12</div>
                    <div class="stat-lbl">Citas</div>
                </div>
                <div class="stat">
                    <div class="stat-num" id="stat-gastado">$340</div>
                    <div class="stat-lbl">Gastado</div>
                </div>
                <div class="stat">
                    <div class="stat-num" id="stat-favoritos">5</div>
                    <div class="stat-lbl">Favoritos</div>
                </div>
            </div>
            
            <div class="menu-grid">
                <a href="/mis-citas.html" class="menu-item">
                    <i class="fas fa-calendar-check"></i><span>Mis Citas</span><i class="fas fa-chevron-right arrow"></i>
                </a>
                <a href="/chat.html" class="menu-item" id="chat-menu-item">
                    <i class="fas fa-comments"></i><span>Chat</span>
                    <span class="notification-badge" id="chat-badge" style="display: none;">0</span>
                    <i class="fas fa-chevron-right arrow"></i>
                </a>
                <a href="/pagos.html" class="menu-item">
                    <i class="fas fa-wallet"></i><span>Mis Pagos</span><i class="fas fa-chevron-right arrow"></i>
                </a>
                <a href="/suscripcion-cliente.html" class="menu-item">
                    <i class="fas fa-crown" style="color:var(--neon-cyan)"></i><span>💎 Premium</span><i class="fas fa-chevron-right arrow"></i>
                </a>
                <a href="/configuracion.html" class="menu-item">
                    <i class="fas fa-cog"></i><span>Configuración</span><i class="fas fa-chevron-right arrow"></i>
                </a>
                <button id="btn-logout" class="menu-item danger" style="width:100%; text-align:left; background:none; border:none; cursor:pointer;">
                    <i class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span><i class="fas fa-chevron-right arrow"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <div class="toast-title" id="toast-title">Nuevo mensaje</div>
        <div class="toast-message" id="toast-message"></div>
    </div>

    <script>
        let currentUserId = null;

        function createRays() {
            const container = document.getElementById('rays');
            if (!container) return;
            for (let i = 0; i < 20; i++) {
                const ray = document.createElement('div');
                ray.className = 'ray';
                ray.style.left = Math.random() * 100 + '%';
                ray.style.animationDelay = Math.random() * 4 + 's';
                ray.style.animationDuration = (3 + Math.random() * 3) + 's';
                container.appendChild(ray);
            }
        }

        async function subirFotoPerfil(file) {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) return alert('⚠️ Sesión expirada');
                
                const userId = session.user.id;
                const fileExt = file.name.split('.').pop();
                const fileName = `${userId}_${Date.now()}.${fileExt}`;
                const filePath = `avatars/${fileName}`;
                
                const { error: uploadError } = await supabaseClient.storage
                    .from('profile-images')
                    .upload(filePath, file);
                
                if (uploadError) throw uploadError;
                
                const { data: { publicUrl } } = supabaseClient.storage
                    .from('profile-images')
                    .getPublicUrl(filePath);
                
                const { error: updateError } = await supabaseClient.auth.updateUser({
                    data: { avatar: publicUrl }
                });
                
                if (updateError) throw updateError;
                
                document.getElementById('user-avatar').src = publicUrl;
                alert('✅ Foto de perfil actualizada');
                
            } catch (err) {
                console.error('Error subiendo foto:', err);
                alert('❌ Error al subir la foto: ' + err.message);
            }
        }

        // 🆕 MOSTRAR NOTIFICACIÓN TOAST
        function showToast(title, message) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toast-title');
            const toastMessage = document.getElementById('toast-message');
            
            toastTitle.textContent = title;
            toastMessage.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 5000);
        }

        // 🆕 ACTUALIZAR BADGE DE NOTIFICACIONES
        function updateChatBadge(count) {
            const badge = document.getElementById('chat-badge');
            if (count > 0) {
                badge.textContent = count > 99 ? '99+' : count;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        // 🆕 ESCUCHAR MENSAJES NUEVOS EN TIEMPO REAL
        function escucharMensajes(userId) {
            supabaseClient
                .channel('chat-notifications')
                .on('postgres_changes', 
                    { 
                        event: 'INSERT', 
                        schema: 'public', 
                        table: 'messages',
                        filter: `receiver_id=eq.${userId}`
                    }, 
                    (payload) => {
                        console.log('📩 Nuevo mensaje recibido:', payload);
                        
                        // Actualizar badge
                        const currentCount = parseInt(document.getElementById('chat-badge').textContent || '0');
                        updateChatBadge(currentCount + 1);
                        
                        // Mostrar notificación toast
                        showToast('💬 Nuevo mensaje', 'Has recibido un nuevo mensaje');
                        
                        // Reproducir sonido de notificación (opcional)
                        const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQ==');
                        audio.play().catch(() => {});
                    }
                )
                .subscribe();
        }

        // 🆕 CONTAR MENSAJES NO LEÍDOS
        async function contarMensajesNoLeidos(userId) {
            try {
                const { count, error } = await supabaseClient
                    .from('messages')
                    .select('*', { count: 'exact', head: true })
                    .eq('receiver_id', userId)
                    .eq('read', false);
                
                if (error) throw error;
                updateChatBadge(count || 0);
            } catch (err) {
                console.error('Error contando mensajes:', err);
            }
        }

        async function initPerfil() {
            const loading = document.getElementById('loading');
            
            if (typeof supabaseClient === 'undefined') {
                console.error('❌ supabaseClient no está definido. ¿Se cargó config.js?');
                if (loading) loading.innerHTML = '<p style="color:#ff4444">⚠️ Error de configuración</p>';
                return;
            }
            
            try {
                const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
                
                if (sessionError || !session) {
                    console.warn('⚠️ Sin sesión activa, redirigiendo a login...');
                    window.location.replace('/auth.html');
                    return;
                }
                
                const user = session.user;
                currentUserId = user.id;
                
                if (user.user_metadata?.role === 'barbero') {
                    window.location.replace('/admin.html');
                    return;
                }
                
                const nombre = user.user_metadata?.nombre || user.email?.split('@')[0] || 'Usuario';
                const avatar = user.user_metadata?.avatar || 'https://placehold.co/150x150/111/00E5EE?text=👤';
                
                document.getElementById('display-name').textContent = nombre;
                document.getElementById('display-email').textContent = user.email || '';
                document.getElementById('user-avatar').src = avatar;
                
                // 🆕 Iniciar sistema de notificaciones
                contarMensajesNoLeidos(user.id);
                escucharMensajes(user.id);
                
            } catch (err) {
                console.error('❌ Error cargando perfil:', err);
                window.location.replace('/auth.html');
            } finally {
                const loading = document.getElementById('loading');
                if (loading) loading.style.display = 'none';
            }
        }

        async function cerrarSesion() {
            if (confirm('¿Cerrar sesión?')) {
                try {
                    await supabaseClient.auth.signOut();
                    window.location.replace('/index.html');
                } catch (err) {
                    console.error('Error al cerrar sesión:', err);
                    alert('⚠️ No se pudo cerrar sesión. Intenta de nuevo.');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            createRays();
            initPerfil();
            
            const btnLogout = document.getElementById('btn-logout');
            if (btnLogout) {
                btnLogout.onclick = cerrarSesion;
            }
            
            const avatarContainer = document.getElementById('avatar-container');
            const avatarInput = document.getElementById('avatar-input');
            
            if (avatarContainer && avatarInput) {
                avatarContainer.onclick = () => avatarInput.click();
                avatarInput.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        if (file.size > 5 * 1024 * 1024) {
                            alert('⚠️ La imagen no debe superar los 5MB');
                            return;
                        }
                        subirFotoPerfil(file);
                    }
                };
            }
            
            // 🆕 Resetear badge cuando entras al chat
            const chatMenuItem = document.getElementById('chat-menu-item');
            if (chatMenuItem) {
                chatMenuItem.addEventListener('click', () => {
                    updateChatBadge(0);
                });
            }
        });
    </script>
</body>
</html>

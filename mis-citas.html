<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Citas | BarberHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <img src="logo.png" class="logo-img" alt="Logo">
        <h1>📅 MIS CITAS</h1>
        <p>Consulta tus turnos reservados</p>
    </header>

    <main style="max-width:600px; margin:0 auto; padding:20px;">
        
        <!-- Paso 1: Ingresar Teléfono -->
        <div id="step-login" style="background:var(--glass-bg); padding:30px; border-radius:14px; border:1px solid var(--glass-border); text-align:center;">
            <h3 style="color:var(--neon-cyan);">Ingresa tu número de WhatsApp</h3>
            <p style="font-size:0.9rem; color:#aaa; margin-bottom:20px;">Te mostraremos las citas asociadas a este número.</p>
            
            <input type="tel" id="client-phone-input" placeholder="+503 1234 5678" style="width:100%; padding:12px; margin-bottom:15px; background:rgba(0,0,0,0.5); border:1px solid var(--neon-pink); color:#fff; border-radius:6px; font-size:1.1rem; text-align:center;">
            
            <button onclick="checkMyBookings()" style="background:var(--neon-cyan); color:#000; width:100%; padding:15px; border:none; border-radius:8px; font-weight:700; font-size:1.1rem; cursor:pointer;">
                VER MIS CITAS
            </button>
        </div>

        <!-- Paso 2: Lista de Citas (Oculta al inicio) -->
        <div id="step-list" style="display:none;">
            <button onclick="location.reload()" style="background:transparent; border:1px solid #888; color:#888; padding:5px 10px; border-radius:4px; margin-bottom:15px; cursor:pointer;">← Cambiar número</button>
            
            <h3 id="user-phone-display" style="text-align:center; color:var(--neon-pink); margin-bottom:20px;"></h3>
            
            <div id="my-bookings-list">
                <p class="loading">Buscando citas...</p>
            </div>
        </div>

        <div style="text-align:center; margin-top:30px;">
            <a href="index.html" style="color:#888; text-decoration:none;">← Volver al inicio</a>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="mis-citas.js"></script>
</body>
</html>

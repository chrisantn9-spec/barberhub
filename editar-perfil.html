<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil | BarberHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:#050505; color:#fff; padding:20px;">
    <h1 style="color:var(--neon-pink); font-family:'Orbitron';">✏️ Editar Barbería</h1>
    <form id="edit-form" style="margin-top:20px;">
        <label style="color:#888;">Nombre</label>
        <input id="edit-name" required style="width:100%; padding:10px; background:#111; border:1px solid #444; color:#fff; border-radius:4px; margin:5px 0 15px;">
        
        <label style="color:#888;">Ubicación</label>
        <input id="edit-location" required style="width:100%; padding:10px; background:#111; border:1px solid #444; color:#fff; border-radius:4px; margin:5px 0 15px;">
        
        <label style="color:#888;">Teléfono</label>
        <input id="edit-phone" required style="width:100%; padding:10px; background:#111; border:1px solid #444; color:#fff; border-radius:4px; margin:5px 0 15px;">
        
        <label style="color:#888;">Descripción / Bio</label>
        <textarea id="edit-bio" rows="4" style="width:100%; padding:10px; background:#111; border:1px solid #444; color:#fff; border-radius:4px; margin:5px 0 15px;"></textarea>

        <button type="submit" style="width:100%; padding:12px; background:var(--neon-cyan); color:#000; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">💾 Guardar Cambios</button>
    </form>
    <a href="admin.html" style="display:block; text-align:center; margin-top:15px; color:#888; text-decoration:none;">← Volver</a>
    <script src="config.js"></script>
    <script src="editar-perfil.js"></script>
</body>
</html>

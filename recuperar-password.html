<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - BarberHub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:linear-gradient(180deg,#050505,#0a0a1a); min-height:100vh; color:#fff; font-family:system-ui,sans-serif; display:flex; justify-content:center; align-items:center; padding:20px; }
    .card { background:rgba(15,15,25,0.9); border:1px solid #00f2ff; border-radius:16px; padding:24px; width:100%; max-width:380px; box-shadow:0 0 20px rgba(0,242,255,0.15); }
    h2 { text-align:center; color:#00f2ff; margin-bottom:15px; }
    input { width:100%; padding:12px; margin:8px 0; background:rgba(0,0,0,0.5); border:1px solid #444; border-radius:8px; color:#fff; font-size:1rem; }
    input:focus { outline:none; border-color:#00f2ff; }
    .btn-submit { width:100%; padding:14px; background:linear-gradient(135deg,#00f2ff,#00a3ff); border:none; border-radius:8px; color:#000; font-weight:bold; cursor:pointer; margin-top:15px; font-size:1rem; }
    .btn-submit:disabled { opacity:0.5; cursor:not-allowed; }
    .msg { margin-top:12px; padding:10px; border-radius:6px; text-align:center; display:none; font-size:0.9rem; }
    .msg.ok { background:rgba(0,255,136,0.15); color:#00ff88; border:1px solid #00ff88; }
    .msg.err { background:rgba(255,68,68,0.15); color:#ff4444; border:1px solid #ff4444; }
    .link { text-align:center; margin-top:20px; color:#888; }
    .link a { color:#00f2ff; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔑 Recuperar Contraseña</h2>
    <p style="text-align:center; color:#888; margin-bottom:20px; font-size:0.9rem;">Ingresa tu email y te enviaremos un enlace seguro para restablecerla.</p>
    <form id="recover-form">
      <input type="email" id="email" placeholder="📧 Tu correo registrado" required>
      <button type="submit" class="btn-submit" id="btn">ENVIAR ENLACE</button>
      <div id="msg" class="msg"></div>
    </form>
    <div class="link"><a href="auth.html">← Volver al inicio de sesión</a></div>
  </div>

  <script src="config.js"></script>
  <script>
    document.getElementById('recover-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      
      if (!window.supabaseClient) {
        msg.textContent = '❌ Error de configuración'; msg.className='msg err'; msg.style.display='block'; return;
      }

      btn.disabled = true; btn.textContent = 'Enviando...'; msg.style.display = 'none';

      try {
        const { error } = await window.supabaseClient.auth.resetPasswordForEmail(
          document.getElementById('email').value,
          { redirectTo: window.location.origin + '/actualizar-password.html' }
        );
        if (error) throw error;

        msg.textContent = '✅ Revisa tu correo. El enlace expira en 1 hora.';
        msg.className = 'msg ok'; msg.style.display = 'block';
        document.getElementById('email').value = '';
      } catch (err) {
        msg.textContent = '❌ ' + err.message;
        msg.className = 'msg err'; msg.style.display = 'block';
      }
      btn.disabled = false; btn.textContent = 'ENVIAR ENLACE';
    });
  </script>
</body>
</html>

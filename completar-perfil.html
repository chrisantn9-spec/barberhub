<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Perfil | BarberHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-cyan: #00E5EE; --neon-pink: #ff00ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Rajdhani', sans-serif; color: #fff; min-height: 100vh;
            background: #030303; display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: relative;
        }
        .cyber-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.5), rgba(10,5,20,0.6)), url('./fondobarber.png');
            background-size: cover; z-index: -2;
        }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .particle {
            position: absolute; width: 3px; height: 3px; background: var(--neon-cyan);
            border-radius: 50%; box-shadow: 0 0 10px var(--neon-cyan);
            animation: float 8s infinite; opacity: 0;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 1; } 80% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #030303; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px;
        }
        .loader-text { font-family: 'Orbitron'; color: var(--neon-cyan); font-size: 1.2rem; letter-spacing: 2px; animation: pulse 1.5s infinite alternate; }
        @keyframes pulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }
        .loader-bar { width: 200px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
        .loader-fill { width: 40%; height: 100%; background: var(--neon-cyan); border-radius: 2px; animation: load 1s infinite ease-in-out; }
        @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
        
        .card {
            display: none; background: rgba(10,10,20,0.85); backdrop-filter: blur(20px);
            border: 2px solid var(--neon-cyan); border-radius: 20px;
            padding: 40px; max-width: 500px; width: 90%;
            box-shadow: 0 0 30px rgba(0,229,238,0.3); text-align: center;
        }
        h1 { font-family: 'Orbitron'; color: var(--neon-cyan); margin-bottom: 10px; font-size: 1.8rem; }
        p { color: rgba(255,255,255,0.8); margin-bottom: 30px; }
        .role-selector { display: flex; gap: 15px; margin: 30px 0; }
        .role-selector input { display: none; }
        .role-option {
            flex: 1; padding: 25px; border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px; cursor: pointer; transition: 0.3s;
            font-family: 'Orbitron'; font-size: 1rem; color: rgba(255,255,255,0.7);
        }
        .role-option i { font-size: 2rem; display: block; margin-bottom: 10px; }
        #roleCliente:checked + .role-option {
            border-color: var(--neon-cyan); color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0,229,238,0.4); background: rgba(0,229,238,0.1);
        }
        #roleBarbero:checked + .role-option {
            border-color: var(--neon-pink); color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255,0,255,0.4); background: rgba(255,0,255,0.1);
        }
        .btn-continue {
            width: 100%; padding: 15px; background: var(--neon-cyan); color: #000;
            border: none; border-radius: 8px; font-family: 'Orbitron';
            font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 20px;
            transition: 0.3s;
        }
        .btn-continue:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--neon-cyan); }
        .btn-continue:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .checkbox-group {
            display: flex; align-items: flex-start; gap: 10px; margin: 25px 0;
            text-align: left; font-size: 0.85rem; color: rgba(255,255,255,0.7);
        }
        .checkbox-group input { margin-top: 3px; accent-color: var(--neon-cyan); }
        .checkbox-group a { color: var(--neon-cyan); text-decoration: none; }
        .checkbox-group a:hover { text-decoration: underline; }
        .error-box {
            display: none; background: rgba(255,0,0,0.1); border: 1px solid #ff4444;
            color: #ff4444; padding: 15px; border-radius: 8px; margin-top: 20px;
            font-size: 0.9rem; text-align: left;
        }
    </style>
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="particles" id="particles"></div>
    
    <div id="loader">
        <div class="loader-text">PREPARANDO REGISTRO...</div>
        <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>

    <div class="card" id="roleCard">
        <h1><i class="fas fa-user-plus"></i> COMPLETA TU REGISTRO</h1>
        <p>Para continuar, dinos cómo usarás BarberHub</p>
        
        <form id="roleForm">
            <div class="role-selector">
                <input type="radio" name="userRole" id="roleCliente" value="cliente" checked>
                <label for="roleCliente" class="role-option">
                    <i class="fas fa-user"></i> CLIENTE
                    <div style="font-size:0.75rem; font-family:'Rajdhani'; margin-top:5px; opacity:0.8;">Quiero agendar citas</div>
                </label>
                <input type="radio" name="userRole" id="roleBarbero" value="barbero">
                <label for="roleBarbero" class="role-option">
                    <i class="fas fa-cut"></i> BARBERO
                    <div style="font-size:0.75rem; font-family:'Rajdhani'; margin-top:5px; opacity:0.8;">Quiero gestionar mi negocio</div>
                </label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="acceptTerms" required>
                <label for="acceptTerms">
                    Acepto los <a href="terminos.html" target="_blank">Términos y Condiciones</a> y la 
                    <a href="privacidad.html" target="_blank">Política de Privacidad</a>
                </label>
            </div>

            <button type="submit" class="btn-continue" id="submitBtn">CONTINUAR <i class="fas fa-arrow-right"></i></button>
        </form>
        <div class="error-box" id="errorBox"></div>
    </div>

    <script src="config.js"></script>
    <script>
        // Partículas
        const particlesContainer = document.getElementById('particles');
        for(let i=0; i<30; i++){
            const p = document.createElement('div'); p.className = 'particle';
            p.style.left = Math.random()*100 + '%'; p.style.animationDelay = Math.random()*8 + 's';
            particlesContainer.appendChild(p);
        }

        // 🔍 FLUJO PRINCIPAL - SIEMPRE MUESTRA LA TARJETA
        (async () => {
            const loader = document.getElementById('loader');
            const card = document.getElementById('roleCard');
            const errorBox = document.getElementById('errorBox');

            try {
                if (typeof supabaseClient === 'undefined') {
                    throw new Error('config.js no se cargó correctamente');
                }

                console.log('🔍 Verificando sesión...');
                const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
                
                if (sessionError) {
                    console.error('Error de sesión:', sessionError);
                }

                // ✅ SIEMPRE mostrar la tarjeta (incluso si hay sesión)
                // Solo verificamos que haya un usuario logueado
                if (!session) {
                    console.log('🚪 Sin sesión. Redirigiendo a auth.html');
                    // Esperamos 2 segundos para que el loader se vea
                    setTimeout(() => {
                    }, 2000);
                    return;
                }

                console.log('✅ Usuario logueado:', session.user.email);
                console.log('✨ Mostrando selector de rol...');
                
                // Ocultar loader y mostrar tarjeta
                setTimeout(() => {
                    loader.style.display = 'none';
                    card.style.display = 'block';
                }, 1000); // Pequeña delay para que se vea profesional

            } catch (err) {
                console.error('💥 Error crítico:', err);
                loader.style.display = 'none';
                card.style.display = 'block';
                errorBox.style.display = 'block';
                errorBox.innerHTML = `
                    <strong>⚠️ Error:</strong><br>
                    ${err.message}<br><br>
                    <a href="auth.html" style="color:#00E5EE; text-decoration:underline;">← Volver al login</a>
                `;
            }
        })();

    document.getElementById('roleForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');
    
    if (!document.getElementById('acceptTerms').checked) {
        errorBox.style.display = 'block';
        errorBox.textContent = '⚠️ Acepta los términos para continuar.';
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Configurando perfil...';
    errorBox.style.display = 'none';

    const selectedRole = document.querySelector('input[name="userRole"]:checked').value;

    try {
        console.log(' Iniciando guardado de rol:', selectedRole);
        
        // 1. Actualizar metadata
        const { error: metaErr } = await supabaseClient.auth.updateUser({ data: { role: selectedRole } });
        if (metaErr) throw metaErr;

        // 2. Verificar sesión activa
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) throw new Error('Sesión perdida');

        // 3. Guardar en tabla perfiles (ignora si ya existe con upsert)
        const { error: dbErr } = await supabaseClient.from('perfiles').upsert({
            id: user.id,
            nombre: user.user_metadata?.nombre || user.email?.split('@')[0],
            email: user.email,
            rol: selectedRole
        }, { onConflict: 'id' });
        
        if (dbErr) throw dbErr;

        console.log('✅ Rol guardado. Redirigiendo a:', selectedRole === 'barbero' ? 'admin.html' : 'explorar.html');
        
        // 4. Redirección FORZADA (sin fallback a index.html)
        window.location.replace(selectedRole === 'barbero' ? 'admin.html' : 'explorar.html');
        
    } catch (err) {
        console.error('❌ Fallo al guardar rol:', err);
        errorBox.style.display = 'block';
        errorBox.textContent = '❌ ' + err.message;
        btn.disabled = false;
        btn.innerHTML = 'CONTINUAR <i class="fas fa-arrow-right"></i>';
        // 🔥 IMPORTANTE: NUNCA redirigir a index.html aquí. Dejamos que reintente.
    }
});

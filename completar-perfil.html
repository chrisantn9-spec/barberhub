<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Perfil | BarberHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-cyan: #00E5EE; --neon-pink: #ff00ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Rajdhani', sans-serif; color: #fff; min-height: 100vh;
            background: #030303; display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: relative;
        }
        .cyber-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.5), rgba(10,5,20,0.6)), url('./fondobarber.png');
            background-size: cover; z-index: -2;
        }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .particle {
            position: absolute; width: 3px; height: 3px; background: var(--neon-cyan);
            border-radius: 50%; box-shadow: 0 0 10px var(--neon-cyan);
            animation: float 8s infinite; opacity: 0;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        .card {
            background: rgba(10,10,20,0.8); backdrop-filter: blur(15px);
            border: 2px solid var(--neon-cyan); border-radius: 20px;
            padding: 40px; max-width: 500px; width: 90%;
            box-shadow: 0 0 30px rgba(0,229,238,0.3);
            text-align: center;
        }
        h1 { font-family: 'Orbitron'; color: var(--neon-cyan); margin-bottom: 10px; font-size: 1.8rem; }
        p { color: rgba(255,255,255,0.8); margin-bottom: 30px; }
        .role-selector { display: flex; gap: 15px; margin: 30px 0; }
        .role-selector input { display: none; }
        .role-option {
            flex: 1; padding: 25px; border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px; cursor: pointer; transition: 0.3s;
            font-family: 'Orbitron'; font-size: 1rem; color: rgba(255,255,255,0.7);
        }
        .role-option i { font-size: 2rem; display: block; margin-bottom: 10px; }
        #roleCliente:checked + .role-option {
            border-color: var(--neon-cyan); color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0,229,238,0.4); background: rgba(0,229,238,0.1);
        }
        #roleBarbero:checked + .role-option {
            border-color: var(--neon-pink); color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255,0,255,0.4); background: rgba(255,0,255,0.1);
        }
        .btn-continue {
            width: 100%; padding: 15px; background: var(--neon-cyan); color: #000;
            border: none; border-radius: 8px; font-family: 'Orbitron';
            font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 20px;
            transition: 0.3s;
        }
        .btn-continue:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--neon-cyan); }
        .checkbox-group {
            display: flex; align-items: flex-start; gap: 10px; margin: 25px 0;
            text-align: left; font-size: 0.85rem; color: rgba(255,255,255,0.7);
        }
        .checkbox-group input { margin-top: 3px; }
        .checkbox-group a { color: var(--neon-cyan); text-decoration: none; }
        .checkbox-group a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="particles" id="particles"></div>
    
    <div class="card">
        <h1><i class="fas fa-user-plus"></i> COMPLETA TU PERFIL</h1>
        <p>Para continuar, dinos cómo usarás BarberHub</p>
        
        <form id="roleForm">
            <div class="role-selector">
                <input type="radio" name="userRole" id="roleCliente" value="cliente" checked>
                <label for="roleCliente" class="role-option">
                    <i class="fas fa-user"></i>
                    CLIENTE
                    <div style="font-size:0.75rem; font-family:'Rajdhani'; margin-top:5px; opacity:0.8;">
                        Quiero agendar citas
                    </div>
                </label>
                
                <input type="radio" name="userRole" id="roleBarbero" value="barbero">
                <label for="roleBarbero" class="role-option">
                    <i class="fas fa-cut"></i>
                    BARBERO
                    <div style="font-size:0.75rem; font-family:'Rajdhani'; margin-top:5px; opacity:0.8;">
                        Quiero gestionar mi negocio
                    </div>
                </label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="acceptTerms" required>
                <label for="acceptTerms">
                    Acepto los <a href="terminos.html" target="_blank">Términos y Condiciones</a> y la 
                    <a href="privacidad.html" target="_blank">Política de Privacidad</a>
                </label>
            </div>

            <button type="submit" class="btn-continue">
                CONTINUAR <i class="fas fa-arrow-right"></i>
            </button>
        </form>
    </div>

    <script src="config.js"></script>
    <script>
        // Crear partículas
        for(let i=0; i<30; i++){
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random()*100 + '%';
            p.style.animationDelay = Math.random()*8 + 's';
            document.getElementById('particles').appendChild(p);
        }

        // Verificar que el usuario esté logueado
        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'auth.html';
                return;
            }
            
            // Si ya tiene rol, redirigir según corresponda
            if (session.user.user_metadata?.role) {
                const redirect = session.user.user_metadata.role === 'barbero' ? 'admin.html' : 'explorar.html';
                window.location.href = redirect;
            }
        })();

        // Guardar rol seleccionado
        document.getElementById('roleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!document.getElementById('acceptTerms').checked) {
                alert('Debes aceptar los términos y condiciones');
                return;
            }

            const role = document.querySelector('input[name="userRole"]:checked').value;
            
            try {
                // Actualizar metadata del usuario
                const { error } = await supabaseClient.auth.updateUser({
                    data: { role: role }
                });
                
                if (error) throw error;

                // Crear perfil en la tabla perfiles
                const { data: { user } } = await supabaseClient.auth.getUser();
                await supabaseClient.from('perfiles').upsert({
                    id: user.id,
                    nombre: user.user_metadata?.nombre || user.email?.split('@')[0],
                    email: user.email,
                    rol: role
                });

                // Redirigir según el rol
                window.location.href = role === 'barbero' ? 'admin.html' : 'explorar.html';
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });
    </script>
</body>
</html>

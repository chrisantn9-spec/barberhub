    <script src="config.js"></script>
    <script>
        // Partículas
        const particlesContainer = document.getElementById('particles');
        for(let i=0; i<30; i++){
            const p = document.createElement('div'); p.className = 'particle';
            p.style.left = Math.random()*100 + '%'; p.style.animationDelay = Math.random()*8 + 's';
            particlesContainer.appendChild(p);
        }

        // 🔍 LÓGICA ACTUALIZADA
        (async () => {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                const urlParams = new URLSearchParams(window.location.search);
                const forceReset = urlParams.get('reset') === '1';

                if (!session) { window.location.href = 'auth.html'; return; }

                // Si NO forzamos reset Y ya tiene rol → redirigir (comportamiento normal)
                if (!forceReset && session.user.user_metadata?.role) {
                    window.location.href = session.user.user_metadata.role === 'barbero' ? 'admin.html' : 'explorar.html';
                    return;
                }

                // Si forzamos reset O no tiene rol → mostrar tarjeta
                document.getElementById('loader').style.display = 'none';
                document.getElementById('roleCard').style.display = 'block';
            } catch (err) {
                console.error(err); window.location.href = 'auth.html';
            }
        })();

        // 💾 GUARDAR SELECCIÓN
        document.getElementById('roleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            if (!document.getElementById('acceptTerms').checked) {
                errorMsg.textContent = ' Debes aceptar los términos.'; errorMsg.style.display = 'block'; return;
            }

            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> GUARDANDO...';
            errorMsg.style.display = 'none';
            const selectedRole = document.querySelector('input[name="userRole"]:checked').value;

            try {
                await supabaseClient.auth.updateUser({ data: { role: selectedRole } });
                const { data: { user } } = await supabaseClient.auth.getUser();
                await supabaseClient.from('perfiles').upsert({
                    id: user.id, nombre: user.user_metadata?.nombre || 'Usuario', email: user.email, rol: selectedRole
                });
                window.location.href = selectedRole === 'barbero' ? 'admin.html' : 'explorar.html';
            } catch (err) {
                errorMsg.textContent = '❌ ' + err.message; errorMsg.style.display = 'block';
                btn.disabled = false; btn.innerHTML = 'CONTINUAR';
            }
        });
    </script>

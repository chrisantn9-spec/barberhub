<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio | BarberHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- 🔝 HEADER STICKY -->
  <header class="app-header">
    <div class="header-top">
      <h1 class="logo-text">Barber<span class="cyan">Hub</span></h1>
      <button class="icon-btn" onclick="cerrarSesion()" title="Cerrar sesión">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" id="search-input" placeholder="Buscar barbero, estilo o ubicación...">
    </div>
  </header>

  <!-- 🏷️ FILTROS RÁPIDOS (Chips deslizables) -->
  <div class="filter-scroller">
    <div class="chip active">🔥 Tendencias</div>
    <div class="chip">✂️ Cortes</div>
    <div class="chip">🪒 Barba</div>
    <div class="chip">📍 Cerca de ti</div>
    <div class="chip">⭐ Mejor valorados</div>
  </div>

  <!-- 📱 CONTENIDO PRINCIPAL -->
  <main class="feed-container">
    
    <!-- 💰 SECCIÓN DE PRECIOS (Mantenida como la tenías) -->
    <section class="prices-section">
      <div class="section-header">
        <i class="fas fa-coins" style="color: var(--neon-pink);"></i>
        <h3>Precios Base</h3>
      </div>
      <div class="prices-grid">
        <div class="price-item-cyber"><span class="price-name">Corte Clásico</span><span class="price-value">$15</span></div>
        <div class="price-item-cyber"><span class="price-name">Barba Completa</span><span class="price-value">$10</span></div>
        <div class="price-item-cyber"><span class="price-name">Corte + Barba</span><span class="price-value">$22</span></div>
        <div class="price-item-cyber"><span class="price-name">Cejas</span><span class="price-value">$5</span></div>
      </div>
    </section>

    <!-- 🔥 GRID DE BARBEROS DESTACADOS -->
    <h2 class="section-title-cyber" style="padding-left:4px; margin:24px 0 16px;">
      <i class="fas fa-fire" style="color:#ff6600;"></i> Barberos Destacados
    </h2>
    
    <div class="barber-grid" id="barbers-list">
      <!-- Las tarjetas se generan automáticamente con JS -->
    </div>

  </main>

  <!-- 📍 MENÚ INFERIOR (SOLO 2 BOTONES) -->
  <nav class="bottom-nav">
    <a href="perfil-cliente.html" class="nav-link active">
      <i class="fas fa-home"></i>
      <span>Inicio</span>
    </a>
    <a href="explorar.html" class="nav-link">
      <i class="fas fa-compass"></i>
      <span>Explorar</span>
    </a>
  </nav>

  <!-- ⚡ LÓGICA -->
  <script src="config.js"></script>
  <script>
    // 1️⃣ Verificar sesión al cargar
    (async () => {
      try {
        if (!window.supabaseClient) { window.location.href = 'auth.html'; return; }
        const { data: { user }, error } = await supabaseClient.auth.getUser();
        if (error || !user) { window.location.href = 'auth.html'; return; }
        
        // Si es barbero, redirigir a su panel
        if (user.user_metadata?.role === 'barbero') {
          window.location.href = 'admin.html';
          return;
        }
      } catch (err) {
        console.error('Error auth:', err);
        window.location.href = 'auth.html';
      }
    })();

    // 2️⃣ Cerrar sesión
    async function cerrarSesion() {
      if (!confirm('¿Cerrar sesión?')) return;
      await supabaseClient.auth.signOut();
      window.location.href = 'auth.html';
    }

    // 3️⃣ Datos de ejemplo para las tarjetas
    const barbers = [
      { id: 1, name: "CyberCuts Studio", location: "Centro, Madrid", rating: 4.9, price: "$15", img: "https://placehold.co/400x300/111/00f2ff?text=CyberCuts" },
      { id: 2, name: "Neon Barber Shop", location: "Malasaña, Madrid", rating: 4.8, price: "$18", img: "https://placehold.co/400x300/111/ff00ff?text=Neon" },
      { id: 3, name: "Urban Blade", location: "Lavapiés, Madrid", rating: 4.7, price: "$14", img: "https://placehold.co/400x300/111/00ff88?text=Urban" },
      { id: 4, name: "Razor & Code", location: "Chueca, Madrid", rating: 5.0, price: "$20", img: "https://placehold.co/400x300/111/ffaa00?text=Razor" }
    ];

    // 4️⃣ Renderizar tarjetas estilo Airbnb + Cyberpunk
    function renderBarbers(list) {
      const container = document.getElementById('barbers-list');
      if (!container) return;
      
      container.innerHTML = '';
      list.forEach((b, index) => {
        const card = document.createElement('div');
        card.className = 'barber-card';
        card.style.animationDelay = `${index * 0.1}s`;
        card.onclick = () => {
          sessionStorage.setItem('chatBarberId', b.id);
          sessionStorage.setItem('chatBarberName', b.name);
          window.location.href = 'chat.html'; // Ajusta si tu chat tiene otro nombre
        };
        
        card.innerHTML = `
          <div class="card-image-wrapper">
            <img src="${b.img}" alt="${b.name}" class="card-image">
            <div class="card-overlay"></div>
            <button class="fav-btn"><i class="far fa-heart"></i></button>
          </div>
          <div class="card-content">
            <div class="card-header">
              <h3 class="barber-name">${b.name}</h3>
              <div class="rating"><i class="fas fa-star"></i> ${b.rating}</div>
            </div>
            <p class="location"><i class="fas fa-map-marker-alt"></i> ${b.location}</p>
            <div class="card-footer">
              <span class="price">Desde ${b.price}</span>
              <button class="btn-book">Reservar</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 5️⃣ Búsqueda en tiempo real
    document.getElementById('search-input')?.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = barbers.filter(b => 
        b.name.toLowerCase().includes(query) || 
        b.location.toLowerCase().includes(query)
      );
      renderBarbers(filtered.length ? filtered : barbers);
    });

    // 6️⃣ Inicializar
    renderBarbers(barbers);
  </script>
</body>
</html>

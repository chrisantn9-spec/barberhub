<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | BarberHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estilos rápidos para que se vea bien */
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; cursor: zoom-out; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90%; border-radius: 10px; border: 2px solid var(--neon-cyan); }
        .avatar-container img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--neon-cyan); object-fit: cover; cursor: pointer; background: #111; }
        .btn-tiny { padding: 6px 10px; font-size: 1rem; cursor: pointer; border: none; border-radius: 4px; color: #fff; }
        .btn-pink { background: var(--neon-pink); }
        .btn-cyan { background: var(--neon-cyan); color: #000; }
        .job-card { background:rgba(0,0,0,0.4); border-left:3px solid var(--neon-pink); padding:12px; margin:8px 0; border-radius:0 6px 6px 0; cursor:pointer; }
    </style>
</head>
<body style="background:linear-gradient(180deg,#050505 0%,#0a0a1a 100%); min-height:100vh; padding-bottom:80px;">

    <!-- LIGHTBOX (Zoom) -->
    <div id="lightbox" class="lightbox" onclick="this.classList.remove('active')">
        <img id="lightbox-img" src="" alt="Zoom">
    </div>

   
    <header style="background:rgba(10,10,20,0.9); border-bottom:1px solid var(--neon-cyan); padding:20px; text-align:center;">
    <div class="avatar-container">
        <img id="client-avatar" src="https://via.placeholder.com/150/111111/00f2ff?text=USER" alt="Foto Perfil">
        <input type="file" id="avatar-input" accept="image/*" style="display:none;" onchange="uploadAvatar(this)">
    </div>
    <p style="font-size:0.7rem; color:var(--neon-cyan); margin-bottom:15px;">( Toca la foto para cambiarla )</p>

    <h1 id="client-name" style="font-family:'Orbitron'; color:#fff; margin:0; font-size:1.2rem;">Cargando...</h1>
    <p id="client-email" style="color:#888; font-size:0.8rem; margin:5px 0 15px;">...</p>
    
    <!-- ✅ BOTONES DE NAVEGACIÓN -->
    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:10px;">
        <a href="index.html" style="background:var(--neon-cyan); color:#000; padding:8px 16px; border-radius:5px; text-decoration:none; font-weight:bold; font-size:0.9rem;">🏠 Inicio</a>
        <a href="chat-list.html" style="background:#444; color:#fff; padding:8px 16px; border-radius:5px; text-decoration:none; font-weight:bold; font-size:0.9rem;">💬 Chats</a>
        <button onclick="logout()" style="background:#333; color:#fff; border:1px solid #555; padding:8px 16px; border-radius:5px; cursor:pointer; font-weight:bold; font-size:0.9rem;">🚪 Salir</button>
    </div>
</header>
    <!--  BOTONES DE NAVEGACIÓN -->
    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:10px;">
        <a href="index.html" style="background:var(--neon-cyan); color:#000; padding:8px 16px; border-radius:5px; text-decoration:none; font-weight:bold; font-size:0.9rem;">🏠 Inicio</a>
        <button onclick="window.location.href='index.html#job-section'" style="background:var(--neon-pink); color:#fff; border:none; padding:8px 16px; border-radius:5px; cursor:pointer; font-weight:bold; font-size:0.9rem;">💼 Empleos</button>
        <button onclick="logout()" style="background:#333; color:#fff; border:1px solid #555; padding:8px 16px; border-radius:5px; cursor:pointer; font-weight:bold; font-size:0.9rem;">🚪 Salir</button>
    </div>
</header>

    <main style="max-width:600px; margin:20px auto; padding:0 15px;">
        
        <!-- 💬 CHAT -->
        <!-- Notificaciones de mensajes -->
<div id="message-notifications" style="margin-top:15px; padding:10px; background:rgba(0,242,255,0.05); border:1px solid var(--neon-cyan); border-radius:6px;">
    <p style="color:#888; font-size:0.85rem; margin:0;">📬 Cargando mensajes...</p>
</div>
        <section class="cyber-section" style="margin-top:20px;">
            <h2 style="color:var(--neon-cyan); font-family:'Orbitron'; font-size:1rem; margin-bottom:10px;">💬 Mis Conversaciones</h2>
            <button onclick="window.location.href='chat-list.html'" style="background:var(--neon-cyan); color:#000; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:bold; width:100%;">Ver todos los mensajes</button>
        </section>

        <!-- 📸 FOTOS -->
        <section class="cyber-section" style="margin-top:20px;">
            <h2 style="color:var(--neon-cyan); font-family:'Orbitron'; font-size:1rem; margin-bottom:10px;">📸 Mis Fotos</h2>
            <div id="client-photos" style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:15px;"></div>
            <div style="display:flex; gap:5px; align-items:center;">
                <input type="text" id="new-photo-url" placeholder="Pegar URL..." style="flex:1; padding:8px; background:rgba(0,0,0,0.5); border:1px solid #444; color:#fff; border-radius:4px; font-size:0.8rem;">
                <button onclick="addPhoto()" class="btn-tiny btn-pink">➕</button>
                <button onclick="document.getElementById('photo-upload').click()" class="btn-tiny btn-cyan">📷</button>
                <input type="file" id="photo-upload" accept="image/*" style="display:none;" onchange="uploadPhoto(this)">
            </div>
        </section>

        <!-- 📍 CERCANAS -->
        <section class="cyber-section" style="margin-top:20px;">
            <h2 style="color:var(--neon-cyan); font-family:'Orbitron'; font-size:1rem; margin-bottom:10px;">📍 Cerca de Ti</h2>
            <div id="nearby-shops" style="color:#888; text-align:center; padding:10px;">Detectando...</div>
        </section>

        <!-- 💼 BOLSA DE TRABAJO -->
        <section class="cyber-section" style="margin-top:20px; border:1px solid var(--neon-pink); background:rgba(255,0,255,0.05);">
            <h2 style="color:var(--neon-pink); font-family:'Orbitron'; font-size:1rem; margin-bottom:10px;">💼 Bolsa de Trabajo</h2>
            <div id="job-board" style="min-height:50px;">Cargando ofertas...</div>
            <button onclick="window.location.href='crear-oferta.html'" style="width:100%; margin-top:10px; padding:10px; background:transparent; border:1px dashed var(--neon-pink); color:var(--neon-pink); border-radius:4px; cursor:pointer; font-weight:bold;">+ Publicar Oferta</button>
        </section>

    </main>

    <!--  AQUÍ SE CONECTAN LOS SCRIPTS (NO PEGUES CÓDIGO JS AQUÍ DENTRO) -->
    <script src="config.js"></script>
    <script src="perfil.js"></script>

</body>
</html>

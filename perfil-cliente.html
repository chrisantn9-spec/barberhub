<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | BarberHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Lightbox */
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; cursor: zoom-out; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90%; border-radius: 10px; border: 2px solid var(--neon-cyan); }
        
        /* Avatar */
        .avatar-container img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--neon-cyan); object-fit: cover; cursor: pointer; background: #111; transition: 0.3s; }
        .avatar-container img:hover { opacity: 0.8; transform: scale(1.05); }

        /* Botones de navegación */
        .nav-btn { padding: 8px 16px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 0.9rem; cursor: pointer; border: none; display: inline-block; text-align: center; }
        .btn-cyan { background: var(--neon-cyan); color: #000; }
        .btn-gray { background: #444; color: #fff; }
        .btn-out { background: #333; color: #fff; border: 1px solid #555 !important; }

        /* Estado de conexión */
        #connection-status { position: fixed; top: 10px; right: 10px; padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; display: flex; align-items: center; gap: 5px; z-index: 9999; transition: 0.3s; }
        .status-online { background: rgba(0,255,0,0.2); border: 1px solid #00ff00; color: #00ff00; }
        .status-offline { background: rgba(255,0,0,0.2); border: 1px solid #ff0000; color: #ff0000; }
        .pulse { width: 8px; height: 8px; border-radius: 50%; display: inline-block; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body style="background: linear-gradient(180deg, #050505 0%, #0a0a1a 100%); min-height: 100vh; padding-bottom: 80px; color: #fff;">

    <!-- 🟢 INDICADOR DE CONEXIÓN -->
    <div id="connection-status" class="status-online">
        <span class="pulse" style="background: #00ff00;"></span> Conectado
    </div>

    <!-- LIGHTBOX (Zoom de fotos) -->
    <div id="lightbox" class="lightbox" onclick="this.classList.remove('active')">
        <img id="lightbox-img" src="" alt="Zoom">
    </div>

    <!-- HEADER -->
    <header style="background: rgba(10,10,20,0.9); border-bottom: 1px solid var(--neon-cyan); padding: 20px; text-align: center;">
        <div class="avatar-container">
            <img id="client-avatar" src="https://via.placeholder.com/150/111111/00f2ff?text=USER" alt="Foto Perfil">
            <input type="file" id="avatar-input" accept="image/*" style="display:none;" onchange="uploadAvatar(this)">
        </div>
        <p style="font-size: 0.7rem; color: var(--neon-cyan); margin-bottom: 15px;">( Toca la foto para cambiarla )</p>

        <h1 id="client-name" style="font-family: 'Orbitron'; margin: 0; font-size: 1.2rem;">Cargando...</h1>
        <p id="client-email" style="color: #888; font-size: 0.8rem; margin: 5px 0 15px;">...</p>

        <!-- BOTONES DE NAVEGACIÓN -->
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px;">
            <a href="index.html" class="nav-btn btn-cyan">🏠 Inicio</a>
            <a href="chat-list.html" class="nav-btn btn-gray">💬 Chats</a>
            <button onclick="logout()" class="nav-btn btn-out"> Salir</button>
        </div>
    </header>

    <main style="max-width: 600px; margin: 20px auto; padding: 0 15px;">

        <!-- 💬 CONVERSACIONES -->
        <section style="margin-top: 20px;">
            <h2 style="color: var(--neon-cyan); font-family: 'Orbitron'; font-size: 1rem; margin-bottom: 10px;">💬 Mis Conversaciones</h2>
            <a href="chat-list.html" class="nav-btn btn-cyan" style="display: block; text-align: center; width: 100%; box-sizing: border-box;">Ver todos los mensajes</a>
            <div id="message-notifications" style="margin-top: 10px;"></div>
        </section>

        <!-- 📸 MIS FOTOS -->
        <section style="margin-top: 20px;">
            <h2 style="color: var(--neon-cyan); font-family: 'Orbitron'; font-size: 1rem; margin-bottom: 10px;">📸 Mis Fotos / Estilo</h2>
            <div id="client-photos" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px;"></div>
            <div style="display: flex; gap: 5px; align-items: center;">
                <input type="text" id="new-photo-url" placeholder="Pegar URL..." style="flex: 1; padding: 8px; background: rgba(0,0,0,0.5); border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 0.8rem;">
                <button onclick="addPhoto()" class="nav-btn" style="background: var(--neon-pink); color: #fff; padding: 6px 10px;">➕</button>
                <button onclick="document.getElementById('photo-upload').click()" class="nav-btn" style="background: var(--neon-cyan); color: #000; padding: 6px 10px;">📷</button>
                <input type="file" id="photo-upload" accept="image/*" style="display: none;" onchange="uploadPhoto(this)">
            </div>
            <p id="upload-status" style="font-size: 0.75rem; color: #888; margin-top: 5px; text-align: center;"></p>
        </section>

        <!-- ✂️ BARBEROS CERCANOS -->
        <section style="margin-top: 20px;">
            <h2 style="color: var(--neon-cyan); font-family: 'Orbitron'; font-size: 1rem; margin-bottom: 10px;">️ Barberos Cerca de Ti</h2>
            <div id="nearby-shops" style="color: #888; text-align: center; padding: 10px;">Detectando ubicación...</div>
        </section>

        <!--  BOLSA DE TRABAJO -->
        <section style="margin-top: 20px; border: 1px solid var(--neon-pink); background: rgba(255,0,255,0.05); padding: 15px; border-radius: 8px;">
            <h2 style="color: var(--neon-pink); font-family: 'Orbitron'; font-size: 1rem; margin-bottom: 10px;">💼 Bolsa de Trabajo</h2>
            <div id="job-board" style="min-height: 50px;">Cargando ofertas...</div>
            <a href="crear-oferta.html" class="nav-btn" style="background: transparent; border: 1px dashed var(--neon-pink); color: var(--neon-pink); display: block; text-align: center; margin-top: 10px; width: 100%; box-sizing: border-box;">+ Publicar Oferta</a>
        </section>

    </main>

    <!-- SCRIPTS -->
    <script src="config.js"></script>
    <script src="perfil.js"></script>
    
    <!-- LÓGICA DE CONEXIÓN -->
    <script>
        function updateConnection() {
            const el = document.getElementById('connection-status');
            if (navigator.onLine) {
                el.className = 'status-online';
                el.innerHTML = '<span class="pulse" style="background:#00ff00;"></span> Conectado';
            } else {
                el.className = 'status-offline';
                el.innerHTML = '<span class="pulse" style="background:#ff0000;"></span> Sin conexión';
            }
        }
        window.addEventListener('online', updateConnection);
        window.addEventListener('offline', updateConnection);
        updateConnection();
    </script>
</body>
</html>

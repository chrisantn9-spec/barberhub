<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descubrir - BarberHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- 🔝 HEADER STICKY + BÚSQUEDA -->
  <header class="app-header">
    <div class="header-top">
      <h1 class="logo-text">BARBER<span class="cyan">HUB</span></h1>
      <button class="icon-btn"><i class="fas fa-bell"></i></button>
    </div>
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" id="search-input" placeholder="Buscar barbero, zona o estilo...">
    </div>
  </header>

  <!-- 🏷️ FILTROS DESLIZABLES -->
  <div class="filter-scroller">
    <button class="chip active" data-filter="all">Todos</button>
    <button class="chip" data-filter="corte">Cortes</button>
    <button class="chip" data-filter="barba">Barba</button>
    <button class="chip" data-filter="premium">Premium</button>
    <button class="chip" data-filter="cerca">Cerca de ti</button>
  </div>

  <!-- 📦 GRID DE BARBERÍAS -->
  <main class="container feed-container">
    <div id="barber-grid" class="barber-grid"></div>
  </main>

<!-- MENÚ INFERIOR (Actualizado) --> <nav class="bottom-nav"> <!-- Inicio (Esta misma página) --> <a href="perfil-cliente.html" class="nav-link active"> <i class="fas fa-home"></i><span>Inicio</span> </a> <!-- Explorar (Nueva página) --> <a href="explorar.html" class="nav-link"> <i class="fas fa-compass"></i><span>Explorar</span> </a> <!-- Citas (Nueva página) --> <a href="mis-citas.html" class="nav-link"> <i class="fas fa-calendar-check"></i><span>Citas</span> </a> <!-- Perfil (Nueva página) --> <a href="mi-perfil.html" class="nav-link"> <i class="fas fa-user"></i><span>Perfil</span> </a> </nav>

  <!-- ✅ SCRIPT CORREGIDO: Ahora apunta a perfil.js -->
  <script src="perfil.js"></script>
</body>
</html>

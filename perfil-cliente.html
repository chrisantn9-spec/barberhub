<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - BarberHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- 🔥 Supabase CDN primero -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* Estilos específicos para el dashboard */
    body { background: linear-gradient(180deg, #050505 0%, #0a0a1a 100%); min-height: 100vh; padding-bottom: 80px; color: #fff; font-family: system-ui, sans-serif; margin: 0; }
    .header {
      padding: 20px; text-align: center;
      background: rgba(10,10,20,0.9); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,242,255,0.2);
      position: sticky; top: 0; z-index: 100;
    }
    .header h1 { font-family: 'Orbitron', sans-serif; color: #fff; margin: 0; font-size: 1.5rem; }
    .header h1 span { color: #00f2ff; }
    
    .search-bar { padding: 15px; display: flex; gap: 10px; }
    .search-bar input {
      flex: 1; padding: 12px 16px; border-radius: 10px;
      border: 1px solid rgba(0,242,255,0.3); background: rgba(15,15,25,0.7);
      color: #fff; font-size: 1rem;
    }
    .search-bar button {
      padding: 12px 20px; background: #00f2ff;
      border: none; border-radius: 10px; color: #000;
      font-weight: bold; cursor: pointer;
    }
    
    .section-title {
      padding: 0 20px; color: #fff; font-family: 'Orbitron', sans-serif;
      margin: 20px 0 10px; font-size: 1.2rem;
    }
    
    .barbers-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px; padding: 0 15px;
    }
    .barber-card {
      background: rgba(20,20,30,0.8); border: 1px solid rgba(0,242,255,0.2);
      border-radius: 15px; overflow: hidden; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .barber-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 20px rgba(0,242,255,0.2);
      border-color: #00f2ff;
    }
    .barber-img {
      width: 100%; height: 180px; object-fit: cover;
      background: linear-gradient(45deg, #1a1a2e, #16213e);
    }
    .barber-info { padding: 12px; }
    .barber-name { color: #fff; font-weight: 600; margin-bottom: 4px; font-size: 0.95rem; }
    .barber-location { color: #888; font-size: 0.8rem; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
    .barber-rating { color: #ffcc00; font-size: 0.85rem; font-weight: 500; }
    .barber-price { color: #00f2ff; font-weight: bold; margin-top: 8px; font-size: 1rem; }
    
    .prices-section {
      padding: 20px; background: rgba(20,20,30,0.5);
      margin: 20px 15px; border-radius: 15px;
      border: 1px solid rgba(255,0,255,0.2);
    }
    .price-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .price-item:last-child { border-bottom: none; }
    .price-name { color: #fff; font-weight: 500; }
    .price-value { color: #ff00ff; font-weight: bold; font-size: 1.1rem; }
    
    /* Bottom Nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(10,10,20,0.95); backdrop-filter: blur(10px);
      border-top: 1px solid rgba(0,242,255,0.2);
      display: flex; justify-content: space-around; padding: 10px 0;
      z-index: 1000;
    }
    .nav-link {
      display: flex; flex-direction: column; align-items: center;
      color: #888; text-decoration: none; font-size: 0.75rem;
      padding: 5px 10px; border-radius: 8px; transition: all 0.2s;
    }
    .nav-link i { font-size: 1.3rem; margin-bottom: 3px; }
    .nav-link:hover, .nav-link.active {
      color: #00f2ff;
      background: rgba(0,242,255,0.1);
    }
    .nav-link.active i { text-shadow: 0 0 10px #00f2ff; }
    
    .logout-btn {
      position: absolute; top: 15px; right: 15px;
      background: rgba(255,68,68,0.2); border: 1px solid rgba(255,68,68,0.4);
      color: #ff4444; padding: 8px 12px; border-radius: 8px;
      font-size: 0.8rem; cursor: pointer; text-decoration: none;
    }
    .logout-btn:hover { background: rgba(255,68,68,0.3); }
    
    .welcome-msg { text-align: center; padding: 10px 20px; color: #888; font-size: 0.95rem; }
    .welcome-msg span { color: #00f2ff; font-weight: bold; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1>Barber<span>Hub</span></h1>
    <a href="#" class="logout-btn" onclick="cerrarSesion(event)">
      <i class="fas fa-sign-out-alt"></i> Salir
    </a>
  </header>
  
  <!-- Mensaje de bienvenida con nombre dinámico -->
  <div class="welcome-msg">
    👋 Hola, <span id="user-name">Cargando...</span>
  </div>
  
  <!-- Search -->
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="🔍 Buscar barbero o servicio...">
    <button onclick="searchBarbers()"><i class="fas fa-search"></i></button>
  </div>
  
  <!-- Main Content -->
  <main>
    <!-- Precios -->
    <section class="prices-section">
      <h3 style="color:#ff00ff; margin:0 0 15px; font-family:'Orbitron', sans-serif;">💰 Precios</h3>
      <div class="price-item"><span class="price-name">Corte Clásico</span><span class="price-value">$15</span></div>
      <div class="price-item"><span class="price-name">Barba Completa</span><span class="price-value">$10</span></div>
      <div class="price-item"><span class="price-name">Corte + Barba</span><span class="price-value">$22</span></div>
      <div class="price-item"><span class="price-name">Afeitado Clásico</span><span class="price-value">$12</span></div>
      <div class="price-item"><span class="price-name">Cejas</span><span class="price-value">$5</span></div>
    </section>
    
    <!-- Barberos Destacados -->
    <h3 class="section-title">🔥 Barberos Destacados</h3>
    <div class="barbers-grid" id="barbers-list">
      <!-- Se llena con JS -->
    </div>
  </main>
  
  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="perfil-cliente.html" class="nav-link active">
      <i class="fas fa-home"></i><span>Inicio</span>
    </a>
    <a href="explorar.html" class="nav-link">
      <i class="fas fa-compass"></i><span>Explorar</span>
    </a>
    <a href="mis-citas.html" class="nav-link">
      <i class="fas fa-calendar-check"></i><span>Citas</span>
    </a>
    <a href="mi-perfil.html" class="nav-link">
      <i class="fas fa-user"></i><span>Perfil</span>
    </a>
  </nav>
  
  <!-- Scripts -->
  <script src="config.js"></script>
  <script>
    // 🔥 1. Verificar sesión y mostrar nombre al cargar
    document.addEventListener('DOMContentLoaded', async () => {
      // Verificar que supabaseClient existe
      if (!window.supabaseClient) {
        console.error('❌ Supabase no cargó');
        return;
      }

      try {
        const { data: { user }, error } = await supabaseClient.auth.getUser();
        
        if (error || !user) {
          // Si no hay sesión, redirigir al login
          window.location.href = 'auth.html';
          return;
        }

        // ✅ Obtener nombre real del usuario
        const nombre = user.user_metadata?.nombre || user.email?.split('@')[0] || 'Usuario';
        
        // ✅ Mostrar nombre en el span con id="user-name"
        const nombreEl = document.getElementById('user-name');
        if (nombreEl) nombreEl.textContent = nombre;

        // 🔒 Si es barbero, redirigir a su panel
        if (user.user_metadata?.role === 'barbero') {
          window.location.href = 'admin.html';
        }

      } catch (err) {
        console.error('Error verificando sesión:', err);
      }
    });
    
    // 🔥 2. Cerrar sesión correctamente con Supabase
    async function cerrarSesion(e) {
      if (e) e.preventDefault();
      if (!confirm('¿Cerrar sesión?')) return;
      
      try {
        await supabaseClient.auth.signOut();
        window.location.href = 'auth.html';
      } catch (err) {
        console.error('Error cerrando sesión:', err);
        // Forzar redirección aunque falle
        window.location.href = 'auth.html';
      }
    }
    
    // 🔥 3. Barberos de ejemplo (puedes conectar con Supabase después)
    const barbers = [
      { id: 1, name: "CyberCuts Studio", location: "Centro, Madrid", rating: 4.9, price: "$15", img: "https://placehold.co/300x400/111/00f2ff?text=CyberCuts" },
      { id: 2, name: "Neon Barber Shop", location: "Malasaña, Madrid", rating: 4.8, price: "$18", img: "https://placehold.co/300x400/111/ff00ff?text=Neon" },
      { id: 3, name: "Urban Blade", location: "Lavapiés, Madrid", rating: 4.7, price: "$14", img: "https://placehold.co/300x400/111/00ff88?text=Urban" },
      { id: 4, name: "Razor & Code", location: "Chueca, Madrid", rating: 5.0, price: "$20", img: "https://placehold.co/300x400/111/ffaa00?text=Razor" }
    ];
    
    // 🔥 4. Renderizar barberos
    function renderBarbers(list) {
      const container = document.getElementById('barbers-list');
      if (!container) return;
      
      container.innerHTML = '';
      list.forEach(b => {
        const card = document.createElement('div');
        card.className = 'barber-card';
        card.onclick = () => {
          // Guardar barbería y ir al chat o perfil
          sessionStorage.setItem('chatBarberId', b.id);
          sessionStorage.setItem('chatBarberName', b.name);
          window.location.href = 'chat.html';
        };
        card.innerHTML = `
          <img src="${b.img}" alt="${b.name}" class="barber-img">
          <div class="barber-info">
            <div class="barber-name">${b.name}</div>
            <div class="barber-location"><i class="fas fa-map-marker-alt"></i> ${b.location}</div>
            <div class="barber-rating"><i class="fas fa-star"></i> ${b.rating}</div>
            <div class="barber-price">Desde ${b.price}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }
    
    // 🔥 5. Búsqueda
    function searchBarbers() {
      const input = document.getElementById('search-input');
      if (!input) return;
      
      const query = input.value.toLowerCase();
      const filtered = barbers.filter(b => 
        b.name.toLowerCase().includes(query) || 
        b.location.toLowerCase().includes(query)
      );
      renderBarbers(filtered.length ? filtered : barbers);
    }
    
    // 🔥 6. Enter en búsqueda
    const searchInput = document.getElementById('search-input');
    if (searchInput) {
      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchBarbers();
      });
    }
    
    // 🔥 7. Inicializar barber list
    renderBarbers(barbers);
  </script>
</body>
</html>

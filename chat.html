<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Contactos | BarberHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root { 
      --neon-cyan: #00E5EE; 
      --neon-pink: #ff00ff;
      --neon-green: #00ff41;
      --dark-bg: #030303;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Rajdhani', sans-serif; 
      color: #fff; 
      min-height: 100vh; 
      background: var(--dark-bg); 
      overflow-x: hidden; 
      position: relative;
      padding: 20px;
    }
    
    /* 🌌 FONDO */
    .cyber-bg { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: linear-gradient(135deg, rgba(0,0,0,0.6) 0%, rgba(10,5,20,0.8) 100%), url('./fondochat.jpeg');
      background-size: cover; background-position: center; background-attachment: fixed; z-index: -3; 
    }
    .cyber-grid { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background-image: linear-gradient(rgba(0, 229, 238, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 238, 0.04) 1px, transparent 1px); 
      background-size: 60px 60px; z-index: -1; pointer-events: none; 
    }
    .rays { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -2; overflow: hidden; 
    }
    .ray { 
      position: absolute; width: 2px; height: 0; background: linear-gradient(to bottom, transparent, var(--neon-cyan), transparent); 
      border-radius: 2px; box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); animation: riseRay 4s infinite linear; opacity: 0; 
    }
    @keyframes riseRay { 
      0% { height: 0; top: 100%; opacity: 0; } 10% { opacity: 0.8; height: 60px; } 50% { height: 120px; } 90% { opacity: 0.8; height: 60px; } 100% { height: 0; top: -20%; opacity: 0; } 
    }

    /* 📦 CONTENEDOR PRINCIPAL */
    .container {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }
    
    /* 🎯 HEADER */
    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }
    .back-btn {
      width: 45px; height: 45px;
      background: rgba(0, 229, 238, 0.1);
      border: 1.5px solid rgba(0, 229, 238, 0.4);
      border-radius: 12px;
      color: var(--neon-cyan);
      font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      transition: all 0.2s;
      box-shadow: 0 0 15px rgba(0, 229, 238, 0.2);
    }
    .back-btn:hover { background: rgba(0, 229, 238, 0.2); box-shadow: 0 0 25px rgba(0, 229, 238, 0.5); transform: scale(1.05); }

    .header h1 {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 2px;
      flex: 1;
      background: linear-gradient(135deg, #fff 0%, var(--neon-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(0, 229, 238, 0.5));
    }

    /* 💬 LISTA DE CONTACTOS FLOTANTE */
    .contact-list { 
      display: flex; 
      flex-direction: column; 
      gap: 20px; 
      perspective: 1000px;
    }
    
    .contact-card { 
      display: flex; 
      align-items: center; 
      gap: 15px; 
      padding: 18px; 
      background: rgba(10, 15, 30, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 229, 238, 0.3);
      border-radius: 16px; 
      text-decoration: none;
      color: #fff;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.5),
        0 0 15px rgba(0, 229, 238, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    
    /* Efecto de brillo al pasar el mouse */
    .contact-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 229, 238, 0.15), transparent);
      transition: left 0.5s ease;
    }
    
    .contact-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--neon-cyan);
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.6),
        0 0 30px rgba(0, 229, 238, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    
    .contact-card:hover::before {
      left: 100%;
    }

    .contact-avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }
    
    .contact-avatar { 
      width: 60px; 
      height: 60px; 
      border-radius: 50%; 
      object-fit: cover;
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 229, 238, 0.4);
    }
    
    /* Indicador de estado "En línea" estilo MSN Futurista */
    .status-indicator {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      background: var(--neon-green);
      border: 2px solid #0a0f1e;
      border-radius: 50%;
      box-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
      animation: pulse-online 2s infinite;
    }
    .status-indicator.offline {
      background: #555;
      box-shadow: none;
      animation: none;
    }
    
    @keyframes pulse-online {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }

    .contact-info { 
      flex: 1; 
      min-width: 0; 
    }
    
    .contact-name { 
      font-family: 'Orbitron', sans-serif;
      font-weight: 700; 
      font-size: 1.1rem;
      margin-bottom: 4px; 
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 229, 238, 0.3);
    }
    
    .contact-last-msg { 
      color: rgba(255, 255, 255, 0.6); 
      font-size: 0.9rem; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }

    .contact-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }
    
    .contact-time { 
      color: var(--neon-cyan); 
      font-size: 0.75rem; 
      font-family: 'Orbitron', sans-serif;
    }
    
    .unread-badge {
      background: linear-gradient(135deg, var(--neon-pink), #ff0066);
      color: #fff;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(255, 0, 255, 0.6);
    }

    /* 📱 RESPONSIVE */
    @media (max-width: 500px) {
      body { padding: 15px; }
      .header h1 { font-size: 1.3rem; }
      .contact-avatar { width: 50px; height: 50px; }
    }
  </style>
</head>
<body>
  <!-- 🌌 FONDO CYBER -->
  <div class="cyber-bg"></div>
  <div class="cyber-grid"></div>
  <div class="rays" id="rays"></div>

  <div class="container">
    <!-- 🎯 HEADER -->
    <div class="header">
      <a href="perfil-cliente.html" class="back-btn" title="Volver al perfil">
        <i class="fas fa-arrow-left"></i>
      </a>
      <h1>💬 MIS CONTACTOS</h1>
    </div>
    
    <!-- 💬 LISTA DE CONTACTOS FLOTANTE -->
    <div class="contact-list">
      
      <!-- Contacto 1 -->
      <a href="chat-list.html?id=barbero_01" class="contact-card">
        <div class="contact-avatar-wrap">
          <img src="https://i.pravatar.cc/150?img=11" alt="Avatar" class="contact-avatar">
          <div class="status-indicator"></div>
        </div>
        <div class="contact-info">
          <div class="contact-name">Barbería Elite</div>
          <div class="contact-last-msg">¡Hola! Tu cita está confirmada para el viernes.</div>
        </div>
        <div class="contact-meta">
          <span class="contact-time">10:30</span>
          <span class="unread-badge">2</span>
        </div>
      </a>

      <!-- Contacto 2 -->
      <a href="chat-list.html?id=barbero_02" class="contact-card">
        <div class="contact-avatar-wrap">
          <img src="https://i.pravatar.cc/150?img=33" alt="Avatar" class="contact-avatar">
          <div class="status-indicator"></div>
        </div>
        <div class="contact-info">
          <div class="contact-name">Carlos "The Blade"</div>
          <div class="contact-last-msg">Claro, podemos cambiar el estilo del degradado.</div>
        </div>
        <div class="contact-meta">
          <span class="contact-time">Ayer</span>
        </div>
      </a>

      <!-- Contacto 3 -->
      <a href="chat-list.html?id=barbero_03" class="contact-card">
        <div class="contact-avatar-wrap">
          <img src="https://i.pravatar.cc/150?img=59" alt="Avatar" class="contact-avatar">
          <div class="status-indicator offline"></div>
        </div>
        <div class="contact-info">
          <div class="contact-name">Fade Masters</div>
          <div class="contact-last-msg">Gracias por tu visita, ¡vuelve pronto!</div>
        </div>
        <div class="contact-meta">
          <span class="contact-time">Lun</span>
        </div>
      </a>

      <!-- Contacto 4 -->
      <a href="chat-list.html?id=barbero_04" class="contact-card">
        <div class="contact-avatar-wrap">
          <img src="https://i.pravatar.cc/150?img=12" alt="Avatar" class="contact-avatar">
          <div class="status-indicator"></div>
        </div>
        <div class="contact-info">
          <div class="contact-name">Studio 54 Cuts</div>
          <div class="contact-last-msg">¿Te gustaría agendar para la próxima semana?</div>
        </div>
        <div class="contact-meta">
          <span class="contact-time">15:45</span>
          <span class="unread-badge">1</span>
        </div>
      </a>

    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // ⚡ Crear rayos de fondo
    (function createRays() {
      const container = document.getElementById('rays');
      if (!container) return;
      for (let i = 0; i < 15; i++) {
        const ray = document.createElement('div');
        ray.className = 'ray';
        ray.style.left = Math.random() * 100 + '%';
        ray.style.animationDelay = Math.random() * 4 + 's';
        ray.style.animationDuration = (3 + Math.random() * 3) + 's';
        container.appendChild(ray);
      }
    })();
  </script>
</body>
</html>

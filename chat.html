<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Chats | BarberHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root { 
      --neon-cyan: #00E5EE; 
      --neon-pink: #ff00ff;
      --neon-blue: #0072ff;
      --dark-bg: #030303;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Rajdhani', sans-serif; 
      color: #fff; 
      min-height: 100vh; 
      background: var(--dark-bg); 
      overflow-x: hidden; 
      position: relative;
      padding: 20px;
    }
    
    /* 🌌 FONDO CYBER CON fondochat.jpeg */
    .cyber-bg { 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: 
        linear-gradient(135deg, rgba(0,0,0,0.5) 0%, rgba(10,5,20,0.7) 100%), 
        radial-gradient(circle at 20% 30%, rgba(0, 229, 238, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.1) 0%, transparent 50%),
        url('./fondochat.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      z-index: -3; 
    }
    
    .cyber-grid { 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background-image: 
        linear-gradient(rgba(0, 229, 238, 0.04) 1px, transparent 1px), 
        linear-gradient(90deg, rgba(0, 229, 238, 0.04) 1px, transparent 1px); 
      background-size: 60px 60px; 
      z-index: -1; 
      pointer-events: none; 
    }
    
    .rays { 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      pointer-events: none; 
      z-index: -2; 
      overflow: hidden; 
    }
    
    .ray { 
      position: absolute; 
      width: 2px; 
      height: 0; 
      background: linear-gradient(to bottom, transparent, var(--neon-cyan), transparent); 
      border-radius: 2px; 
      box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); 
      animation: riseRay 4s infinite linear; 
      opacity: 0; 
    }
    
    @keyframes riseRay { 
      0% { height: 0; top: 100%; opacity: 0; } 
      10% { opacity: 0.8; height: 60px; } 
      50% { height: 120px; } 
      90% { opacity: 0.8; height: 60px; } 
      100% { height: 0; top: -20%; opacity: 0; } 
    }
    
    /* ✨ TEXTO NEÓN FLOTANTE */
    .neon-text-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }
    
    .neon-text {
      position: absolute;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      animation: fadeInOut 6s ease-in-out infinite;
      text-shadow: 
        0 0 10px currentColor,
        0 0 20px currentColor,
        0 0 40px currentColor,
        0 0 80px currentColor;
    }
    
    .neon-text.cyan {
      color: var(--neon-cyan);
    }
    
    .neon-text.pink {
      color: var(--neon-pink);
    }
    
    .neon-text.blue {
      color: var(--neon-blue);
    }
    
    @keyframes fadeInOut {
      0%, 100% { 
        opacity: 0; 
        transform: translateY(0) scale(0.8);
        filter: blur(5px);
      }
      10%, 90% { 
        opacity: 0.4; 
        transform: translateY(-20px) scale(1);
        filter: blur(0px);
      }
      50% { 
        opacity: 0.6;
        transform: translateY(-40px) scale(1.1);
      }
    }
    
    /* 📦 CONTENEDOR PRINCIPAL */
    .container {
      max-width: 700px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }
    
    /* 🎯 HEADER 3D */
    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
      perspective: 1000px;
    }
    
    .back-btn {
      width: 50px;
      height: 50px;
      background: linear-gradient(145deg, rgba(26, 26, 46, 0.9), rgba(10, 10, 21, 0.9));
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(0, 229, 238, 0.4);
      border-radius: 12px;
      color: var(--neon-cyan);
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 
        0 6px 0 #000,
        0 8px 15px rgba(0, 229, 238, 0.3),
        inset 0 1px 0 rgba(255,255,255,0.1);
      transition: all 0.15s ease;
      transform-style: preserve-3d;
      text-shadow: 0 0 10px var(--neon-cyan);
    }
    
    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 8px 0 #000,
        0 12px 25px rgba(0, 229, 238, 0.5),
        inset 0 1px 0 rgba(255,255,255,0.2);
      border-color: var(--neon-cyan);
    }
    
    .back-btn:active {
      transform: translateY(4px);
      box-shadow: 
        0 2px 0 #000,
        0 4px 10px rgba(0, 229, 238, 0.3),
        inset 0 1px 0 rgba(255,255,255,0.1);
    }
    
    .header h1 {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      flex: 1;
      background: linear-gradient(135deg, #fff 0%, var(--neon-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(0, 229, 238, 0.5);
      filter: drop-shadow(0 0 10px rgba(0, 229, 238, 0.3));
    }
    
    /* 💬 LISTA DE CHATS */
    #chat-list { 
      display: flex; 
      flex-direction: column; 
      gap: 15px; 
      perspective: 1500px;
    }
    
    .chat-item { 
      display: flex; 
      align-items: center; 
      gap: 15px; 
      padding: 18px; 
      background: linear-gradient(145deg, rgba(20, 20, 40, 0.85), rgba(10, 10, 25, 0.95));
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(0, 229, 238, 0.25);
      border-radius: 16px; 
      cursor: pointer; 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      box-shadow: 
        0 8px 0 rgba(0, 0, 0, 0.6),
        0 10px 30px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    
    .chat-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 229, 238, 0.1), transparent);
      transition: left 0.6s ease;
    }
    
    .chat-item:hover {
      transform: translateY(-5px) rotateX(3deg);
      border-color: var(--neon-cyan);
      box-shadow: 
        0 15px 0 rgba(0, 0, 0, 0.6),
        0 20px 40px rgba(0, 229, 238, 0.3),
        0 0 30px rgba(0, 229, 238, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    
    .chat-item:hover::before {
      left: 100%;
    }
    
    .chat-item:active {
      transform: translateY(2px);
      box-shadow: 
        0 3px 0 rgba(0, 0, 0, 0.6),
        0 5px 15px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    
    .chat-avatar { 
      width: 55px; 
      height: 55px; 
      border-radius: 50%; 
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: bold; 
      color: #000; 
      flex-shrink: 0;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      box-shadow: 
        0 0 20px rgba(0, 229, 238, 0.5),
        inset 0 0 15px rgba(255, 255, 255, 0.2),
        0 4px 10px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }
    
    .chat-avatar::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.3) 50%, transparent 60%);
      animation: shine 3s infinite;
    }
    
    @keyframes shine {
      0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }
    
    .chat-info { 
      flex: 1; 
      min-width: 0; 
    }
    
    .chat-name { 
      font-weight: 700; 
      margin-bottom: 5px; 
      font-size: 1.1rem;
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 229, 238, 0.3);
    }
    
    .chat-preview { 
      color: rgba(255, 255, 255, 0.6); 
      font-size: 0.9rem; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }
    
    .chat-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }
    
    .chat-time { 
      color: var(--neon-cyan); 
      font-size: 0.75rem; 
      font-family: 'Orbitron', sans-serif;
      text-shadow: 0 0 8px rgba(0, 229, 238, 0.5);
    }
    
    .unread-badge {
      background: linear-gradient(135deg, var(--neon-pink), #ff0066);
      color: #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(255, 0, 255, 0.6);
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 0, 255, 0.6); }
      50% { transform: scale(1.1); box-shadow: 0 0 25px rgba(255, 0, 255, 0.9); }
    }
    
    /* 🎯 BOTÓN FLOTANTE 3D - BUSCAR BARBERÍAS */
    .floating-3d-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 18px 28px;
      background: linear-gradient(145deg, #00e5ff, #0072ff);
      border: none;
      border-radius: 50px;
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      perspective: 1000px;
      transform-style: preserve-3d;
      box-shadow: 
        0 10px 0 #003d5c,
        0 12px 20px rgba(0, 0, 0, 0.5),
        0 0 30px rgba(0, 229, 238, 0.5),
        inset 0 2px 0 rgba(255, 255, 255, 0.3),
        inset 0 -2px 5px rgba(0, 0, 0, 0.2);
      transition: all 0.15s ease;
      z-index: 1000;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255,255,255,0.3);
    }
    
    .floating-3d-btn i {
      font-size: 1.2rem;
      filter: drop-shadow(0 0 5px rgba(0,0,0,0.3));
    }
    
    .floating-3d-btn:hover {
      transform: translateY(-3px);
      box-shadow: 
        0 13px 0 #003d5c,
        0 18px 35px rgba(0, 0, 0, 0.6),
        0 0 50px rgba(0, 229, 238, 0.8),
        inset 0 2px 0 rgba(255, 255, 255, 0.4),
        inset 0 -2px 5px rgba(0, 0, 0, 0.2);
    }
    
    .floating-3d-btn:active {
      transform: translateY(8px);
      box-shadow: 
        0 2px 0 #003d5c,
        0 4px 10px rgba(0, 0, 0, 0.5),
        0 0 20px rgba(0, 229, 238, 0.4),
        inset 0 2px 5px rgba(0, 0, 0, 0.3);
    }
    
    /* 🎯 BOTÓN FLOTANTE 3D - NUEVO CHAT (esquina izquierda) */
    .floating-3d-btn.secondary {
      right: auto;
      left: 30px;
      background: linear-gradient(145deg, #ff00ff, #8b008b);
      box-shadow: 
        0 10px 0 #4a004a,
        0 12px 20px rgba(0, 0, 0, 0.5),
        0 0 30px rgba(255, 0, 255, 0.5),
        inset 0 2px 0 rgba(255, 255, 255, 0.3),
        inset 0 -2px 5px rgba(0, 0, 0, 0.2);
    }
    
    .floating-3d-btn.secondary:hover {
      box-shadow: 
        0 13px 0 #4a004a,
        0 18px 35px rgba(0, 0, 0, 0.6),
        0 0 50px rgba(255, 0, 255, 0.8),
        inset 0 2px 0 rgba(255, 255, 255, 0.4),
        inset 0 -2px 5px rgba(0, 0, 0, 0.2);
    }
    
    .floating-3d-btn.secondary:active {
      box-shadow: 
        0 2px 0 #4a004a,
        0 4px 10px rgba(0, 0, 0, 0.5),
        0 0 20px rgba(255, 0, 255, 0.4),
        inset 0 2px 5px rgba(0, 0, 0, 0.3);
    }
    
    /* ✨ ESTADO VACÍO */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(10, 10, 25, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 229, 238, 0.2);
      border-radius: 16px;
    }
    
    .empty-state i {
      font-size: 4rem;
      color: var(--neon-cyan);
      margin-bottom: 20px;
      opacity: 0.5;
      text-shadow: 0 0 30px rgba(0, 229, 238, 0.5);
    }
    
    .empty-state h3 {
      font-family: 'Orbitron', sans-serif;
      margin-bottom: 10px;
      color: var(--neon-cyan);
    }
    
    /* 📱 RESPONSIVE */
    @media (max-width: 600px) {
      body { padding: 15px; }
      .header h1 { font-size: 1.3rem; }
      .floating-3d-btn {
        padding: 15px 20px;
        font-size: 0.85rem;
        bottom: 20px;
        right: 20px;
      }
      .floating-3d-btn.secondary {
        left: 20px;
      }
      .floating-3d-btn span {
        display: none;
      }
      .floating-3d-btn {
        width: 60px;
        height: 60px;
        padding: 0;
        border-radius: 50%;
        justify-content: center;
      }
      .floating-3d-btn i {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <!-- 🌌 FONDO CYBER CON fondochat.jpeg -->
  <div class="cyber-bg"></div>
  <div class="cyber-grid"></div>
  <div class="rays" id="rays"></div>
  
  <!-- ✨ TEXTO NEÓN FLOTANTE -->
  <div class="neon-text-container" id="neon-texts"></div>

  <div class="container">
    <!-- 🎯 HEADER -->
    <div class="header">
      <a href="perfil-cliente.html" class="back-btn" title="Volver">
        <i class="fas fa-arrow-left"></i>
      </a>
      <h1>💬 MIS CONVERSACIONES</h1>
    </div>
    
    <!-- 💬 LISTA DE CHATS -->
    <div id="chat-list">
      <p style="text-align:center; color:#666; margin-top:50px;">Cargando...</p>
    </div>
  </div>

  <!-- 🎯 BOTONES FLOTANTES 3D -->
  <a href="perfil-cliente.html" class="floating-3d-btn secondary" title="Nuevo Chat">
    <i class="fas fa-plus"></i>
    <span>Nuevo Chat</span>
  </a>
  
  <a href="explorar.html" class="floating-3d-btn" title="Buscar Barberías">
    <i class="fas fa-compass"></i>
    <span>Explorar</span>
  </a>

  <script src="config.js"></script>
  <script src="chat-list.js"></script>
  
  <script>
    // ⚡ Crear rayos de fondo
    (function createRays() {
      const container = document.getElementById('rays');
      if (!container) return;
      for (let i = 0; i < 20; i++) {
        const ray = document.createElement('div');
        ray.className = 'ray';
        ray.style.left = Math.random() * 100 + '%';
        ray.style.animationDelay = Math.random() * 4 + 's';
        ray.style.animationDuration = (3 + Math.random() * 3) + 's';
        container.appendChild(ray);
      }
    })();
    
    // ✨ Crear texto neón flotante
    (function createNeonTexts() {
      const container = document.getElementById('neon-texts');
      if (!container) return;
      
      const texts = [
        'BARBER', 'HUB', 'CHAT', 'STYLE', 'BARBERO', 
        'CLIENTE', 'CITA', 'PREMIUM', 'ONLINE', '24/7'
      ];
      
      const colors = ['cyan', 'pink', 'blue'];
      
      for (let i = 0; i < 12; i++) {
        const textEl = document.createElement('div');
        textEl.className = `neon-text ${colors[Math.floor(Math.random() * colors.length)]}`;
        textEl.textContent = texts[Math.floor(Math.random() * texts.length)];
        
        // Posición aleatoria
        textEl.style.left = Math.random() * 90 + '%';
        textEl.style.top = Math.random() * 90 + '%';
        
        // Tamaño aleatorio
        const size = 0.8 + Math.random() * 1.5;
        textEl.style.fontSize = `${size}rem`;
        
        // Delay aleatorio para la animación
        textEl.style.animationDelay = `${Math.random() * 6}s`;
        textEl.style.animationDuration = `${5 + Math.random() * 4}s`;
        
        container.appendChild(textEl);
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat | BarberHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root { 
      --neon-cyan: #00E5EE; 
      --neon-pink: #ff00ff;
      --neon-green: #00ff41;
      --neon-red: #ff003c;
      --dark-bg: #030303;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Rajdhani', sans-serif; 
      color: #fff; 
      height: 100vh; 
      background: var(--dark-bg); 
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    /* 🌌 FONDO */
    .cyber-bg { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: linear-gradient(135deg, rgba(0,0,0,0.6) 0%, rgba(10,5,20,0.8) 100%), url('./fondochat.jpeg');
      background-size: cover; background-position: center; z-index: -2; 
    }
    .cyber-grid { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background-image: linear-gradient(rgba(0, 229, 238, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 238, 0.05) 1px, transparent 1px); 
      background-size: 40px 40px; z-index: -1; pointer-events: none; 
    }

    /* 📱 HEADER ESTILO MSN FUTURISTA */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(0, 229, 238, 0.3);
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }
    
    .back-btn {
      width: 40px; height: 40px;
      background: rgba(0, 229, 238, 0.1);
      border: 1px solid rgba(0, 229, 238, 0.4);
      border-radius: 10px;
      color: var(--neon-cyan);
      font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      transition: all 0.2s;
    }
    .back-btn:hover { background: rgba(0, 229, 238, 0.2); box-shadow: 0 0 15px rgba(0, 229, 238, 0.4); }

    .barber-info { flex: 1; display: flex; align-items: center; gap: 12px; }
    
    .barber-avatar {
      width: 45px; height: 45px;
      border-radius: 50%;
      border: 2px solid var(--neon-cyan);
      object-fit: cover;
      box-shadow: 0 0 15px rgba(0, 229, 238, 0.4);
    }
    
    .barber-details { display: flex; flex-direction: column; }
    .barber-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 229, 238, 0.5);
    }
    
    /* 🟢 INDICADOR DE ESTADO (Estilo MSN Futurista) */
    .status-container { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--neon-green);
      box-shadow: 0 0 8px var(--neon-green), 0 0 15px var(--neon-green);
      animation: pulse-green 2s infinite;
    }
    .status-dot.offline {
      background: var(--neon-red);
      box-shadow: 0 0 8px var(--neon-red), 0 0 15px var(--neon-red);
      animation: none;
    }
    .status-text {
      font-size: 0.8rem;
      color: var(--neon-green);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .status-text.offline { color: var(--neon-red); }
    
    @keyframes pulse-green {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }

    /* 💬 ÁREA DE MENSAJES */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      scroll-behavior: smooth;
    }
    
    /* Scrollbar futurista */
    .chat-area::-webkit-scrollbar { width: 6px; }
    .chat-area::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
    .chat-area::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 3px; }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      position: relative;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.8) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .message.received {
      align-self: flex-start;
      background: rgba(255, 0, 255, 0.15);
      border: 1px solid rgba(255, 0, 255, 0.3);
      border-bottom-left-radius: 4px;
      color: #fff;
      backdrop-filter: blur(5px);
    }
    
    .message.sent {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(0, 229, 238, 0.2), rgba(0, 114, 255, 0.2));
      border: 1px solid rgba(0, 229, 238, 0.4);
      border-bottom-right-radius: 4px;
      color: #fff;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 15px rgba(0, 229, 238, 0.1);
    }
    
    .message-time {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 5px;
      text-align: right;
      font-family: 'Orbitron', sans-serif;
    }

    /* ⌨️ ÁREA DE INPUT */
    .input-area {
      padding: 15px 20px;
      background: rgba(10, 15, 30, 0.9);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(0, 229, 238, 0.3);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    .chat-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 229, 238, 0.3);
      border-radius: 25px;
      padding: 12px 20px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }
    .chat-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 229, 238, 0.2);
    }
    .chat-input::placeholder { color: rgba(255, 255, 255, 0.4); }
    
    .send-btn {
      width: 45px; height: 45px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
      border: none;
      border-radius: 50%;
      color: #000;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      box-shadow: 0 0 15px rgba(0, 229, 238, 0.4);
    }
    .send-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(0, 229, 238, 0.7);
    }
    .send-btn:active { transform: scale(0.95); }

    /* Estado vacío o de carga */
    .empty-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      padding: 20px;
    }
    .empty-chat i { font-size: 3rem; margin-bottom: 15px; color: var(--neon-cyan); opacity: 0.5; }
  </style>
</head>
<body>
  <div class="cyber-bg"></div>
  <div class="cyber-grid"></div>

  <!-- HEADER ESTILO MSN FUTURISTA -->
  <div class="chat-header">
    <a href="chat-list.html" class="back-btn" title="Volver a la lista">
      <i class="fas fa-arrow-left"></i>
    </a>
    <div class="barber-info">
      <img src="https://placehold.co/100x100/111/00E5EE?text=💈" alt="Barbero" class="barber-avatar" id="barber-avatar">
      <div class="barber-details">
        <div class="barber-name" id="barber-name">Cargando...</div>
        <div class="status-container">
          <div class="status-dot" id="status-dot"></div>
          <span class="status-text" id="status-text">En línea</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ÁREA DE MENSAJES -->
  <div class="chat-area" id="chat-area">
    <!-- Los mensajes se insertarán aquí dinámicamente -->
    <div class="empty-chat" id="empty-state">
      <i class="fas fa-comments"></i>
      <p>Selecciona un barbero desde la lista para comenzar a chatear.</p>
    </div>
  </div>

  <!-- ÁREA DE INPUT -->
  <div class="input-area">
    <input type="text" class="chat-input" id="message-input" placeholder="Escribe un mensaje..." autocomplete="off">
    <button class="send-btn" id="send-btn" title="Enviar">
      <i class="fas fa-paper-plane"></i>
    </button>
  </div>

  <script src="config.js"></script>
  <script>
    let currentBarberId = null;
    let currentUserId = null;
    let supabaseClient = null;

    // 1. Inicializar y obtener parámetros de la URL
    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof supabase === 'undefined') {
        console.error('❌ Supabase no cargó');
        return;
      }
      
      // Asumimos que config.js expone la URL y la KEY, o las definimos aquí si es necesario
      // Si config.js ya crea `supabaseClient`, úsalo. Si no, créalo:
      supabaseClient = window.supabaseClient || window.supabase.createClient('TU_SUPABASE_URL', 'TU_SUPABASE_ANON_KEY');

      const urlParams = new URLSearchParams(window.location.search);
      currentBarberId = urlParams.get('id'); // Ej: chat.html?id=barbero_123

      if (!currentBarberId) {
        document.getElementById('empty-state').style.display = 'flex';
        document.querySelector('.chat-area').style.display = 'flex';
        document.querySelector('.input-area').style.display = 'none';
        return;
      }

      // Ocultar estado vacío
      document.getElementById('empty-state').style.display = 'none';

      // 2. Verificar sesión del usuario actual
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.replace('/auth.html');
        return;
      }
      currentUserId = session.user.id;

      // 3. Cargar datos del barbero (Simulado o real desde Supabase)
      loadBarberData(currentBarberId);

      // 4. Cargar mensajes iniciales
      loadMessages();

      // 5. Escuchar nuevos mensajes en tiempo real
      subscribeToMessages();

      // 6. Event Listeners para enviar
      document.getElementById('send-btn').addEventListener('click', sendMessage);
      document.getElementById('message-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
      });
    });

    // Cargar datos del barbero (Aquí puedes conectarlo a tu tabla 'profiles' o 'barbers')
    async function loadBarberData(barberId) {
      try {
        // Ejemplo real con Supabase (descomenta y ajusta el nombre de tu tabla):
        // const { data, error } = await supabaseClient.from('profiles').select('nombre, avatar, is_online').eq('id', barberId).single();
        
        // Mock de datos para que veas el diseño funcionando inmediatamente:
        const mockData = {
          nombre: "Barbería Elite",
          avatar: "https://placehold.co/100x100/111/00E5EE?text=💈",
          is_online: true
        };

        document.getElementById('barber-name').textContent = mockData.nombre;
        document.getElementById('barber-avatar').src = mockData.avatar;
        
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        
        if (mockData.is_online) {
          statusDot.classList.remove('offline');
          statusText.classList.remove('offline');
          statusText.textContent = 'En línea';
        } else {
          statusDot.classList.add('offline');
          statusText.classList.add('offline');
          statusText.textContent = 'Desconectado';
        }
      } catch (err) {
        console.error('Error cargando datos del barbero:', err);
      }
    }

    // Cargar historial de mensajes
    async function loadMessages() {
      try {
        // Ejemplo real con Supabase:
        // const { data, error } = await supabaseClient
        //   .from('messages')
        //   .select('*')
        //   .or(`sender_id.eq.${currentUserId},receiver_id.eq.${currentUserId}`)
        //   .or(`sender_id.eq.${currentBarberId},receiver_id.eq.${currentBarberId}`)
        //   .order('created_at', { ascending: true });

        // Mock de mensajes iniciales:
        const mockMessages = [
          { sender_id: currentBarberId, text: '¡Hola! ¿En qué puedo ayudarte hoy?', created_at: new Date().toISOString() },
          { sender_id: currentUserId, text: 'Hola, quisiera agendar una cita para el viernes.', created_at: new Date().toISOString() }
        ];

        const chatArea = document.getElementById('chat-area');
        chatArea.innerHTML = ''; // Limpiar estado vacío

        mockMessages.forEach(msg => {
          appendMessageToDOM(msg.text, msg.sender_id === currentUserId, msg.created_at);
        });
        
        scrollToBottom();
      } catch (err) {
        console.error('Error cargando mensajes:', err);
      }
    }

    // Enviar un nuevo mensaje
    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      // 1. Mostrar en el DOM inmediatamente (optimistic UI)
      const now = new Date().toISOString();
      appendMessageToDOM(text, true, now);
      input.value = '';
      scrollToBottom();

      // 2. Guardar en Supabase (Descomenta para producción)
      /*
      try {
        const { error } = await supabaseClient.from('messages').insert({
          sender_id: currentUserId,
          receiver_id: currentBarberId,
          text: text,
          created_at: now
        });
        if (error) throw error;
      } catch (err) {
        console.error('Error enviando mensaje:', err);
        alert('No se pudo enviar el mensaje');
      }
      */
    }

    // Agregar mensaje al HTML
    function appendMessageToDOM(text, isSent, timestamp) {
      const chatArea = document.getElementById('chat-area');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;
      
      const timeStr = new Date(timestamp).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      
      msgDiv.innerHTML = `
        ${text}
        <div class="message-time">${timeStr}</div>
      `;
      
      chatArea.appendChild(msgDiv);
    }

    // Escuchar mensajes en tiempo real (Estilo MSN, llega y aparece)
    function subscribeToMessages() {
      // Ejemplo real con Supabase Realtime:
      /*
      supabaseClient
        .channel(`chat:${currentBarberId}`)
        .on('postgres_changes', { 
          event: 'INSERT', 
          schema: 'public', 
          table: 'messages',
          filter: `sender_id=eq.${currentBarberId}`
        }, (payload) => {
          const msg = payload.new;
          appendMessageToDOM(msg.text, false, msg.created_at);
          scrollToBottom();
          
          // Opcional: Sonido de notificación tipo MSN
          // playNotificationSound();
        })
        .subscribe();
      */
    }

    function scrollToBottom() {
      const chatArea = document.getElementById('chat-area');
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // Función opcional para sonido de notificación
    function playNotificationSound() {
      const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQ=='); // Reemplazar con URL de sonido real
      audio.volume = 0.3;
      audio.play().catch(() => {});
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="apple-touch-icon" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | BarberHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #050505; display: flex; flex-direction: column; height: 100vh; margin: 0; color: #fff; }
        header { background: rgba(15,15,25,0.95); padding: 15px; border-bottom: 1px solid var(--neon-cyan); display: flex; align-items: center; gap: 10px; }
        header h1 { color: #fff; font-family: 'Orbitron'; font-size: 1rem; margin: 0; flex: 1; }
        .btn-back { color: var(--neon-cyan); text-decoration: none; font-size: 1.2rem; cursor: pointer; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; }
        .msg.client { background: rgba(0, 242, 255, 0.15); border: 1px solid rgba(0, 242, 255, 0.3); align-self: flex-end; color: #e0f7fa; }
        .msg.barber { background: rgba(255, 0, 255, 0.15); border: 1px solid rgba(255, 0, 255, 0.3); align-self: flex-start; color: #fce4ec; }
        .msg .meta { font-size: 0.65rem; opacity: 0.6; margin-top: 4px; display: block; text-align: right; }
        .chat-input-area { padding: 10px; background: #0a0a12; border-top: 1px solid #333; display: flex; gap: 8px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #444; background: #111; color: #fff; outline: none; }
        button#send-btn { background: var(--neon-cyan); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; color: #000; font-size: 1.2rem; }
    </style>
</head>
<body>
    <header>
        <a href="javascript:history.back()" class="btn-back">←</a>
        <h1 id="chat-title">💬 Cargando...</h1>
    </header>
    <div id="chat-messages"></div>
    <div class="chat-input-area">
        <input type="text" id="msg-input" placeholder="Escribe tu mensaje...">
        <button id="send-btn">➤</button>
    </div>

    <script src="config.js"></script>
    <script>
        // Obtener y VALIDAR datos
        const barberId = sessionStorage.getItem('chatBarberId');
        const barberName = sessionStorage.getItem('chatBarberName') || 'Barbería';
        
        console.log("Chat iniciado con ID:", barberId);
        
        // Validación estricta
        if (!barberId || barberId === 'undefined' || barberId === 'null' || barberId.includes('${')) {
            alert("❌ Error de conexión. Por favor, vuelve a seleccionar la barbería.");
            window.location.href = 'index.html';
        }

        document.getElementById('chat-title').textContent = `💬 Chat con ${barberName}`;

        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const chatBox = document.getElementById('chat-messages');

        let userName = sessionStorage.getItem('chatUserName');
        if (!userName) {
            userName = prompt("¿Cómo te llamas?") || "Cliente";
            sessionStorage.setItem('chatUserName', userName);
        }

        async function loadMessages() {
            try {
                const { data, error } = await supabaseClient
                    .from('messages')
                    .select('*')
                    .eq('barber_id', barberId)
                    .order('created_at', { ascending: true });

                if (error) throw error;

                chatBox.innerHTML = '';
                if (data.length === 0) {
                    chatBox.innerHTML = '<p style="text-align:center; color:#666; margin-top:50px;">💬 Inicia la conversación</p>';
                    return;
                }

                data.forEach(msg => {
                    const isMe = msg.user_name === userName;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'client' : 'barber'}`;
                    div.innerHTML = `${msg.message}<span class="meta">${msg.user_name} • ${new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>`;
                    chatBox.appendChild(div);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                console.error("Error:", err);
            }
        }

        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;

            try {
                console.log("Enviando a barber_id:", barberId);
                
                const { error } = await supabaseClient.from('messages').insert([{
                    barber_id: barberId,
                    user_name: userName,
                    message: text
                }]);

                if (error) throw error;

                msgInput.value = '';
                loadMessages();
            } catch (err) {
                console.error("Error enviando:", err);
                alert("❌ Error: " + err.message);
            }
        }

        sendBtn.onclick = sendMessage;
        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        
        loadMessages();
        setInterval(loadMessages, 3000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat | BarberHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- 🔥 Supabase CDN primero -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: linear-gradient(180deg, #050505 0%, #0a0a1a 100%); min-height: 100vh; color: #fff; margin: 0; display: flex; flex-direction: column; }
    .header { padding: 15px; display: flex; align-items: center; gap: 10px; background: rgba(10,10,20,0.95); border-bottom: 1px solid var(--neon-cyan); }
    .header a { color: var(--neon-cyan); text-decoration: none; font-size: 1.2rem; }
    .header h2 { margin: 0; flex: 1; font-family: 'Orbitron'; font-size: 1.1rem; }
    #chat-messages { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 90px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; word-wrap: break-word; }
    .msg.client { background: var(--neon-cyan); color: #000; margin-left: auto; border-bottom-right-radius: 2px; }
    .msg.barber { background: rgba(20,20,30,0.8); border: 1px solid rgba(0,242,255,0.2); margin-right: auto; border-bottom-left-radius: 2px; }
    .chat-input-area { position: fixed; bottom: 0; left: 0; right: 0; padding: 10px; background: rgba(10,10,20,0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--neon-cyan); display: flex; gap: 10px; }
    #msg-input { flex: 1; padding: 12px 16px; border-radius: 25px; border: 1px solid var(--neon-cyan); background: rgba(0,0,0,0.5); color: #fff; outline: none; }
    #send-btn { padding: 12px 20px; background: var(--neon-cyan); color: #000; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <a href="chat-list.html">←</a>
    <h2 id="chat-title">💬 Cargando...</h2>
  </div>
  <div id="chat-messages"></div>
  <div class="chat-input-area">
    <input type="text" id="msg-input" placeholder="Escribe un mensaje...">
    <button type="button" id="send-btn">➤</button>
  </div>
  <script src="config.js"></script>
  <script src="chat.js"></script>
</body>
</html>

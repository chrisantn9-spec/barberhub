<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | BarberHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #050505; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header { background: rgba(15,15,25,0.95); padding: 15px; border-bottom: 1px solid var(--neon-cyan); display: flex; align-items: center; gap: 10px; }
        header h1 { color: #fff; font-family: 'Orbitron'; font-size: 1rem; margin: 0; flex: 1; }
        .btn-back { color: var(--neon-cyan); text-decoration: none; font-size: 1.2rem; cursor: pointer; }
        
        #chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; }
        .msg.client { background: rgba(0, 242, 255, 0.15); border: 1px solid rgba(0, 242, 255, 0.3); align-self: flex-end; color: #e0f7fa; }
        .msg.barber { background: rgba(255, 0, 255, 0.15); border: 1px solid rgba(255, 0, 255, 0.3); align-self: flex-start; color: #fce4ec; }
        .msg .meta { font-size: 0.65rem; opacity: 0.6; margin-top: 4px; display: block; text-align: right; }

        .chat-input-area { padding: 10px; background: #0a0a12; border-top: 1px solid #333; display: flex; gap: 8px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #444; background: #111; color: #fff; outline: none; }
        button#send-btn { background: var(--neon-cyan); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; color: #000; font-size: 1.2rem; }
    </style>
</head>
<body>
    <header>
        <a href="javascript:history.back()" class="btn-back">←</a>
        <h1 id="chat-title">💬 Cargando chat...</h1>
    </header>

    <div id="chat-messages"></div>

    <div class="chat-input-area">
        <input type="text" id="msg-input" placeholder="Escribe tu mensaje...">
        <button id="send-btn">➤</button>
    </div>

    <script src="config.js"></script>
    <script src="chat.js"></script>
</body>
</html>

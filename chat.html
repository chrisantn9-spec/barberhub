<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | BarberHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background:linear-gradient(180deg,#050505 0%,#0a0a1a 100%); min-height:100vh; color:#fff; margin:0; display:flex; flex-direction:column;">
    
    <div style="padding:15px; display:flex; align-items:center; gap:10px; background:rgba(10,10,20,0.9); border-bottom:1px solid var(--neon-cyan);">
        <a href="javascript:history.back()" style="color:var(--neon-cyan); text-decoration:none; font-size:1.2rem;">←</a>
        <h2 id="chat-title" style="margin:0; flex:1; font-family:'Orbitron';">💬 Cargando...</h2>
    </div>

    <div id="chat-messages" style="flex:1; overflow-y:auto; padding:15px; padding-bottom:90px;"></div>

    <div style="position:fixed; bottom:0; left:0; right:0; padding:10px; background:rgba(10,10,20,0.95); backdrop-filter:blur(10px); border-top:1px solid var(--neon-cyan); display:flex; gap:10px;">
        <input type="text" id="msg-input" placeholder="Escribe un mensaje..." style="flex:1; padding:12px; border-radius:20px; border:1px solid var(--neon-cyan); background:rgba(0,0,0,0.5); color:#fff; outline:none;">
        <!-- 🔥 CAMBIO CLAVE: type="button" evita el reset -->
        <button type="button" id="send-btn" style="padding:12px 20px; background:var(--neon-cyan); color:#000; border:none; border-radius:20px; font-weight:bold; cursor:pointer;">➤</button>
    </div>

    <script src="config.js"></script>
    <script src="chat.js"></script>
</body>
</html>

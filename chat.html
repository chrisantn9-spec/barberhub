<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💈</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ✅ FIX DEFINITIVO: Favicon autocontenido -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💈</text></svg>">
    <title>Chat | BarberHub</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #050505; color: #fff; font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        header { background: #0a0a12; padding: 12px 15px; border-bottom: 1px solid #00f2ff; display: flex; align-items: center; gap: 10px; }
        header h1 { font-size: 1rem; flex: 1; }
        .back { color: #00f2ff; text-decoration: none; font-size: 1.2rem; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 10px 12px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
        .msg.client { background: rgba(0,242,255,0.15); align-self: flex-end; border: 1px solid rgba(0,242,255,0.3); }
        .msg.barber { background: rgba(255,0,255,0.15); align-self: flex-start; border: 1px solid rgba(255,0,255,0.3); }
        .meta { font-size: 0.7rem; opacity: 0.6; margin-top: 4px; display: block; text-align: right; }
        .input-area { padding: 10px; background: #0a0a12; border-top: 1px solid #333; display: flex; gap: 8px; }
        #msg-input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #444; background: #111; color: #fff; outline: none; font-size: 1rem; }
        #send-btn { background: #00f2ff; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; color: #000; font-size: 1.2rem; }
    </style>
</head>
<body>
    <header>
        <a href="javascript:history.back()" class="back">←</a>
        <h1 id="chat-title">💬 Cargando...</h1>
    </header>
    <div id="chat-messages"></div>
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Escribe un mensaje...">
        <button id="send-btn">➤</button>
    </div>

    <script src="config.js"></script>
    <script>
        const barberId = sessionStorage.getItem('chatBarberId');
        const barberName = sessionStorage.getItem('chatBarberName') || 'Barbería';
        let userName = sessionStorage.getItem('chatUserName') || prompt('¿Tu nombre?') || 'Cliente';
        sessionStorage.setItem('chatUserName', userName);

        if (!barberId) window.location.href = 'index.html';
        document.getElementById('chat-title').textContent = `💬 Chat con ${barberName}`;

        const chatBox = document.getElementById('chat-messages');
        const input = document.getElementById('msg-input');
        const btn = document.getElementById('send-btn');

        function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

        async function load() {
            try {
                const { data, error } = await supabaseClient.from('messages').select('*').eq('barber_id', barberId).order('created_at', { ascending: true });
                if (error) throw error;
                chatBox.innerHTML = data.length ? '' : '<p style="text-align:center;color:#666;margin-top:40px;">Inicia la conversación</p>';
                data.forEach(m => {
                    const isMe = m.user_name === userName;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'client' : 'barber'}`;
                    div.innerHTML = `${esc(m.message)}<span class="meta">${esc(m.user_name)} • ${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>`;
                    chatBox.appendChild(div);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch(e) { console.error(e); }
        }

        async function send() {
            const t = input.value.trim(); if(!t) return;
            try {
                await supabaseClient.from('messages').insert([{ barber_id: barberId, user_name: userName, message: t }]);
                input.value = ''; load();
            } catch(e) { alert('Error: ' + e.message); }
        }

        btn.onclick = send;
        input.addEventListener('keypress', e => { if(e.key === 'Enter') send(); });
        load();
        setInterval(load, 3000);
    </script>
</body>
</html>

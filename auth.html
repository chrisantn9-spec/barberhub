<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BarberHub</title>
  
  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 🌍 International Phone Input (Librerías) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/css/intlTelInput.css">
  <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/intlTelInput.min.js"></script>
  
  <!-- Tu CSS principal -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Estilos específicos para login */
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: rgba(10, 10, 20, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 242, 255, 0.2);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 30px rgba(0, 242, 255, 0.15);
    }
    .login-box h2 {
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      margin-bottom: 8px;
      color: #fff;
      font-size: 1.8rem;
    }
    .login-box .subtitle {
      text-align: center;
      color: #a0a0b0;
      margin-bottom: 32px;
      font-size: 0.95rem;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #fff;
      font-weight: 500;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 15, 25, 0.7);
      border: 1px solid rgba(0, 242, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 242, 255, 0.2);
    }
    .error-message {
      background: rgba(255, 68, 68, 0.15);
      border: 1px solid rgba(255, 68, 68, 0.3);
      color: #ff4444;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 0.9rem;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00f2ff, #00c3ff);
      border: none;
      border-radius: 10px;
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: filter 0.2s;
      margin-bottom: 20px;
    }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.1); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .btn-secondary {
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #aaa;
      font-weight: 500;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); color: #fff; }
    
    .divider {
      text-align: center;
      margin: 24px 0;
      position: relative;
    }
    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0; right: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }
    .divider span {
      background: rgba(10, 10, 20, 0.85);
      padding: 0 16px;
      color: #666;
      font-size: 0.85rem;
      position: relative;
    }
    .social-login { display: flex; flex-direction: column; gap: 12px; }
    .btn-social {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #fff;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.95rem;
    }
    .btn-social.google { border-color: #db4437; }
    .btn-social.google:hover { background: rgba(219, 68, 55, 0.1); }
    .btn-social.google i { color: #db4437; font-size: 1.2rem; }
    .register-link {
      text-align: center;
      margin-top: 24px;
      color: #a0a0b0;
      font-size: 0.9rem;
    }
    .register-link a {
      color: var(--neon-cyan);
      text-decoration: none;
      font-weight: 600;
    }
    
    /* Estilos para el input de teléfono con bandera */
    .iti { width: 100%; }
    .iti__country-list {
      background: #1a1a2e;
      border: 1px solid rgba(0,242,255,0.2);
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 242, 255, 0.2);
    }
    .iti__country { padding: 8px 12px; color: #fff; }
    .iti__country:hover { background: rgba(0, 242, 255, 0.1); }
    .iti__highlight { background: rgba(0, 242, 255, 0.2) !important; }
    .iti__dial-code { color: #888; }
    #phone-input {
      width: 100%;
      padding: 12px 12px 12px 52px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(0, 242, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      transition: all 0.3s;
    }
    #phone-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
      outline: none;
    }
    #otp-input {
      text-align: center;
      font-size: 1.5rem;
      letter-spacing: 5px;
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,242,255,0.2);
      border-radius: 10px;
      color: #fff;
    }
    #otp-input:focus {
      border-color: var(--neon-cyan);
      outline: none;
    }
    #phone-display { color: var(--neon-cyan); font-weight: bold; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="login-box">
      <!-- 🧑💻 Logo Cyberpunk -->
      <img src="cyber-face.png" alt="BarberHub Logo" class="welcome-logo" style="width:85px; margin:0 auto 15px; display:block;">
      <h2>Bienvenido</h2>
      <p class="subtitle">Inicia sesión en BarberHub</p>
      
      <div id="error-msg" class="error-message"></div>
      
      <!-- FORMULARIO EMAIL/PASSWORD -->
      <form id="login-form">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" id="btn-login" class="btn-primary">ENTRAR</button>
      </form>
      
      <div class="divider"><span>O continúa con</span></div>
      
      <!-- GOOGLE LOGIN -->
      <div class="social-login">
        <button class="btn-social google" onclick="signInWithGoogle()">
          <i class="fab fa-google"></i> Google
        </button>
      </div>
      
      <!-- 📱 DIVIDER PARA TELÉFONO -->
      <div class="divider"><span>O verifica tu teléfono</span></div>
      
      <!-- 📱 SECCIÓN DE TELÉFONO (AHORA EN EL BODY, NO EN JS) -->
      <div id="phone-auth">
        <div id="phone-step-1">
          <div class="form-group">
            <label for="phone-input">Número de teléfono <span style="color:var(--neon-pink);">*</span></label>
            <input type="tel" id="phone-input" placeholder="+34 612 345 678" required>
            <small style="color:#888; font-size:0.8rem;">
              <i class="fas fa-info-circle"></i> Selecciona tu país e ingresa tu número
            </small>
          </div>
          <button type="button" onclick="sendPhoneOTP()" class="btn-primary">📤 Enviar Código por SMS</button>
        </div>

        <div id="phone-step-2" style="display:none;">
          <p style="color:#ccc; font-size:0.9rem; margin-bottom:10px;">
            Código enviado a <span id="phone-display"></span>
          </p>
          <div class="form-group">
            <label for="otp-input">Código de verificación <span style="color:var(--neon-pink);">*</span></label>
            <input type="text" id="otp-input" placeholder="123456" maxlength="6" inputmode="numeric">
          </div>
          <button type="button" onclick="verifyPhoneOTP()" class="btn-primary">✅ Verificar Código</button>
          <button type="button" onclick="resetPhoneAuth()" class="btn-secondary">Cambiar número</button>
        </div>
        <div id="phone-msg" class="error-message" style="margin-top:10px;"></div>
      </div>
      
      <div class="register-link">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
      </div>
    </div>
  </div>
  
  <!-- ========================================
       SCRIPTS - ORDEN CRÍTICO
       ======================================== -->
  
  <!-- 1. Configurar Supabase -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    
    const SUPABASE_URL = 'https://qnlbaxxbsbwbgqucbywn.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFubGJheHhic2J3YmdxdWNieXduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc3MzE5NjQsImV4cCI6MjA2MzMwNzk2NH0.6X8wvGv7VZvZvZvZvZvZvZvZvZvZvZvZvZvZvZvZvZ'
    
    window.supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
    })
    
    console.log('✅ Supabase client initialized')
    
    // Función para mostrar errores
    window.showError = (message) => {
      const el = document.getElementById('error-msg')
      if (el) {
        el.textContent = message
        el.style.display = 'block'
        setTimeout(() => { el.style.display = 'none' }, 5000)
      }
    }
    
    // Login con Google
    window.signInWithGoogle = async () => {
      try {
        const { error } = await window.supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + '/perfil-cliente.html' }
        })
        if (error) throw error
      } catch (err) {
        console.error('Error Google:', err)
        showError('❌ Error con Google: ' + err.message)
      }
    }
    
    // Login con email/password
    document.getElementById('login-form')?.addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn = document.getElementById('btn-login')
      const errorMsg = document.getElementById('error-msg')
      
      btn.disabled = true
      btn.textContent = 'Verificando...'
      errorMsg.style.display = 'none'
      
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      
      try {
        const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password })
        if (error) throw error
        
        const role = data.user.user_metadata?.role || 'cliente'
        window.location.href = role === 'barbero' ? 'admin.html' : 'perfil-cliente.html'
      } catch (err) {
        showError('❌ ' + err.message)
        btn.disabled = false
        btn.textContent = 'ENTRAR'
      }
    })
    
    // Auto-login al cargar
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const { data: { session } } = await window.supabaseClient.auth.getSession()
        if (session) {
          const role = session.user.user_metadata?.role || 'cliente'
          window.location.href = role === 'barbero' ? 'admin.html' : 'perfil-cliente.html'
        }
      } catch (err) {
        console.error('Error verificando sesión:', err)
      }
    })
  </script>
  
  <!-- 2. Scripts para teléfono (FUERA del module, como script normal) -->
  <script>
    let phoneInputInstance = null;
    
    // Inicializar input internacional cuando el DOM esté listo
    document.addEventListener('DOMContentLoaded', function() {
      const phoneInput = document.getElementById('phone-input');
      if (phoneInput && typeof intlTelInput !== 'undefined') {
        phoneInputInstance = intlTelInput(phoneInput, {
          initialCountry: "auto",
          geoIpLookup: function(callback) {
            fetch('https://ipapi.co/json')
              .then(res => res.json())
              .then(data => callback(data.country_code))
              .catch(() => callback("es"));
          },
          preferredCountries: ["es", "mx", "co", "ar", "us"],
          separateDialCode: true,
          utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/utils.js"
        });
      }
    });
    
    window.sendPhoneOTP = async () => {
      const msgEl = document.getElementById('phone-msg');
      
      if (!phoneInputInstance) {
        msgEl.textContent = '⚠️ Error: Cargando selector de países...';
        msgEl.style.display = 'block';
        return;
      }
      
      const phoneNumber = phoneInputInstance.getNumber();
      
      if (!phoneNumber || phoneNumber.length < 10) {
        msgEl.textContent = '⚠️ Ingresa un número válido con código de país';
        msgEl.style.color = '#ff4444';
        msgEl.style.display = 'block';
        return;
      }
      
      msgEl.textContent = '⏳ Enviando SMS...';
      msgEl.style.color = '#00f2ff';
      msgEl.style.display = 'block';
      
      try {
        const { error } = await window.supabaseClient.auth.signInWithOtp({ phone: phoneNumber });
        
        if (error) {
          msgEl.textContent = '❌ ' + error.message;
          msgEl.style.color = '#ff4444';
        } else {
          document.getElementById('phone-step-1').style.display = 'none';
          document.getElementById('phone-step-2').style.display = 'block';
          document.getElementById('phone-display').textContent = phoneNumber;
          msgEl.textContent = '✅ Revisa tu SMS';
          msgEl.style.color = '#00ff88';
        }
      } catch (err) {
        msgEl.textContent = '❌ Error: ' + err.message;
        msgEl.style.color = '#ff4444';
      }
    };
    
    window.verifyPhoneOTP = async () => {
      const token = document.getElementById('otp-input').value;
      const msgEl = document.getElementById('phone-msg');
      
      if (!token || token.length !== 6) {
        msgEl.textContent = '⚠️ Ingresa el código de 6 dígitos';
        msgEl.style.color = '#ffaa00';
        msgEl.style.display = 'block';
        return;
      }
      
      const phoneNumber = phoneInputInstance ? phoneInputInstance.getNumber() : '';
      
      msgEl.textContent = '⏳ Verificando...';
      msgEl.style.color = '#00f2ff';
      
      try {
        const { data, error } = await window.supabaseClient.auth.verifyOtp({
          phone: phoneNumber,
          token: token,
          type: 'sms'
        });
        
        if (error) {
          msgEl.textContent = '❌ Código inválido o expirado';
          msgEl.style.color = '#ff4444';
        } else {
          msgEl.textContent = '🎉 ¡Verificado! Redirigiendo...';
          msgEl.style.color = '#00ff88';
          
          const role = data.user.user_metadata?.role || 'cliente';
          setTimeout(() => {
            window.location.href = role === 'barbero' ? 'admin.html' : 'perfil-cliente.html';
          }, 1200);
        }
      } catch (err) {
        msgEl.textContent = '❌ Error: ' + err.message;
        msgEl.style.color = '#ff4444';
      }
    };
    
    window.resetPhoneAuth = () => {
      document.getElementById('phone-step-1').style.display = 'block';
      document.getElementById('phone-step-2').style.display = 'none';
      document.getElementById('otp-input').value = '';
      document.getElementById('phone-msg').style.display = 'none';
      if (phoneInputInstance) {
        phoneInputInstance.setNumber('');
      }
    };
  </script>
</body>
</html>

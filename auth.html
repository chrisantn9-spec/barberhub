<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión | BarberHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* CONFIGURACIÓN BÁSICA */
    body {
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #050505;
      font-family: 'Inter', sans-serif;
    }

    /* 🌌 MURO DE PALABRAS EN EL FONDO */
    .bg-text-layer {
      position: fixed;
      top: -10%; left: -10%;
      width: 120%; height: 120%;
      z-index: -2;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      gap: 40px;
      transform: rotate(-15deg);
      pointer-events: none;
      opacity: 0.4;
    }
    
    .bg-text-layer span {
      font-family: 'Orbitron', sans-serif;
      font-size: 4vw;
      font-weight: 900;
      color: transparent;
      -webkit-text-stroke: 1px rgba(0, 229, 238, 0.2);
      white-space: nowrap;
    }

    /* 💡 LUZ QUE RECORRE EL FONDO */
    .bg-light-beam {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      background: linear-gradient(90deg, 
        transparent 0%, 
        transparent 45%, 
        rgba(0, 229, 238, 0.1) 50%, 
        transparent 55%, 
        transparent 100%);
      animation: sweepLight 6s linear infinite;
      pointer-events: none;
    }
    
    @keyframes sweepLight {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* 💎 TARJETA DE INICIO */
    .login-card {
      background: rgba(15, 15, 20, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 229, 238, 0.3);
      border-radius: 20px;
      padding: 50px 30px 40px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      position: relative;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 229, 238, 0.05);
      animation: floatCard 6s ease-in-out infinite;
      z-index: 10;
    }
    
    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* ✨ TÍTULO CYBERPUNK - BARBER (Blanco) HUB (Turquesa Neón) */
    .card-brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 10px;
      position: relative;
      display: inline-block;
    }

    /* BARBER en blanco */
    .word-barber {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    /* HUB en Turquesa Neón */
    .word-hub {
      color: #00E5EE;
      text-shadow: 
        0 0 10px #00E5EE,
        0 0 20px #00E5EE,
        0 0 40px rgba(0, 229, 238, 0.8);
      display: inline-block;
      animation: hubPulse 2s ease-in-out infinite;
    }

    @keyframes hubPulse {
      0%, 100% { 
        text-shadow: 
          0 0 10px #00E5EE,
          0 0 20px #00E5EE,
          0 0 40px rgba(0, 229, 238, 0.8);
      }
      50% { 
        text-shadow: 
          0 0 15px #00E5EE,
          0 0 30px #00E5EE,
          0 0 60px rgba(0, 229, 238, 1);
      }
    }

    /* Efecto Glitch adicional */
    .card-brand::before,
    .card-brand::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 15, 20, 0.95);
      overflow: hidden;
      pointer-events: none;
    }

    .card-brand::before {
      left: 2px;
      text-shadow: -2px 0 #ff00ff;
      clip-path: inset(44% 0 61% 0);
      animation: glitch-anim 2.5s infinite linear alternate-reverse;
    }

    .card-brand::after {
      left: -2px;
      text-shadow: -2px 0 #00E5EE;
      clip-path: inset(12% 0 58% 0);
      animation: glitch-anim 3s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim {
      0% { clip-path: inset(40% 0 61% 0); }
      20% { clip-path: inset(92% 0 1% 0); }
      40% { clip-path: inset(10% 0 50% 0); }
      60% { clip-path: inset(50% 0 25% 0); }
      80% { clip-path: inset(15% 0 70% 0); }
      100% { clip-path: inset(60% 0 10% 0); }
    }

    .login-subtitle {
      color: #aaa;
      font-size: 1rem;
      margin-bottom: 35px;
    }

    /* Inputs */
    .input-group {
      position: relative;
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group input {
      width: 100%;
      padding: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
      box-sizing: border-box;
    }
    .input-group input:focus {
      border-color: #00E5EE;
      box-shadow: 0 0 15px rgba(0, 229, 238, 0.2);
      background: rgba(255, 255, 255, 0.08);
    }

    /* Botón Principal */
    .btn-login-main {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #00E5EE;
      color: #000;
      box-shadow: 0 0 20px rgba(0, 229, 238, 0.4);
      margin-bottom: 10px;
    }
    .btn-login-main:hover {
      background: #fff;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.6);
      transform: translateY(-3px);
    }

    /* Separador */
    .divider {
      margin: 35px 0 25px;
      border: 0;
      border-top: 1px solid rgba(255,255,255,0.1);
      position: relative;
    }
    .divider span {
      position: absolute;
      top: -12px; left: 50%; transform: translateX(-50%);
      background: rgba(1

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Barbero | BarberHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Evitar parpadeo durante carga */
        body { opacity: 1 !important; transition: opacity 0.2s; }
        .loading { display: none; }
        body.checking-session .loading { display: block; }
        body.checking-session #auth-form, 
        body.checking-session #auth-links { display: none; }
    </style>
</head>
<body class="checking-session">
    <header>
        <img src="logo.png" class="logo-img" alt="Logo BarberHub">
        <h1>🔐 ACCESO BARBERO</h1>
        <p>Ingresa para gestionar tus turnos</p>
    </header>
    
    <main style="max-width:450px; margin:40px auto; padding:0 20px;">
        <!-- Mensaje de carga -->
        <div class="loading" style="text-align:center; padding:30px; color:var(--neon-cyan);">
            <p style="font-size:1.5rem; margin-bottom:10px;">⚡</p>
            <p>Verificando sesión...</p>
        </div>

        <!-- Formulario -->
        <div id="auth-form" style="background:var(--glass-bg); backdrop-filter:blur(12px); border:1px solid var(--glass-border); border-radius:14px; padding:28px;">
            <form id="login-form">
                <label>Email:</label>
                <input type="email" id="email" required placeholder="tu@email.com" autocomplete="username">
                
                <label>Contraseña:</label>
                <input type="password" id="password" required minlength="6" placeholder="••••••" autocomplete="current-password">
                
                <button type="submit" id="btn-login" style="
                    background:var(--neon-cyan); 
                    color:#000; 
                    width:100%; 
                    padding:14px; 
                    margin-top:20px; 
                    border:none; 
                    border-radius:8px; 
                    font-weight:700; 
                    font-size:1.1rem;
                    cursor:pointer;">
                    ENTRAR
                </button>
            </form>
            
            <p id="msg" style="margin-top:15px; text-align:center; font-weight:600; min-height:24px;"></p>
            
            <div id="auth-links" style="text-align:center; margin-top:15px; font-size:0.9rem;">
                <a href="registro-barbero.html" style="color:var(--neon-pink); text-decoration:none;">¿No tienes cuenta? Regístrate aquí</a>
            </div>
        </div>
        
        <p style="text-align:center; margin-top:20px;">
            <a href="index.html" style="color:#888; text-decoration:none;">← Volver al inicio</a>
        </p>
    </main>
    
    <script src="config.js"></script>
    <script src="auth.js"></script>
</body>
</html>

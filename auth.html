<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | BarberHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --neon-cyan: #00E5EE; --neon-pink: #ff00ff; --dark-bg: #050505; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: var(--dark-bg); font-family: 'Inter', sans-serif; color: #fff; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: rgba(15,15,25,0.9); backdrop-filter: blur(20px); border: 2px solid var(--neon-cyan); border-radius: 20px; padding: 40px 30px; max-width: 420px; width: 100%; box-shadow: 0 0 40px rgba(0,229,238,0.3); text-align: center; }
    .brand { font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px; }
    .brand .b { color: #fff; } .brand .h { color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan); }
    .subtitle { color: #aaa; margin-bottom: 25px; }
    .input-group { margin-bottom: 15px; }
    .input-group input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; font-size: 1rem; }
    .input-group input:focus { border-color: var(--neon-cyan); outline: none; box-shadow: 0 0 15px rgba(0,229,238,0.3); }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
    .btn-primary { background: var(--neon-cyan); color: #000; }
    .btn-primary:hover { background: #fff; box-shadow: 0 0 25px rgba(255,255,255,0.6); transform: translateY(-2px); }
    .btn-google { background: transparent; border: 2px solid var(--neon-pink); color: var(--neon-pink); display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-google:hover { background: rgba(255,0,255,0.1); box-shadow: 0 0 20px rgba(255,0,255,0.4); }
    .divider { margin: 20px 0; border: 0; border-top: 1px solid rgba(255,255,255,0.1); position: relative; }
    .divider span { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: rgba(15,15,25,0.9); padding: 0 10px; color: #888; font-size: 0.8rem; }
    .links { display: flex; justify-content: space-between; font-size: 0.85rem; margin-top: 15px; }
    .links a { color: #aaa; text-decoration: none; transition: 0.2s; }
    .links a:hover { color: var(--neon-cyan); }
    #msg { margin-top: 10px; padding: 10px; border-radius: 8px; font-size: 0.9rem; display: none; }
    #msg.err { background: rgba(255,68,68,0.15); color: #ff4444; border: 1px solid #ff4444; }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="brand"><span class="b">BARBER</span><span class="h">HUB</span></h1>
    <p class="subtitle">Bienvenido de nuevo</p>
    <form id="login-form">
      <div class="input-group"><input type="email" id="email" placeholder="📧 Correo electrónico" required></div>
      <div class="input-group"><input type="password" id="password" placeholder="🔑 Contraseña" required></div>
      <button type="submit" class="btn btn-primary"><i class="fas fa-bolt"></i> INICIAR SESIÓN</button>
    </form>
    <div id="msg"></div>
    <hr class="divider"><span>O CONTINÚA CON</span>
    <button onclick="loginGoogle()" class="btn btn-google"><i class="fab fa-google"></i> Google</button>
    <div class="links">
      <a href="recuperar-password.html">¿Olvidaste contraseña?</a>
      <a href="registro.html">Registrarse</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    (async () => { try { const { data: { user } } = await supabaseClient.auth.getUser(); if (user) window.location.href = user.user_metadata?.role === 'barbero' ? 'admin.html' : 'index.html'; } catch {} })();

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.querySelector('.btn-primary'), msg = document.getElementById('msg');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cargando...'; msg.style.display = 'none';
      try {
        const { error } = await supabaseClient.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value });
        if (error) throw error;
        window.location.href = 'index.html';
      } catch (err) {
        msg.textContent = '❌ ' + err.message; msg.className = 'err'; msg.style.display = 'block';
        btn.innerHTML = '<i class="fas fa-bolt"></i> INICIAR SESIÓN';
      }
    });

    window.loginGoogle = async () => {
      try { await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/index.html' } }); }
      catch (err) { alert('❌ Error Google: ' + err.message); }
    };
  </script>
</body>
</html>

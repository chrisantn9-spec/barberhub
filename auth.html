<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BarberHub</title>
  <!-- 1. Supabase CDN PRIMERO -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background:#0a0a1a; color:#fff; font-family:sans-serif; padding:20px; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
    form { background:#111; padding:30px; border-radius:12px; border:1px solid #00f2ff; width:100%; max-width:350px; }
    h2 { text-align:center; color:#00f2ff; margin:0 0 20px; }
    input { width:100%; padding:12px; margin:8px 0; background:#222; border:1px solid #444; color:#fff; border-radius:6px; box-sizing:border-box; font-size:1rem; }
    input:focus { outline:none; border-color:#00f2ff; }
    button { width:100%; padding:14px; background:#00f2ff; color:#000; border:none; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:10px; font-size:1rem; }
    button:disabled { opacity:0.6; cursor:not-allowed; }
    .msg { margin-top:12px; text-align:center; font-size:0.9rem; min-height:20px; display:none; padding:8px; border-radius:6px; }
    .msg.err { background:rgba(255,68,68,0.15); color:#ff4444; }
    .link { text-align:center; margin-top:15px; font-size:0.85rem; }
    .link a { color:#00f2ff; text-decoration:none; }
  </style>
</head>
<body>
  <form id="login-form">
    <h2>👋 Iniciar Sesión</h2>
    <input type="email" id="email" placeholder="📧 Email" required>
    <input type="password" id="password" placeholder="🔑 Contraseña" required>
    <button type="submit" id="btn">ENTRAR</button>
    <div id="msg" class="msg err"></div>
    <div class="link"><a href="registro.html">¿No tienes cuenta? Regístrate</a></div>
  </form>

  <!-- 2. config.js → 3. Lógica -->
  <script src="config.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      
      if (!window.supabaseClient) {
        msg.textContent = '❌ Error: API Key no cargada';
        msg.style.display = 'block';
        return;
      }

      btn.disabled = true; btn.textContent = 'Verificando...';
      msg.style.display = 'none';

      try {
        const { error } = await window.supabaseClient.auth.signInWithPassword({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        if (error) throw error;

        window.location.href = 'perfil-cliente.html'; // Redirige al dashboard
      } catch (err) {
        msg.textContent = '❌ ' + err.message;
        msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'ENTRAR';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Acceso a tu cuenta de BarberApp"/>
    <title>🔐 Iniciar Sesión | BarberApp</title>
    
    <!-- Estilos -->
    <link rel="stylesheet" href="style.css" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png" />
    
    <!-- Preconexión a Supabase para mejor rendimiento -->
    <link rel="preconnect" href="https://qnlbaxxbsbwbgqucbywn.supabase.co" />
    
    <!-- 1️⃣ CDN de Supabase (SIEMPRE primero) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2️⃣ Configuración de Supabase -->
    <script src="config.js"></script>
    
    <!-- 3️⃣ Lógica de autenticación (con defer para esperar al DOM) -->
    <script src="auth.js" defer></script>
    
    <!-- Estilos específicos para esta página -->
    <style>
        /* Estado de carga inicial: ocultar formulario hasta verificar sesión */
        body.checking-session #login-form {
            display: none;
        }
        
        body.checking-session #loading {
            display: flex;
        }
        
        #loading {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            color: #666;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Formulario de login */
        #login-form {
            max-width: 400px;
            margin: 2rem auto;
            padding: 2rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        #login-form h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
        }
        
        #login-form .form-group {
            margin-bottom: 1rem;
        }
        
        #login-form label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #444;
        }
        
        #login-form input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        
        #login-form input:focus {
            outline: none;
            border-color: #00ff88;
        }
        
        #login-form #btn-login {
            width: 100%;
            padding: 0.85rem;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }
        
        #login-form #btn-login:hover:not(:disabled) {
            background: #333;
        }
        
        #login-form #btn-login:disabled {
            background: #999;
            cursor: not-allowed;
        }
        
        #msg {
            text-align: center;
            margin: 1rem 0;
            font-weight: 500;
            min-height: 1.5rem;
        }
        
        .links {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        
        .links a {
            color: #007bff;
            text-decoration: none;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            #login-form {
                margin: 1rem;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body class="checking-session">

    <!-- Estado de carga: se muestra mientras se verifica la sesión -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Verificando sesión...</p>
    </div>

    <!-- Formulario de login: se muestra solo si NO hay sesión activa -->
    <form id="login-form">
        <h2>🔐 Iniciar Sesión</h2>
        
        <div id="msg" role="alert" aria-live="polite"></div>
        
        <div class="form-group">
            <label for="email">📧 Email</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="tu@email.com" 
                required 
                autocomplete="email"
                inputmode="email"
            />
        </div>
        
        <div class="form-group">
            <label for="password">🔑 Contraseña</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="••••••••" 
                required 
                autocomplete="current-password"
                minlength="6"
            />
        </div>
        
        <button type="submit" id="btn-login">Entrar</button>
        
        <div class="links">
            <a href="recuperar-password.html">¿Olvidaste tu contraseña?</a><br/>
            <span>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></span>
        </div>
    </form>

    <!-- Script mínimo para fallback si JS falla -->
    <noscript>
        <div style="text-align:center; padding:2rem; color:#ff3333;">
            ⚠️ Esta aplicación requiere JavaScript habilitado para funcionar.
        </div>
    </noscript>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | BarberHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estilos específicos para Auth */
        .auth-container {
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--neon-cyan);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            text-align: center;
        }
        .auth-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(0,0,0,0.5);
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .auth-input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0, 242, 255, 0.4);
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--neon-cyan);
            color: #000;
            font-weight: 900;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .auth-btn:hover {
            box-shadow: 0 0 15px var(--neon-cyan);
            transform: scale(1.02);
        }
        .auth-link {
            display: block;
            margin-top: 15px;
            color: var(--neon-pink);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .auth-link:hover { text-decoration: underline; }
        .error-msg { color: #ff3333; font-size: 0.85rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <!-- Header simple -->
    <div style="text-align:center; padding:20px;">
        <a href="index.html" style="color:#888; text-decoration:none; font-size:0.9rem;">← Volver al Directorio</a>
    </div>

    <div class="auth-container">
        <h2 style="color:var(--neon-cyan); margin-bottom:20px; font-family:'Orbitron';">🔐 ACCESO SISTEMA</h2>
        
        <form id="login-form">
            <input type="email" id="email" class="auth-input" placeholder="📧 Correo Electrónico" required>
            <input type="password" id="password" class="auth-input" placeholder="🔑 Contraseña" required>
            
            <button type="submit" class="auth-btn">ENTRAR</button>
            <div id="error-msg" class="error-msg"></div>
        </form>

        <a href="registro-barbero.html" class="auth-link">¿Eres Barbero? Registra tu Barbería aquí</a>
        <a href="mis-citas.html" class="auth-link" style="color:#888; font-size:0.8rem; margin-top:5px;">Soy Cliente (Consultar Turno)</a>
    </div>

    <script src="config.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorMsg.textContent = "❌ " + error.message;
                errorMsg.style.display = 'block';
            } else {
                window.location.href = 'admin.html';
            }
        });
    </script>
</body>
</html>

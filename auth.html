<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión | BarberHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body {
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #050505;
    }

    /* 🌌 FONDO ANIMADO (Se mantiene igual porque te gustó) */
    .cyber-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      background: #050505;
      overflow: hidden;
    }
    .cyber-line {
      position: absolute;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
      opacity: 0.25;
    }
    .cyber-line.h { height: 2px; width: 100%; left: 0; animation: moveH 5s linear infinite; }
    .cyber-line.v { width: 2px; height: 100%; top: 0; animation: moveV 5s linear infinite; }
    @keyframes moveH { 0% { top: -10%; opacity: 0; } 50% { opacity: 0.5; } 100% { top: 110%; opacity: 0; } }
    @keyframes moveV { 0% { left: -10%; opacity: 0; } 50% { opacity: 0.5; } 100% { left: 110%; opacity: 0; } }

    /* 💎 TARJETA (CARTEL) DE INICIO - FONDO NEUTRO ELEGANTE */
    .login-card {
      /* ✅ Fondo neutro oscuro (Dark Glass) en lugar del morado */
      background: rgba(18, 18, 24, 0.95); 
      backdrop-filter: blur(20px);
      
      /* ✅ Borde neón sutil */
      border: 1px solid rgba(0, 242, 255, 0.3);
      border-radius: 20px;
      
      padding: 50px 30px 40px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      position: relative;
      
      /* Sombra suave para dar profundidad */
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 242, 255, 0.05);
      animation: floatCard 6s ease-in-out infinite;
    }
    
    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Brillo del borde (opcional, hace que parezca neón real) */
    .login-card::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px; bottom: -1px;
      background: linear-gradient(45deg, transparent, rgba(0, 242, 255, 0.5), transparent);
      z-index: -1;
      border-radius: 20px;
      opacity: 0.3;
    }

    /* ✨ TÍTULO BARBERHUB DIVIDIDO */
    .card-brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem; /* Grande */
      font-weight: 900;
      letter-spacing: 4px;
      margin: 0 0 10px 0;
      display: inline-block;
      position: relative;
    }
    
    /* Parte blanca */
    .card-brand .white-part {
      color: #ffffff;
    }
    
    /* Parte Neón */
    .card-brand .neon-part {
      color: var(--neon-cyan);
      /* ✅ Efecto de luz alrededor (Glow) */
      text-shadow: 
        0 0 10px var(--neon-cyan),
        0 0 20px var(--neon-cyan),
        0 0 40px rgba(0, 242, 255, 0.8);
    }

    /* ✨ TÍTULO BIENVENIDO */
    .login-title {
      font-family: 'Inter', sans-serif;
      font-size: 1.2rem;
      font-weight: 400;
      color: #aaa;
      margin: 0 0 40px;
      letter-spacing: 1px;
    }

    /* Inputs */
    .input-group {
      position: relative;
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group input {
      width: 100%;
      padding: 16px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
      box-sizing: border-box;
    }
    .input-group input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
    }

    /* Botón Principal */
    .btn-login-main {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
      margin-bottom: 10px;
    }
    .btn-login-main:hover {
      background: #fff;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.6);
      transform: translateY(-3px);
    }

    /* Separador */
    .divider {
      margin: 35px 0 25px;
      border: 0;
      border-top: 1px solid rgba(255,255,255,0.1);
      position: relative;
    }
    .divider span {
      position: absolute;
      top: -12px; left: 50%; transform: translateX(-50%);
      background: rgba(18, 18, 24, 1); /* Mismo fondo que tarjeta */
      padding: 0 15px; 
      color: #888; 
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Botón Google */
    .btn-google {
      width: 100%;
      padding: 16px;
      border: 1px solid #ff00ff;
      border-radius: 12px;
      background: transparent;
      color: #ff00ff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 0 10px rgba(255, 0, 255, 0.15);
      margin-bottom: 20px;
    }
    .btn-google:hover {
      background: rgba(255, 0, 255, 0.1);
      box-shadow: 0 0 25px rgba(255, 0, 255, 0.4);
      transform: translateY(-3px);
      color: #fff;
    }

    .links-container {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .links-container a {
      color: #aaa;
      text-decoration: none;
      transition: 0.2s;
    }
    .links-container a:hover {
      color: var(--neon-cyan);
      text-shadow: 0 0 5px var(--neon-cyan);
    }
  </style>
</head>
<body>

  <!-- 🌌 FONDO ANIMADO -->
  <div class="cyber-bg">
    <div class="cyber-line h" style="top: 20%;"></div>
    <div class="cyber-line h" style="top: 60%; animation-delay: 2.5s;"></div>
    <div class="cyber-line v" style="left: 30%;"></div>
    <div class="cyber-line v" style="left: 80%; animation-delay: 1.5s;"></div>
  </div>

  <!-- 💎 TARJETA LOGIN (SIN LOGO) -->
  <div class="login-card">
    
    <!-- ✅ Título dividido: BARBER (blanco) HUB (neon) -->
    <h2 class="card-brand">
      <span class="white-part">BARBER</span><span class="neon-part">HUB</span>
    </h2>
    
    <h1 class="login-title">Bienvenido</h1>

    <form id="login-form">
      <div class="input-group">
        <input type="email" id="email" placeholder=" Correo electrónico" required>
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Contraseña" required>
      </div>
      
      <button type="submit" class="btn-login-main">
        <i class="fas fa-bolt"></i> INICIAR SESIÓN
      </button>
    </form>

    <hr class="divider"><span>O CONTINÚA CON</span>

    <button onclick="loginGoogle()" class="btn-google">
      <i class="fab fa-google"></i> Google
    </button>

    <div class="links-container">
      <a href="recuperar-password.html">¿Olvidaste contraseña?</a>
      <a href="registro.html">Registrarse</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // Login con Email
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.querySelector('.btn-login-main');
      
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cargando...';
      
      try {
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });
        if (error) throw error;
        window.location.href = 'perfil-cliente.html';
      } catch (err) {
        alert(' Error: ' + err.message);
        btn.innerHTML = originalText;
      }
    });

    // Login con Google
    async function loginGoogle() {
      try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + '/perfil-cliente.html' }
        });
        if (error) throw error;
      } catch (err) {
        alert('Error con Google: ' + err.message);
      }
    }
  </script>
</body>
</html>

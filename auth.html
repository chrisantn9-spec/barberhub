      color: #fff;

      font-size: 0.9rem;
    }
    .form-group input {

      padding: 14px 16px;
      background: rgba(15, 15, 25, 0.7);
      border: 1px solid rgba(0, 242, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    .form-group input:focus {

      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 242, 255, 0.2);
    }
    .error-message {

      padding: 12px 16px;

      margin-bottom: 20px;
      display: none;
      font-size: 0.9rem;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00f2ff, #00c3ff);
      border: none;
      border-radius: 10px;
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: filter 0.2s;
      margin-bottom: 20px;
    }
    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.1);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .divider {
      text-align: center;
      margin: 24px 0;
      position: relative;
    }
    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0; right: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }
    .divider span {
      background: rgba(10, 10, 20, 0.85);
      padding: 0 16px;
      color: #666;
      font-size: 0.85rem;
      position: relative;
    }
    .social-login {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-social {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #fff;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

    }

    .btn-social.google i { color: #db4437; font-size: 1.2rem; }
    .register-link {
      text-align: center;
      margin-top: 24px;
      color: #a0a0b0;
      font-size: 0.9rem;
    }
    .register-link a {
      color: var(--neon-cyan);
      text-decoration: none;
      font-weight: 600;
    }

//  Funciones de verificación por teléfono
window.sendPhoneOTP = async () => {
  const phone = document.getElementById('phone-input').value.replace(/[\s\-\(\)]/g, '');
  const msgEl = document.getElementById('phone-msg');
  
  if (!phone.startsWith('+') || phone.length < 10) {
    msgEl.textContent = '⚠️ Formato inválido. Usa: +34612345678';
    msgEl.style.display = 'block';
    return;
  }

  msgEl.textContent = '⏳ Enviando SMS...';
  msgEl.style.display = 'block';

  const { error } = await window.supabaseClient.auth.signInWithOtp({ phone });
  
  if (error) {
    msgEl.textContent = '❌ ' + error.message;
  } else {
    document.getElementById('phone-step-1').style.display = 'none';
    document.getElementById('phone-step-2').style.display = 'block';
    document.getElementById('phone-display').textContent = phone;
    msgEl.textContent = '✅ Revisa tu SMS (o la tabla auth.users en modo test)';
  }
};

// Inicializar input internacional
let phoneInputInstance;
document.addEventListener('DOMContentLoaded', function() {
  const phoneInput = document.getElementById('phone-input');
  if (phoneInput && typeof intlTelInput !== 'undefined') {
    phoneInputInstance = intlTelInput(phoneInput, {
      initialCountry: "auto",
      geoIpLookup: function(callback) {
        fetch('https://ipapi.co/json')
          .then(res => res.json())
          .then(data => callback(data.country_code))
          .catch(() => callback("es"));
      },
      preferredCountries: ["es", "mx", "co", "ar", "us"],
      separateDialCode: true,
      utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/utils.js"
    });
  }
});

window.sendPhoneOTP = async () => {
  const msgEl = document.getElementById('phone-msg');
  
  if (!phoneInputInstance) {
    msgEl.textContent = '⚠️ Error: Input no inicializado';
    msgEl.style.display = 'block';
    return;
  }

  // Obtener número completo con código de país
  const phoneNumber = phoneInputInstance.getNumber();
  
  if (!phoneNumber || phoneNumber.length < 10) {
    msgEl.textContent = '⚠️ Ingresa un número de teléfono válido';
    msgEl.style.color = '#ff4444';
    msgEl.style.display = 'block';
    return;
  }

  msgEl.textContent = '⏳ Enviando SMS...';
  msgEl.style.color = '#00f2ff';
  msgEl.style.display = 'block';

  const { error } = await window.supabaseClient.auth.signInWithOtp({ 
    phone: phoneNumber 
  });
  
  if (error) {
    msgEl.textContent = '❌ ' + error.message;
    msgEl.style.color = '#ff4444';
  } else {
    document.getElementById('phone-step-1').style.display = 'none';
    document.getElementById('phone-step-2').style.display = 'block';
    document.getElementById('phone-display').textContent = phoneNumber;
    msgEl.textContent = '✅ Revisa tu SMS';
    msgEl.style.color = '#00ff88';
  }
};

window.verifyPhoneOTP = async () => {
  const phoneInput = document.getElementById('phone-input');
  const phoneNumber = phoneInputInstance ? phoneInputInstance.getNumber() : phoneInput.value;
  const token = document.getElementById('otp-input').value;
  const msgEl = document.getElementById('phone-msg');

  if (!token || token.length !== 6) {
    msgEl.textContent = '⚠️ Ingresa el código de 6 dígitos';
    msgEl.style.color = '#ffaa00';
    msgEl.style.display = 'block';
    return;
  }

  msgEl.textContent = '⏳ Verificando...';
  msgEl.style.color = '#00f2ff';
  
  const { data, error } = await window.supabaseClient.auth.verifyOtp({
    phone: phoneNumber,
    token: token,
    type: 'sms'
  });

  if (error) {
    msgEl.textContent = '❌ Código inválido o expirado';
    msgEl.style.color = '#ff4444';
  } else {
    msgEl.textContent = '🎉 ¡Verificado! Redirigiendo...';
    msgEl.style.color = '#00ff88';
    
    const role = data.user.user_metadata?.role || 'cliente';
    setTimeout(() => {
      window.location.href = role === 'barbero' ? 'admin.html' : 'perfil-cliente.html';
    }, 1200);
  }
};

window.resetPhoneAuth = () => {
  document.getElementById('phone-step-1').style.display = 'block';
  document.getElementById('phone-step-2').style.display = 'none';
  document.getElementById('otp-input').value = '';
  document.getElementById('phone-msg').style.display = 'none';
  if (phoneInputInstance) {
    phoneInputInstance.setNumber('');
  }

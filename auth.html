<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberHub | Acceso</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon-cyan: #00E5EE;
            --neon-pink: #ff00ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background: #030303;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 🔥 FONDO: 100% Visible */
        .cyber-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            /* Sin degradado oscuro para ver tu imagen al máximo */
            background: url('./fondobarber.png'); 
            background-size: cover;
            background-position: center;
            z-index: -3;
        }

        /* ✨ BURBUJAS */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-cyan), 0 0 15px var(--neon-cyan);
            animation: rise 10s infinite linear;
            opacity: 0;
        }
        @keyframes rise {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; transform: translateY(100vh) scale(1); }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(0.5); opacity: 0; }
        }

        /* 📦 CAJA INVISIBLE (Solo borde de cristal) */
        .auth-card {
            width: 90%;
            max-width: 420px;
            background: transparent; /* 0% opacidad */
            backdrop-filter: none;   /* Sin desenfoque */
            /* Borde cristalino con luz en bordes superior e izquierdo */
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-top: 1.5px solid rgba(255, 255, 255, 0.5);
            border-left: 1.5px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 45px 35px;
            text-align: center;
            position: relative;
            z-index: 10;
            /* Resplandor sutil para acentuar la forma de tarjeta */
            box-shadow: 0 0 25px rgba(0, 229, 238, 0.12), inset 0 0 20px rgba(255, 255, 255, 0.02);
            transition: box-shadow 0.4s ease;
        }
        .auth-card:hover {
            box-shadow: 0 0 35px rgba(0, 229, 238, 0.25), inset 0 0 25px rgba(255, 255, 255, 0.04);
        }

        /* 🏷️ TEXTOS FLOTANTES */
        .logo-small {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 30px;
            color: #fff;
            /* Efecto flotante + brillo neón */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
            text-shadow: 0 0 12px rgba(0, 229, 238, 0.7);
        }
        .logo-small span { color: var(--neon-cyan); }

        #formTitle {
            margin-bottom: 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--neon-cyan);
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.8));
            text-shadow: 0 0 10px var(--neon-cyan);
            letter-spacing: 1px;
        }

        /*  INPUTS FLOTANTES */
        .input-group {
            margin-bottom: 22px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: #fff;
            margin-bottom: 6px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1.5px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .input-group input {
            width: 100%;
            padding: 13px 15px;
            background: rgba(0, 0, 0, 0.25); /* Muy sutil para saber dónde escribes */
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.05rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            /* Efecto flotante base */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .input-group input:focus {
            transform: translateY(-2px);
            border-color: var(--neon-cyan);
            box-shadow: 0 8px 20px rgba(0, 229, 238, 0.25), 0 0 15px rgba(0, 229, 238, 0.15);
            background: rgba(0, 0, 0, 0.35);
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.35); }

        /* 🔘 BOTÓN FLOTANTE */
        .btn-submit {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: var(--neon-cyan);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 15px rgba(0, 229, 238, 0.35);
        }
        .btn-submit:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 229, 238, 0.6);
        }
        .btn-submit:active { transform: translateY(0) scale(0.98); }

        /* 🔗 TOGGLE LINKS */
        .toggle-text {
            margin-top: 25px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.85);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }
        .toggle-text a {
            color: var(--neon-pink);
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            text-shadow: 0 0 8px rgba(255, 0, 255, 0.5);
            transition: 0.2s;
        }
        .toggle-text a:hover { text-decoration: underline; filter: drop-shadow(0 0 5px var(--neon-pink)); }

        /* 💬 MENSAJES */
        .message {
            margin-top: 15px;
            font-size: 0.85rem;
            font-weight: bold;
            min-height: 20px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
        }
        .error { color: #ff4444; text-shadow: 0 0 6px rgba(255, 68, 68, 0.6); }
        .success { color: var(--neon-cyan); text-shadow: 0 0 6px var(--neon-cyan); }

        .hidden { display: none; }
        
        /* 🦶 FOOTER */
        .footer {
            position: fixed;
            bottom: 12px;
            width: 100%;
            text-align: center;
            font-size: 0.65rem;
            color: rgba(255,255,255,0.5);
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
            letter-spacing: 1px;
        }
        .footer span { color: var(--neon-pink); font-family: 'Orbitron'; font-weight: bold; }
    </style>
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="particles" id="particles"></div>

    <!-- Tarjeta 100% Transparente -->
    <div class="auth-card">
        <h1 class="logo-small">BARBER<span>HUB</span></h1>
        
        <form id="authForm">
            <h2 id="formTitle">INICIAR SESIÓN</h2>
            
            <div class="input-group hidden" id="nameGroup">
                <label>NOMBRE</label>
                <input type="text" id="nameInput" placeholder="Tu nombre">
            </div>

            <div class="input-group">
                <label>EMAIL</label>
                <input type="email" id="emailInput" placeholder="usuario@email.com" required>
            </div>

            <div class="input-group">
                <label>CONTRASEÑA</label>
                <input type="password" id="passInput" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">ENTRAR</button>
            
            <div class="message" id="messageBox"></div>

            <p class="toggle-text">
                <span id="toggleLabel">¿No tienes cuenta?</span> 
                <a id="toggleLink">Regístrate</a>
            </p>
        </form>
    </div>

    <div class="footer">
        © 2026 All Rights Reserved | by <span>B-U4ALL</span>
    </div>

    <script src="config.js"></script>
    <script>
        // 1. Burbujas
        function createParticles() {
            const c = document.getElementById('particles');
            for(let i=0; i<40; i++){
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random()*100 + '%';
                p.style.animationDelay = Math.random()*10 + 's';
                p.style.animationDuration = (7 + Math.random()*8) + 's';
                c.appendChild(p);
            }
        }
        createParticles();

        // 2. Lógica Auth
        const form = document.getElementById('authForm');
        const nameGroup = document.getElementById('nameGroup');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const toggleLabel = document.getElementById('toggleLabel');
        const toggleLink = document.getElementById('toggleLink');
        const messageBox = document.getElementById('messageBox');
        
        let isRegister = false;

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'register') {
            setMode(true);
        }

        function setMode(register) {
            isRegister = register;
            if(register) {
                nameGroup.classList.remove('hidden');
                formTitle.textContent = 'REGISTRARSE';
                formTitle.style.color = 'var(--neon-pink)';
                formTitle.style.textShadow = '0 0 10px var(--neon-pink)';
                submitBtn.textContent = 'CREAR CUENTA';
                submitBtn.style.background = 'var(--neon-pink)';
                submitBtn.style.boxShadow = '0 5px 15px rgba(255, 0, 255, 0.35)';
                toggleLabel.textContent = '¿Ya tienes cuenta?';
                toggleLink.textContent = 'Inicia Sesión';
            } else {
                nameGroup.classList.add('hidden');
                formTitle.textContent = 'INICIAR SESIÓN';
                formTitle.style.color = 'var(--neon-cyan)';
                formTitle.style.textShadow = '0 0 10px var(--neon-cyan)';
                submitBtn.textContent = 'ENTRAR';
                submitBtn.style.background = 'var(--neon-cyan)';
                submitBtn.style.boxShadow = '0 5px 15px rgba(0, 229, 238, 0.35)';
                toggleLabel.textContent = '¿No tienes cuenta?';
                toggleLink.textContent = 'Regístrate';
            }
            messageBox.textContent = '';
        }

        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            setMode(!isRegister);
            const newMode = !isRegister ? 'register' : 'login';
            window.history.pushState({}, '', `?mode=${newMode}`);
        });

        // 3. Supabase Submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passInput').value;
            const name = document.getElementById('nameInput').value;

            messageBox.textContent = 'Procesando...';
            messageBox.className = 'message';

            try {
                if (isRegister) {
                    const { data, error } = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: { data: { nombre: name, role: 'cliente' } }
                    });
                    if (error) throw error;
                    messageBox.textContent = '¡Cuenta creada! Redirigiendo...';
                    messageBox.classList.add('success');
                    setTimeout(() => window.location.href = 'index.html', 2000);
                } else {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email, password
                    });
                    if (error) throw error;
                    messageBox.textContent = 'Acceso concedido...';
                    messageBox.classList.add('success');
                    setTimeout(() => window.location.href = 'mi-perfil.html', 1000);
                }
            } catch (err) {
                messageBox.textContent = err.message;
                messageBox.classList.add('error');
            }
        });
    </script>
</body>
</html>

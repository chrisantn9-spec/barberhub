<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberHub | Acceso</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon-cyan: #00E5EE;
            --neon-pink: #ff00ff;
            --glass-bg: rgba(5, 5, 15, 0.75);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background: #030303;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 🔥 FONDO: Ahora con tu imagen fondobarber.png */
        .cyber-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            /* Degradado oscuro para que el texto se lea sobre el PNG */
            background: 
                linear-gradient(135deg, rgba(0,0,0,0.4) 0%, rgba(10,5,20,0.4) 100%),
                url('./fondobarber.png'); 
            background-size: cover;
            background-position: center;
            z-index: -3;
        }

        /* ✨ BURBUJAS / PARTÍCULAS */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-cyan), 0 0 15px var(--neon-cyan);
            animation: rise 10s infinite linear;
            opacity: 0;
        }
        @keyframes rise {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; transform: translateY(100vh) scale(1); }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(0.5); opacity: 0; }
        }

        /* 🔲 REJILLA SUTIL */
        .cyber-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 229, 238, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 238, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -2;
            pointer-events: none;
        }

        /* 📦 TARJETA DE AUTENTICACIÓN (Cristal) */
        .auth-card {
            width: 90%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 229, 238, 0.3);
            border-radius: 15px;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 229, 238, 0.1);
        }

        /* Logo pequeño */
        .logo-small {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 25px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 229, 238, 0.5);
        }
        .logo-small span { color: var(--neon-cyan); }

        /* Campos de entrada estilo neón */
        .input-group {
            margin-bottom: 20px;
            position: relative;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 5px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            outline: none;
        }
        .input-group input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 229, 238, 0.3);
            background: rgba(0, 229, 238, 0.05);
        }

        /* Botón principal */
        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background: var(--neon-cyan);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 229, 238, 0.4);
        }
        .btn-submit:hover {
            box-shadow: 0 0 30px rgba(0, 229, 238, 0.8);
            transform: translateY(-2px);
        }

        /* Toggle Login/Register */
        .toggle-text {
            margin-top: 20px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
        }
        .toggle-text a {
            color: var(--neon-pink);
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            text-shadow: 0 0 5px rgba(255, 0, 255, 0.3);
        }
        .toggle-text a:hover { text-decoration: underline; }

        /* Mensajes de error/éxito */
        .message {
            margin-top: 15px;
            font-size: 0.9rem;
            min-height: 20px;
        }
        .error { color: #ff4444; text-shadow: 0 0 5px rgba(255, 68, 68, 0.4); }
        .success { color: var(--neon-cyan); }

        /* Footer simple */
        .footer {
            position: fixed;
            bottom: 15px;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            z-index: 10;
        }
        .footer span { color: var(--neon-pink); font-family: 'Orbitron'; font-weight: bold; }

        /* Ocultar elementos */
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="cyber-grid"></div>
    <div class="particles" id="particles"></div>

    <!-- Tarjeta de Login/Registro -->
    <div class="auth-card">
        <h1 class="logo-small">BARBER<span>HUB</span></h1>
        
        <form id="authForm">
            <h2 id="formTitle" style="margin-bottom: 20px; font-family: 'Orbitron'; color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan);">INICIAR SESIÓN</h2>
            
            <!-- Campo Nombre (Solo visible en Registro) -->
            <div class="input-group hidden" id="nameGroup">
                <label>NOMBRE</label>
                <input type="text" id="nameInput" placeholder="Tu nombre">
            </div>

            <div class="input-group">
                <label>EMAIL</label>
                <input type="email" id="emailInput" placeholder="usuario@email.com" required>
            </div>

            <div class="input-group">
                <label>CONTRASEÑA</label>
                <input type="password" id="passInput" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">ENTRAR</button>
            
            <div class="message" id="messageBox"></div>

            <p class="toggle-text">
                <span id="toggleLabel">¿No tienes cuenta?</span> 
                <a id="toggleLink">Regístrate</a>
            </p>
        </form>
    </div>

    <div class="footer">
        &copy; 2026 All Rights Reserved | by <span>B-U4ALL</span>
    </div>

    <script src="config.js"></script>
    <script>
        // 1. Crear Burbujas
        function createParticles() {
            const c = document.getElementById('particles');
            for(let i=0; i<40; i++){
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random()*100 + '%';
                p.style.animationDelay = Math.random()*10 + 's';
                p.style.animationDuration = (7 + Math.random()*8) + 's';
                c.appendChild(p);
            }
        }
        createParticles();

        // 2. Lógica de Login vs Registro
        const form = document.getElementById('authForm');
        const nameGroup = document.getElementById('nameGroup');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const toggleLabel = document.getElementById('toggleLabel');
        const toggleLink = document.getElementById('toggleLink');
        const messageBox = document.getElementById('messageBox');
        
        let isRegister = false;

        // Detectar URL ?mode=register
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'register') {
            setMode(true);
        }

        function setMode(register) {
            isRegister = register;
            if(register) {
                nameGroup.classList.remove('hidden');
                formTitle.textContent = 'REGISTRARSE';
                formTitle.style.color = 'var(--neon-pink)';
                formTitle.style.textShadow = '0 0 10px var(--neon-pink)';
                submitBtn.textContent = 'CREAR CUENTA';
                submitBtn.style.background = 'var(--neon-pink)';
                submitBtn.style.boxShadow = '0 0 15px rgba(255, 0, 255, 0.4)';
                toggleLabel.textContent = '¿Ya tienes cuenta?';
                toggleLink.textContent = 'Inicia Sesión';
            } else {
                nameGroup.classList.add('hidden');
                formTitle.textContent = 'INICIAR SESIÓN';
                formTitle.style.color = 'var(--neon-cyan)';
                formTitle.style.textShadow = '0 0 10px var(--neon-cyan)';
                submitBtn.textContent = 'ENTRAR';
                submitBtn.style.background = 'var(--neon-cyan)';
                submitBtn.style.boxShadow = '0 0 15px rgba(0, 229, 238, 0.4)';
                toggleLabel.textContent = '¿No tienes cuenta?';
                toggleLink.textContent = 'Regístrate';
            }
            messageBox.textContent = '';
        }

        // Toggle Click
        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            setMode(!isRegister);
            // Actualizar URL sin recargar
            const newMode = !isRegister ? 'register' : 'login';
            window.history.pushState({}, '', `?mode=${newMode}`);
        });

        // 3. Enviar Formulario a Supabase
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passInput').value;
            const name = document.getElementById('nameInput').value;

            messageBox.textContent = 'Procesando...';
            messageBox.className = 'message';

            try {
                if (isRegister) {
                    // REGISTRO
                    const { data, error } = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: { data: { nombre: name, role: 'cliente' } }
                    });
                    if (error) throw error;
                    messageBox.textContent = '¡Cuenta creada! Redirigiendo...';
                    messageBox.classList.add('success');
                    setTimeout(() => window.location.href = 'index.html', 2000);
                } else {
                    // LOGIN
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email, password
                    });
                    if (error) throw error;
                    messageBox.textContent = 'Acceso concedido...';
                    messageBox.classList.add('success');
                    setTimeout(() => window.location.href = 'mi-perfil.html', 1000);
                }
            } catch (err) {
                messageBox.textContent = err.message;
                messageBox.classList.add('error');
            }
        });
    </script>
</body>
</html>

    <script src="config.js"></script>
    <script>
        // ==========================================
        // 1. BURBUJAS DE FONDO
        // ==========================================
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 10 + 's';
                p.style.animationDuration = (7 + Math.random() * 8) + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        // ==========================================
        // 2. CONTROL DE VISTAS (Login / Recovery / Reset)
        // ==========================================
        function showRecovery() {
            document.getElementById('authForm').classList.add('hidden');
            document.getElementById('recoveryForm').classList.remove('hidden');
        }
        
        function showLogin() {
            document.getElementById('recoveryForm').classList.add('hidden');
            document.getElementById('resetPasswordForm').classList.add('hidden');
            document.getElementById('authForm').classList.remove('hidden');
            document.getElementById('recoveryMessage').textContent = '';
        }

        function showResetPassword() {
            document.getElementById('authForm').classList.add('hidden');
            document.getElementById('recoveryForm').classList.add('hidden');
            document.getElementById('resetPasswordForm').classList.remove('hidden');
        }

        // ==========================================
        // 3. LÓGICA DE LOGIN / REGISTRO
        // ==========================================
        const form = document.getElementById('authForm');
        const nameGroup = document.getElementById('nameGroup');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const toggleLabel = document.getElementById('toggleLabel');
        const toggleLink = document.getElementById('toggleLink');
        const messageBox = document.getElementById('messageBox');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');
        
        let isRegister = false;

        // Detectar si venimos de ?mode=register
        if (new URLSearchParams(window.location.search).get('mode') === 'register') {
            setMode(true);
        }

        function setMode(register) {
            isRegister = register;
            if (register) {
                nameGroup.classList.remove('hidden');
                formTitle.textContent = 'REGISTRARSE';
                formTitle.style.color = 'var(--neon-pink)';
                formTitle.style.textShadow = '0 0 10px var(--neon-pink)';
                submitBtn.textContent = 'CREAR CUENTA';
                submitBtn.style.background = 'var(--neon-pink)';
                toggleLabel.textContent = '¿Ya tienes cuenta?';
                toggleLink.textContent = 'Inicia Sesión';
                forgotPasswordLink.classList.add('hidden');
            } else {
                nameGroup.classList.add('hidden');
                formTitle.textContent = 'INICIAR SESIÓN';
                formTitle.style.color = 'var(--neon-cyan)';
                formTitle.style.textShadow = '0 0 10px var(--neon-cyan)';
                submitBtn.textContent = 'ENTRAR';
                submitBtn.style.background = 'var(--neon-cyan)';
                toggleLabel.textContent = '¿No tienes cuenta?';
                toggleLink.textContent = 'Regístrate';
                forgotPasswordLink.classList.remove('hidden');
            }
            messageBox.textContent = '';
        }

        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            setMode(!isRegister);
            const newMode = !isRegister ? 'register' : 'login';
            window.history.pushState({}, '', `?mode=${newMode}`);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passInput').value;
            const name = document.getElementById('nameInput').value;

            messageBox.textContent = 'Procesando...';
            messageBox.className = 'message';

            try {
                if (isRegister) {
                    const { error } = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: { data: { nombre: name, role: 'cliente' } }
                    });
                    if (error) throw error;
                    messageBox.textContent = '¡Cuenta creada! Redirigiendo...';
                    messageBox.classList.add('success');
                    setTimeout(() => window.location.href = 'explorar.html', 2000);
                } else {
                    const { error } = await supabaseClient.auth.signInWithPassword({
                        email,
                        password
                    });
                    if (error) throw error;
                    messageBox.textContent = 'Acceso concedido...';
                    messageBox.classList.add('success');
                    setTimeout(() => window.location.href = 'explorar.html', 1000);
                }
            } catch (err) {
                messageBox.textContent = err.message;
                messageBox.classList.add('error');
            }
        });

        // ==========================================
        // 4. RECUPERACIÓN DE CONTRASEÑA (Enviar Email)
        // ==========================================
        document.getElementById('recoveryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('recoveryEmail').value;
            const msg = document.getElementById('recoveryMessage');

            msg.textContent = 'Enviando enlace...';
            msg.className = 'message';

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/auth.html'
                });
                if (error) throw error;
                
                msg.textContent = '✅ Enlace enviado. Revisa tu correo.';
                msg.classList.add('success');
                document.getElementById('recoveryEmail').value = '';
                
                setTimeout(() => showLogin(), 3000);
            } catch (err) {
                msg.textContent = 'Error: ' + err.message;
                msg.classList.add('error');
            }
        });

        // ==========================================
        // 5. ACTUALIZAR CONTRASEÑA (Post-Link)
        // ==========================================
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;
            const msg = document.getElementById('resetMessage');

            if (newPass.length < 6) {
                msg.textContent = '❌ Mínimo 6 caracteres.';
                msg.className = 'message error';
                return;
            }
            if (newPass !== confirmPass) {
                msg.textContent = '❌ Las contraseñas no coinciden.';
                msg.className = 'message error';
                return;
            }

            msg.textContent = 'Actualizando...';
            msg.className = 'message';

            try {
                const { error } = await supabaseClient.auth.updateUser({ password: newPass });
                if (error) throw error;
                
                msg.textContent = '✅ Contraseña actualizada. Redirigiendo...';
                msg.classList.add('success');
                setTimeout(() => window.location.href = 'explorar.html', 2000);
            } catch (err) {
                msg.textContent = 'Error: ' + err.message;
                msg.classList.add('error');
            }
        });

        // ==========================================
        // 6. GOOGLE SIGN IN
        // ==========================================
        document.getElementById('googleBtn').addEventListener('click', async () => {
            messageBox.textContent = 'Conectando...';
            messageBox.className = 'message';
            try {
                await supabaseClient.auth.signInWithOAuth({ provider: 'google' });
            } catch (err) {
                messageBox.textContent = err.message;
                messageBox.classList.add('error');
            }
        });

        // ==========================================
        // 7. DETECTOR AUTOMÁTICO DE RECUPERACIÓN
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.substring(1);
            const hashParams = new URLSearchParams(hash);
            const type = hashParams.get('type');

            if (type === 'recovery') {
                console.log('🔍 Enlace de recuperación detectado.');
                
                // Escuchar cuando Supabase termine de procesar la sesión
                supabaseClient.auth.onAuthStateChange((event, session) => {
                    if (event === 'SIGNED_IN' && type === 'recovery') {
                        console.log('✅ Sesión de recuperación confirmada.');
                        showResetPassword();
                        // Limpiar URL
                        window.history.replaceState(null, null, window.location.pathname);
                    }
                });
            }
        });
    </script>

<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💈</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | BarberHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: linear-gradient(180deg, #050505 0%, #0a0a1a 100%); min-height: 100vh;">

    <!-- 🌀 LOADER -->
    <div id="cyber-loader">
        <div class="loader-content">
            <img src="cyber-face.png" alt="Cyber Barber" class="loader-face" onerror="this.style.display='none'">
            <div class="boot-sequence">
                <p class="line">> VERIFYING CREDENTIALS...</p>
                <p class="line">> CHECKING USER ROLE...</p>
                <p class="line">> REDIRECTING...</p>
            </div>
            <div class="progress-container"><div class="progress-bar"></div></div>
            <p class="status-text">SYSTEM BOOT IN PROGRESS...</p>
        </div>
        <div class="scanlines"></div>
    </div>

    <!-- SCRIPT DE CIERRE AUTOMÁTICO -->
    <script>
        setTimeout(() => {
            const l = document.getElementById('cyber-loader');
            if (l) l.remove();
        }, 2500);
    </script>

    <!-- HEADER -->
    <div style="text-align:center; padding:20px;">
        <a href="index.html" style="color:#888; text-decoration:none; font-size:0.9rem;">← Volver al Directorio</a>
    </div>

    <!-- FORMULARIO DE LOGIN -->
    <div style="max-width:420px; margin:20px auto; padding:30px; background:rgba(15,15,25,0.85); backdrop-filter:blur(12px); border:1px solid var(--neon-cyan); border-radius:15px; box-shadow:0 0 25px rgba(0,242,255,0.15);">
        <h2 style="color:var(--neon-cyan); margin-bottom:20px; font-family:'Orbitron'; text-align:center; font-size:1.4rem;">🔐 ACCESO SISTEMA</h2>
        
      <form id="login-form">
    <input type="email" id="email" placeholder="📧 Correo Electrónico" required style="width:100%; padding:12px; margin:8px 0; background:rgba(0,0,0,0.6); border:1px solid #444; color:#fff; border-radius:6px; box-sizing:border-box; font-size:0.95rem;">
    <input type="password" id="password" placeholder="🔑 Contraseña" required style="width:100%; padding:12px; margin:8px 0; background:rgba(0,0,0,0.6); border:1px solid #444; color:#fff; border-radius:6px; box-sizing:border-box; font-size:0.95rem;">

    <!-- ✅ BOTÓN GOOGLE (NUEVO) -->
    <button type="button" onclick="signInWithGoogle()" style="width:100%; padding:12px; margin:8px 0; background:#fff; color:#333; font-weight:bold; border:1px solid #ccc; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
      <img src="https://www.google.com/favicon.ico" width="18" alt="G">
      Continuar con Google
    </button>
    <div style="text-align:center; color:#666; margin:5px 0; font-size:0.85rem;">— o —</div>
<!-- BOTÓN FACEBOOK -->
<button type="button" onclick="signInWithFacebook()" style="width:100%; padding:12px; margin:8px 0; background:#1877F2; color:#fff; font-weight:bold; border:none; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;">
  <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" width="20" alt="F" style="filter:invert(1)">
  Continuar con Facebook
</button>

          
    <!-- ✅ BOTÓN ENTRAR (SUBMIT) -->
    <button type="submit" id="btn-login" style="width:100%; padding:12px; background:var(--neon-cyan); color:#000; font-weight:bold; border:none; border-radius:6px; cursor:pointer; margin-top:5px; font-size:1rem;">ENTRAR</button>
    
    <p id="error-msg" style="color:#ff3333; font-size:0.85rem; margin-top:10px; display:none; text-align:center;"></p>
</form>
        <div style="margin-top:25px; text-align:center; border-top:1px solid #333; padding-top:15px;">
            <a href="registro.html" style="color:var(--neon-pink); text-decoration:none; display:block; margin-bottom:8px; font-weight:600;">✨ Crear Cuenta Nueva</a>
            <a href="index.html" style="color:#888; text-decoration:none; display:block; font-size:0.9rem;">🏠 Volver al Inicio</a>
        </div>
    </div>
<script src="config.js"></script>
<script>
  // 🔐 LOGIN CON EMAIL/PASSWORD
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-login');
    const errorMsg = document.getElementById('error-msg');
    btn.disabled = true; btn.textContent = 'Verificando...';
    errorMsg.style.display = 'none';

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });
      if (error) throw error;
      
      const role = data.user.user_metadata?.role || 'cliente';
      window.location.href = role === 'barbero' ? 'admin.html' : 'perfil-cliente.html';
    } catch (err) {
      errorMsg.textContent = '❌ ' + err.message;
      errorMsg.style.display = 'block';
      btn.disabled = false; btn.textContent = 'ENTRAR';
    }
  });

  // 🌐 LOGIN CON GOOGLE
  window.signInWithGoogle = async () => {
    try {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: 'https://barberhub-two.vercel.app/perfil-cliente.html'
        }
      });
      if (error) throw error;
    } catch (err) {
      alert('❌ Error con Google: ' + err.message);
    }
  };

  // 🔄 AUTO-LOGIN (Solo si ya hay sesión)
  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session && !window.location.href.includes('auth.html')) {
      const role = session.user.user_metadata?.role || 'cliente';
      window.location.href = role === 'barbero' ? 'admin.html' : 'perfil-cliente.html';
    }
  });
</script>

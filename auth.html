<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | BarberHub</title>
  <style>
    /* ESTILOS BÁSICOS PARA ASEGURAR QUE SE VEA ALGO */
    body {
      margin: 0; padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a; /* Fondo de respaldo oscuro */
      color: white;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    
    /* Si el fondo no carga, al menos se ve oscuro */
    .bg-fallback {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(10,15,30,0.9));
      z-index: -1;
    }

    /* Contenedor principal visible */
    #app-container {
      width: 100%; max-width: 450px; padding: 20px;
      text-align: center;
    }

    .loading { color: #00ffff; font-size: 1.2rem; }
    .error-box { 
      background: rgba(255,0,0,0.2); border: 1px solid red; 
      padding: 10px; border-radius: 8px; margin-top: 20px; 
      display: none; 
    }
  </style>
</head>
<body>

  <!-- Fondo de respaldo -->
  <div class="bg-fallback"></div>

  <div id="app-container">
    <h1 style="color:#00ffff; text-shadow: 0 0 10px cyan;">BARBERHUB</h1>
    <p>Cargando sistema...</p>
    
    <!-- Caja de errores visible si algo falla -->
    <div id="global-error" class="error-box"></div>
  </div>

  <!-- Cargar Supabase de forma tradicional para evitar errores de módulos complejos -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    // Verificar si Supabase cargó
    if (!window.supabase) {
      document.getElementById('global-error').style.display = 'block';
      document.getElementById('global-error').innerHTML = "❌ Error Crítico: No se pudo cargar la librería de Supabase. Revisa tu conexión a internet.";
      document.querySelector('p').textContent = "Error de carga.";
    } else {
      // Inicializar cliente
      const SUPABASE_URL = 'https://qnlbaxxhsbwbqqucbywn.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFubGJheHhic2J3YmdxdWNieXduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMzQzNjcsImV4cCI6MjA5NDcxMDM2N30.6n-0yf-9fuZKO8qJEM2dOmwBNxhijQtaBzVo2TNesjM';
      
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      document.querySelector('p').textContent = "Sistema listo. Conectando...";

      // Prueba de conexión simple
      supabase.from('profiles').select('count').limit(1).then(({ error }) => {
        if (error && !error.message.includes('relation')) {
           console.error("Error de conexión:", error);
           document.getElementById('global-error').style.display = 'block';
           document.getElementById('global-error').innerHTML = "⚠️ Error de Conexión: " + error.message;
        } else {
           console.log("Conexión exitosa");
           document.querySelector('p').textContent = "Conexión establecida. Redirigiendo al diseño...";
           
           // Aquí podrías inyectar el HTML dinámicamente o recargar la página si estabas en un estado roto
           setTimeout(() => {
             location.reload(); // Recargar para intentar cargar el CSS/HTML completo si estaba bloqueado
           }, 1000);
        }
      });
    }
  </script>
</body>
</html>

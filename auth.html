<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 Iniciar Sesión | BarberHub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.85), rgba(10, 10, 20, 0.9)), 
                  url('./fondobarber.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-container {
      background: rgba(20, 22, 28, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 255, 255, 0.15);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.1), 
                  inset 0 0 20px rgba(0, 255, 255, 0.05);
      width: 100%;
      max-width: 450px;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
      margin-bottom: 0.5rem;
    }

    .barber {
      color: #ffffff;
      display: block;
    }

    .hub {
      color: #00ffff;
      display: block;
      text-shadow: 0 0 10px #00ffff, 
                   0 0 20px #00ffff, 
                   0 0 30px #00ffff;
      animation: neonPulse 2s ease-in-out infinite;
    }

    @keyframes neonPulse {
      0%, 100% {
        text-shadow: 0 0 10px #00ffff, 
                     0 0 20px #00ffff, 
                     0 0 30px #00ffff;
      }
      50% {
        text-shadow: 0 0 15px #00ffff, 
                     0 0 25px #00ffff, 
                     0 0 35px #00ffff,
                     0 0 45px #00ffff;
      }
    }

    .auth-header p {
      color: #71717a;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    .auth-section { 
      display: none; 
    }
    
    .auth-section.active { 
      display: block; 
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: #00ffff;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      padding: 0.875rem 1rem;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 8px;
      color: #ffffff;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #00ffff;
      background: rgba(0, 0, 0, 0.7);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    }

    .form-group input::placeholder {
      color: #52525b;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #00ffff, #0080ff);
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
    }

    .btn-google {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(0, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      color: #ffffff;
    }

    .btn-google:hover {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: #00ffff;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.5), transparent);
    }

    .divider span {
      padding: 0 1rem;
    }

    .auth-links {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: #71717a;
    }

    .auth-links a {
      color: #00ffff;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s;
    }

    .auth-links a:hover {
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }

    .error-message {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid rgba(255, 0, 0, 0.4);
      color: #ff6b6b;
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      display: none;
    }

    .error-message.show {
      display: block;
      animation: shake 0.5s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    @media (max-width: 480px) {
      .auth-container {
        padding: 2rem 1.5rem;
      }
      
      .auth-header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1>
        <span class="barber">BARBER</span>
        <span class="hub">HUB</span>
      </h1>
      <p>Inicia sesión para continuar</p>
    </div>

    <div id="error-message" class="error-message"></div>

    <!-- SECCIÓN LOGIN -->
    <div id="login-section" class="auth-section active">
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">EMAIL</label>
          <input 
            type="email" 
            id="login-email" 
            name="email" 
            placeholder="tu@email.com" 
            required 
            autocomplete="email"
            class="auth-input"
          />
        </div>
        <div class="form-group">
          <label for="login-password">CONTRASEÑA</label>
          <input 
            type="password" 
            id="login-password" 
            name="password" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
            minlength="6"
            class="auth-input"
          />
        </div>
        <button type="submit" class="btn" id="login-btn">
          ENTRAR
        </button>
      </form>

      <div class="divider">
        <span>o continúa con</span>
      </div>

      <button class="btn btn-google" id="google-login-btn">
        <svg viewBox="0 0 24 24">
          <path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Sign in with Google
      </button>

      <div class="auth-links">
        <a href="./auth.html?mode=recover">¿Olvidaste tu contraseña?</a>
        <br><br>
        ¿No tienes cuenta? <a href="./auth.html?mode=register">Regístrate</a>
      </div>
    </div>

    <!-- SECCIÓN REGISTRO -->
    <div id="register-section" class="auth-section">
      <form id="register-form">
        <div class="form-group">
          <label for="register-email">EMAIL</label>
          <input 
            type="email" 
            id="register-email" 
            name="email" 
            placeholder="tu@email.com" 
            required 
            autocomplete="email"
          />
        </div>
        <div class="form-group">
          <label for="register-password">CONTRASEÑA</label>
          <input 
            type="password" 
            id="register-password" 
            name="password" 
            placeholder="••••••••" 
            required 
            minlength="6"
          />
        </div>
        <div class="form-group">
          <label for="register-confirm">CONFIRMAR CONTRASEÑA</label>
          <input 
            type="password" 
            id="register-confirm" 
            name="confirmPassword" 
            placeholder="••••••••" 
            required 
            minlength="6"
          />
        </div>
        <button type="submit" class="btn">
          REGISTRARSE
        </button>
      </form>
      <div class="auth-links">
        ¿Ya tienes cuenta? <a href="./auth.html?mode=login">Inicia sesión</a>
      </div>
    </div>

    <!-- SECCIÓN RECUPERAR -->
    <div id="recover-section" class="auth-section">
      <form id="recover-form">
        <div class="form-group">
          <label for="recover-email">EMAIL</label>
          <input 
            type="email" 
            id="recover-email" 
            name="email" 
            placeholder="tu@email.com" 
            required 
            autocomplete="email"
          />
        </div>
        <button type="submit" class="btn">
          ENVIAR ENLACE
        </button>
      </form>
      <div class="auth-links">
        <a href="./auth.html?mode=login">← Volver al inicio</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // ⚙️ CONFIGURACIÓN - Reemplaza con tus credenciales
    const SUPABASE_URL = 'https://qnlbaxxhsbwbqqucbywn.supabase.co';
    const SUPABASE_ANON_KEY = 'TU_ANON_KEY_AQUI';
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Manejar el parámetro ?mode=
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode') || 'login';

    // Elementos del DOM
    const sections = {
      login: document.getElementById('login-section'),
      register: document.getElementById('register-section'),
      recover: document.getElementById('recover-section')
    };

    const subtitle = document.querySelector('.auth-header p');
    const subtitles = {
      login: 'Inicia sesión para continuar',
      register: 'Crea tu cuenta gratis',
      recover: 'Recupera tu contraseña'
    };

    // Mostrar sección activa
    Object.keys(sections).forEach(key => {
      sections[key].classList.remove('active');
    });
    
    if (sections[mode]) {
      sections[mode].classList.add('active');
      subtitle.textContent = subtitles[mode] || subtitles.login;
    } else {
      sections.login.classList.add('active');
    }

    // Función para mostrar errores
    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
      setTimeout(() => errorDiv.classList.remove('show'), 5000);
    }

    // 🔐 LOGIN
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const email = e.target.email.value.trim();
      const password = e.target.password.value;

      btn.innerHTML = '<span style="display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,0.3);border-radius:50%;border-top-color:#000;animation:spin 1s linear infinite;"></span> Cargando...';
      btn.disabled = true;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ 
          email, 
          password 
        });
        
        if (error) throw error;

        // Verificar rol
        const { data: profile } = await supabase
          .from('profiles')
          .select('role')
          .eq('id', data.user.id)
          .single();

        // Redirigir según rol
        if (profile?.role === 'admin') {
          window.location.href = './admin.html';
        } else {
          window.location.href = './dashboard.html';
        }
      } catch (error) {
        showError('❌ ' + error.message);
        btn.innerHTML = 'ENTRAR';
        btn.disabled = false;
      }
    });

    // 🔵 GOOGLE LOGIN
    document.getElementById('google-login-btn').addEventListener('click', async () => {
      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + '/dashboard.html'
          }
        });
        
        if (error) throw error;
      } catch (error) {
        showError('❌ Error con Google: ' + error.message);
      }
    });

    // 📝 REGISTRO
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = e.target.email.value.trim();
      const password = e.target.password.value;
      const confirmPassword = e.target.confirmPassword.value;

      if (password !== confirmPassword) {
        showError('❌ Las contraseñas no coinciden');
        return;
      }

      try {
        const { error } = await supabase.auth.signUp({ 
          email, 
          password,
          options: { data: { role: 'client' } }
        });
        
        if (error) throw error;

        alert('✅ Registro exitoso. Verifica tu email.');
        window.location.href = './auth.html?mode=login';
      } catch (error) {
        showError('❌ ' + error.message);
      }
    });

    // 🔑 RECUPERAR CONTRASEÑA
    document.getElementById('recover-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = e.target.email.value.trim();

      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/auth.html?mode=newpassword',
        });
        
        if (error) throw error;

        alert('✅ Email de recuperación enviado. Revisa tu bandeja de entrada.');
        window.location.href = './auth.html?mode=login';
      } catch (error) {
        showError('❌ ' + error.message);
      }
    });
  </script>
</body>
</html>

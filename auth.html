<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión | BarberHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body {
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #050505;
    }

    /* 🌌 FONDO ANIMADO CYBERPUNK */
    .cyber-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      background: #050505;
      overflow: hidden;
    }
    .cyber-line {
      position: absolute;
      background: linear-gradient(90deg, transparent, #00f2ff, transparent);
      opacity: 0.25;
    }
    .cyber-line.h { height: 2px; width: 100%; left: 0; animation: moveH 5s linear infinite; }
    .cyber-line.v { width: 2px; height: 100%; top: 0; animation: moveV 5s linear infinite; }
    @keyframes moveH { 0% { top: -10%; opacity: 0; } 50% { opacity: 0.5; } 100% { top: 110%; opacity: 0; } }
    @keyframes moveV { 0% { left: -10%; opacity: 0; } 50% { opacity: 0.5; } 100% { left: 110%; opacity: 0; } }

    /* 💎 TARJETA FLOTANTE NEÓN */
    .login-card {
      background: rgba(10, 10, 20, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid #00f2ff;
      border-radius: 20px;
      padding: 40px 30px 35px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 242, 255, 0.25), inset 0 0 20px rgba(0, 242, 255, 0.05);
      animation: floatCard 6s ease-in-out infinite;
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg, #00f2ff, #ff00ff, #00f2ff);
      z-index: -1;
      border-radius: 22px;
      opacity: 0.4;
      filter: blur(12px);
    }

    /* ️ LOGO GRANDE */
    .login-logo {
      width: 190px; /* Más grande como pediste */
      height: auto;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 20px rgba(0, 242, 255, 0.8));
    }

    /* ✨ BARBERHUB CON LUZ ALREDEDOR DE LAS LETRAS */
    .card-brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: #fff;
      margin: 0 0 15px 0;
      /* Efecto de luz neón que rodea cada letra */
      text-shadow: 
        0 0 8px #00f2ff,
        0 0 16px #00f2ff,
        0 0 32px rgba(0, 242, 255, 0.8),
        0 0 60px rgba(0, 242, 255, 0.5);
      animation: brandPulse 3s ease-in-out infinite;
    }
    @keyframes brandPulse {
      0%, 100% { 
        text-shadow: 0 0 8px #00f2ff, 0 0 16px #00f2ff, 0 0 32px rgba(0,242,255,0.8), 0 0 60px rgba(0,242,255,0.5); 
      }
      50% { 
        text-shadow: 0 0 12px #00f2ff, 0 0 24px #00f2ff, 0 0 48px rgba(0,242,255,0.9), 0 0 80px rgba(0,242,255,0.7); 
      }
    }

    /*  TÍTULO BIENVENIDO */
    .login-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      margin: 0 0 35px;
      background: linear-gradient(90deg, #00f2ff, #ff00ff, #00f2ff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shineText 3s linear infinite;
      filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.6));
    }
    @keyframes shineText { to { background-position: 200% center; } }

    /* Inputs */
    .input-group {
      position: relative;
      margin-bottom: 18px;
      text-align: left;
    }
    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
      box-sizing: border-box;
    }
    .input-group input:focus {
      border-color: #00f2ff;
      box-shadow: 0 0 15px rgba(0, 242, 255, 0.25);
      background: rgba(255, 255, 255, 0.09);
    }

    /* Botón Principal */
    .btn-login-main {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #00f2ff;
      color: #000;
      box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
      margin-bottom: 8px;
    }
    .btn-login-main:hover {
      background: #fff;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
      transform: translateY(-3px);
    }

    /* ✅ SEPARADOR CON ESPACIO CORREGIDO */
    .divider {
      margin: 35px 0 22px;
      border: 0;
      border-top: 1px solid rgba(255,255,255,0.15);
      position: relative;
    }
    .divider span {
      position: absolute;
      top: -11px; left: 50%; transform: translateX(-50%);
      background: rgba(10, 10, 20, 0.95);
      padding: 0 12px; 
      color: #888; 
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Botón Google */
    .btn-google {
      width: 100%;
      padding: 14px;
      border: 1px solid #ff00ff;
      border-radius: 12px;
      background: transparent;
      color: #ff00ff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
      margin-bottom: 18px;
    }
    .btn-google:hover {
      background: rgba(255, 0, 255, 0.1);
      box-shadow: 0 0 25px rgba(255, 0, 255, 0.5);
      transform: translateY(-3px);
      color: #fff;
    }

    .links-container {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .links-container a {
      color: #aaa;
      text-decoration: none;
      transition: 0.2s;
    }
    .links-container a:hover {
      color: #00f2ff;
      text-shadow: 0 0 5px #00f2ff;
    }
  </style>
</head>
<body>

  <!-- 🌌 FONDO ANIMADO -->
  <div class="cyber-bg">
    <div class="cyber-line h" style="top: 20%;"></div>
    <div class="cyber-line h" style="top: 60%; animation-delay: 2.5s;"></div>
    <div class="cyber-line v" style="left: 30%;"></div>
    <div class="cyber-line v" style="left: 80%; animation-delay: 1.5s;"></div>
  </div>

  <!-- 💎 TARJETA LOGIN -->
  <div class="login-card">
    <img src="logo.png" alt="Logo BarberHub" class="login-logo">
    <h2 class="card-brand">BARBERHUB</h2>
    <h1 class="login-title">Bienvenido</h1>

    <form id="login-form">
      <div class="input-group">
        <input type="email" id="email" placeholder=" Correo electrónico" required>
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Contraseña" required>
      </div>
      
      <button type="submit" class="btn-login-main">
        <i class="fas fa-bolt"></i> INICIAR SESIÓN
      </button>
    </form>

    <hr class="divider"><span>O CONTINÚA CON</span>

    <button onclick="loginGoogle()" class="btn-google">
      <i class="fab fa-google"></i> Google
    </button>

    <div class="links-container">
      <a href="recuperar-password.html">¿Olvidaste contraseña?</a>
      <a href="registro.html">Registrarse</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // Login con Email
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.querySelector('.btn-login-main');
      
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cargando...';
      
      try {
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });
        if (error) throw error;
        window.location.href = 'perfil-cliente.html';
      } catch (err) {
        alert(' Error: ' + err.message);
        btn.innerHTML = originalText;
      }
    });

    // Login con Google
    async function loginGoogle() {
      try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + '/perfil-cliente.html' }
        });
        if (error) throw error;
      } catch (err) {
        alert('Error con Google: ' + err.message);
      }
    }
  </script>
</body>
</html>

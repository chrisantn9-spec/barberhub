<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión | BarberHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* CONFIGURACIÓN BÁSICA */
    body {
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #050505;
      font-family: 'Inter', sans-serif;
    }

    /*  MURO DE PALABRAS EN EL FONDO (BarberHub repetido) */
    .bg-text-layer {
      position: fixed;
      top: -10%; left: -10%;
      width: 120%; height: 120%;
      z-index: -2;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      gap: 40px;
      transform: rotate(-15deg);
      pointer-events: none;
      opacity: 0.6;
    }
    
    .bg-text-layer span {
      font-family: 'Orbitron', sans-serif;
      font-size: 4vw; /* Tamaño grande */
      font-weight: 900;
      color: transparent;
      -webkit-text-stroke: 1px rgba(0, 242, 255, 0.3); /* Borde neón tenue */
      white-space: nowrap;
    }

    /*  LUZ QUE RECORRE EL FONDO */
    .bg-light-beam {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      background: linear-gradient(90deg, 
        transparent 0%, 
        transparent 45%, 
        rgba(0, 242, 255, 0.15) 50%, 
        transparent 55%, 
        transparent 100%);
      animation: sweepLight 6s linear infinite;
      pointer-events: none;
    }
    
    @keyframes sweepLight {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* 💎 TARJETA (CARTEL) DE INICIO */
    .login-card {
      /* Fondo neutro oscuro */
      background: rgba(15, 15, 20, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 242, 255, 0.3);
      border-radius: 20px;
      
      padding: 50px 30px 40px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      position: relative;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 242, 255, 0.05);
      animation: floatCard 6s ease-in-out infinite;
      z-index: 10;
    }
    
    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* ✨ TÍTULO DIVIDIDO: BARBER (Blanco) HUB (Neón) */
    .card-brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 15px;
      display: inline-block;
      position: relative;
    }
    
    .card-brand .word-barber {
      color: #ffffff; /* Blanco puro */
    }
    
    .card-brand .word-hub {
      color: var(--neon-cyan); /* Color neón */
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
    }

    /* Efecto de luz brillante que pasa por el título */
    .card-brand::after {
      content: '';
      position: absolute;
      top: 0; left: -50%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
      transform: skewX(-20deg);
      animation: shineTitle 4s infinite;
    }
    @keyframes shineTitle {
      0% { left: -50%; }
      100% { left: 150%; }
    }

    .login-subtitle {
      color: #aaa;
      font-size: 1rem;
      margin-bottom: 35px;
    }

    /* Inputs */
    .input-group {
      position: relative;
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group input {
      width: 100%;
      padding: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
      box-sizing: border-box;
    }
    .input-group input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
    }

    /* Botón Principal */
    .btn-login-main {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
      margin-bottom: 10px;
    }
    .btn-login-main:hover {
      background: #fff;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.6);
      transform: translateY(-3px);
    }

    /* Separador */
    .divider {
      margin: 35px 0 25px;
      border: 0;
      border-top: 1px solid rgba(255,255,255,0.1);
      position: relative;
    }
    .divider span {
      position: absolute;
      top: -12px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 15, 20, 1);
      padding: 0 15px; 
      color: #888; 
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Botón Google */
    .btn-google {
      width: 100%;
      padding: 16px;
      border: 1px solid var(--neon-pink);
      border-radius: 12px;
      background: transparent;
      color: var(--neon-pink);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 0 10px rgba(255, 0, 255, 0.15);
      margin-bottom: 20px;
    }
    .btn-google:hover {
      background: rgba(255, 0, 255, 0.1);
      box-shadow: 0 0 25px rgba(255, 0, 255, 0.4);
      transform: translateY(-3px);
      color: #fff;
    }

    .links-container {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .links-container a {
      color: #aaa;
      text-decoration: none;
      transition: 0.2s;
    }
    .links-container a:hover {
      color: var(--neon-cyan);
      text-shadow: 0 0 5px var(--neon-cyan);
    }
  </style>
</head>
<body>

  <!-- 🌌 FONDO CON PALABRAS Y LUZ -->
  <div class="bg-text-layer">
    <!-- Repetimos la palabra varias veces para llenar el fondo -->
    <span>BARBERHUB</span><span>BARBERHUB</span><span>BARBERHUB</span>
    <span>BARBERHUB</span><span>BARBERHUB</span><span>BARBERHUB</span>
    <span>BARBERHUB</span><span>BARBERHUB</span><span>BARBERHUB</span>
    <span>BARBERHUB</span><span>BARBERHUB</span><span>BARBERHUB</span>
    <span>BARBERHUB</span><span>BARBERHUB</span><span>BARBERHUB</span>
    <span>BARBERHUB</span><span>BARBERHUB</span><span>BARBERHUB</span>
  </div>
  <div class="bg-light-beam"></div>

  <!-- 💎 TARJETA LOGIN (SIN LOGO) -->
  <div class="login-card">
    
    <!-- ✅ Título: BARBER en blanco, HUB en neón -->
    <h2 class="card-brand">
      <span class="word-barber">BARBER</span><span class="word-hub">HUB</span>
    </h2>
    
    <p class="login-subtitle">Bienvenido de nuevo</p>

    <form id="login-form">
      <div class="input-group">
        <input type="email" id="email" placeholder=" Correo electrónico" required>
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Contraseña" required>
      </div>
      
      <button type="submit" class="btn-login-main">
        <i class="fas fa-bolt"></i> INICIAR SESIÓN
      </button>
    </form>

    <hr class="divider"><span>O CONTINÚA CON</span>

    <button onclick="loginGoogle()" class="btn-google">
      <i class="fab fa-google"></i> Google
    </button>

    <div class="links-container">
      <a href="recuperar-password.html">¿Olvidaste contraseña?</a>
      <a href="registro.html">Registrarse</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // Login con Email
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.querySelector('.btn-login-main');
      
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cargando...';
      
      try {
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });
        if (error) throw error;
        window.location.href = 'perfil-cliente.html';
      } catch (err) {
        alert(' Error: ' + err.message);
        btn.innerHTML = originalText;
      }
    });

    // Login con Google
    async function loginGoogle() {
      try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + '/perfil-cliente.html' }
        });
        if (error) throw error;
      } catch (err) {
        alert('Error con Google: ' + err.message);
      }
    }
  </script>
</body>
</html>

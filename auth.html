<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | BarberHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-card">
    <h1 class="brand"><span class="b">BARBER</span><span class="h">HUB</span></h1>
    <p class="subtitle">Bienvenido de nuevo</p>
    <form id="login-form">
      <div class="input-group"><input type="email" id="email" placeholder="📧 Correo electrónico" required></div>
      <div class="input-group"><input type="password" id="password" placeholder="🔑 Contraseña" required></div>
      <button type="submit" class="btn-login-main"><i class="fas fa-bolt"></i> INICIAR SESIÓN</button>
    </form>
    <hr class="divider"><span>O CONTINÚA CON</span>
    <button onclick="loginGoogle()" class="btn-google"><i class="fab fa-google"></i> Google</button>
    <div class="links-container">
      <a href="recuperar-password.html">¿Olvidaste contraseña?</a>
      <a href="registro.html">Registrarse</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // Redirigir si ya hay sesión
    (async () => {
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) {
          if (user.user_metadata?.role === 'barbero') window.location.href = 'admin.html';
          else window.location.href = 'index.html';
        }
      } catch {}
    })();

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.querySelector('.btn-login-main');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cargando...';
      try {
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        if (error) throw error;
        window.location.href = 'index.html';
      } catch (err) {
        alert('❌ ' + err.message);
        btn.innerHTML = '<i class="fas fa-bolt"></i> INICIAR SESIÓN';
      }
    });

    window.loginGoogle = async () => {
      try {
        await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/index.html' } });
      } catch (err) { alert('❌ Error Google: ' + err.message); }
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Barbería | BarberHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: linear-gradient(180deg, #050505 0%, #0a0a1a 100%); min-height: 100vh;">

    <div style="text-align:center; padding:20px;">
        <a href="index.html" style="color:#888; text-decoration:none; font-size:0.9rem;">← Volver</a>
    </div>

    <div style="max-width:500px; margin:20px auto; padding:30px; background:rgba(20,20,30,0.8); backdrop-filter:blur(10px); border:1px solid var(--neon-pink); border-radius:15px; box-shadow:0 0 20px rgba(255,0,255,0.2);">
        <h2 style="color:var(--neon-pink); margin-bottom:20px; font-family:'Orbitron'; text-align:center;">💈 REGISTRAR BARBERÍA</h2>
        
        <form id="registro-form">
            <input type="text" id="barber-name" placeholder="✂️ Nombre de la Barbería" required style="width:100%; padding:12px; margin:8px 0; background:rgba(0,0,0,0.6); border:1px solid #444; color:#fff; border-radius:5px; box-sizing:border-box;">
            
            <input type="email" id="owner-email" placeholder="📧 Tu Email" required style="width:100%; padding:12px; margin:8px 0; background:rgba(0,0,0,0.6); border:1px solid #444; color:#fff; border-radius:5px; box-sizing:border-box;">
            
            <input type="password" id="owner-password" placeholder="🔑 Contraseña (mín 6 caracteres)" required minlength="6" style="width:100%; padding:12px; margin:8px 0; background:rgba(0,0,0,0.6); border:1px solid #444; color:#fff; border-radius:5px; box-sizing:border-box;">
            
            <input type="text" id="location" placeholder="📍 Ubicación/Zona" required style="width:100%; padding:12px; margin:8px 0; background:rgba(0,0,0,0.6); border:1px solid #444; color:#fff; border-radius:5px; box-sizing:border-box;">
            
            <input type="tel" id="phone" placeholder="📱 Teléfono" required style="width:100%; padding:12px; margin:8px 0; background:rgba(0,0,0,0.6); border:1px solid #444; color:#fff; border-radius:5px; box-sizing:border-box;">
            
            <button type="submit" id="btn-registro" style="width:100%; padding:12px; background:var(--neon-pink); color:#fff; font-weight:bold; border:none; border-radius:5px; cursor:pointer; margin-top:15px; font-size:1rem;">CREAR CUENTA</button>
            <p id="registro-msg" style="font-size:0.85rem; margin-top:10px; display:none;"></p>
        </form>

        <div style="margin-top:20px; text-align:center; padding-top:20px; border-top:1px solid #333;">
            <a href="auth.html" style="color:var(--neon-cyan); text-decoration:none;">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        document.getElementById('registro-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-registro');
            const msg = document.getElementById('registro-msg');
            
            btn.disabled = true;
            btn.textContent = 'Registrando...';
            msg.style.display = 'none';

            const email = document.getElementById('owner-email').value;
            const password = document.getElementById('owner-password').value;
            const barberName = document.getElementById('barber-name').value;
            const location = document.getElementById('location').value;
            const phone = document.getElementById('phone').value;

            try {
                // 1. Crear usuario en Auth
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

                if (authError) throw authError;

                // 2. Guardar datos de la barbería
                const { error: barberError } = await supabaseClient
                    .from('barbers')
                    .insert([{
                        owner_id: authData.user.id,
                        name: barberName,
                        location: location,
                        phone: phone,
                        owner_email: email,
                        created_at: new Date().toISOString()
                    }]);

                if (barberError) throw barberError;

                // ✅ ÉXITO - Redirigir al login
                msg.style.color = '#00ff88';
                msg.textContent = '✅ Registro exitoso. Redirigiendo...';
                msg.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = 'auth.html';
                }, 1500);

            } catch (err) {
                msg.style.color = '#ff3333';
                msg.textContent = '❌ ' + err.message;
                msg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'CREAR CUENTA';
            }
        });
    </script>
</body>
</html>

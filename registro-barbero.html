<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Barbería | BarberHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <img src="logo.png" class="logo-img" alt="Logo BarberHub">
        <h1>💈 REGISTRAR TU BARBERÍA</h1>
        <p>Crea tu cuenta y registra tu barbería en un solo paso</p>
    </header>
    
    <main style="max-width:600px; margin:0 auto; padding:20px;">
        <form id="barber-form" style="background:var(--glass-bg); backdrop-filter:blur(12px); border:1px solid var(--glass-border); border-radius:14px; padding:30px;">
            
            <h3 style="color:var(--neon-cyan); margin-bottom:15px; font-family:'Orbitron', sans-serif;"> DATOS DE LA BARBERÍA</h3>
            
            <label>📛 Nombre de la Barbería:</label>
            <input type="text" id="barber-name" required placeholder="Ej: Barbería El Clásico">
            
            <label>👤 Tu Nombre (Dueño):</label>
            <input type="text" id="owner-name" required placeholder="Tu nombre completo">
            
            <label>📍 Dirección completa:</label>
            <input type="text" id="barber-location" required placeholder="Ej: Av. Principal 123, Ciudad, País">
            <small style="color:#888; display:block; margin-bottom:15px;">
                Los clientes verán tu ubicación en el mapa
            </small>
            
            <label>📱 Teléfono / WhatsApp:</label>
            <input type="tel" id="barber-phone" required placeholder="Ej: +50312345678 (con código de país)">
            
            <label>🚚 ¿Realiza Delivery?</label>
            <select id="delivery" style="width:100%; padding:12px; background:rgba(0,0,0,0.65); color:#fff; border:1px solid var(--glass-border); border-radius:6px; font-family:'Rajdhani', sans-serif; font-size:1rem; margin-bottom:15px;">
                <option value="no">No hago delivery</option>
                <option value="si">Sí, hago delivery</option>
            </select>
            
            <hr style="border:1px solid var(--glass-border); margin:25px 0;">
            
            <h3 style="color:var(--neon-pink); margin-bottom:15px; font-family:'Orbitron', sans-serif;">🔐 CREAR TU CUENTA</h3>
            
            <label>📧 Email (para iniciar sesión):</label>
            <input type="email" id="auth-email" required placeholder="tu@email.com">
            
            <label>🔑 Contraseña:</label>
            <input type="password" id="auth-password" required minlength="6" placeholder="Mínimo 6 caracteres">
            <small style="color:#888; display:block; margin-bottom:15px;">
                Esta contraseña te permitirá acceder a tu panel de administración
            </small>
            
            <button type="submit" style="background:var(--neon-cyan); color:#000; font-size:1.1rem; padding:15px; margin-top:10px; border:none; border-radius:8px; font-weight:700; cursor:pointer; width:100%;">
                🚀 CREAR CUENTA Y PUBLICAR
            </button>
        </form>
        
        <p id="reg-msg" style="margin-top:20px; text-align:center; font-weight:600; font-size:1.1rem;"></p>
        
        <p style="text-align:center; margin-top:20px; font-size:0.9rem;">
            ¿Ya tienes cuenta? <a href="auth.html" style="color:var(--neon-cyan); text-decoration:none;">Inicia sesión aquí</a>
        </p>
        
        <p style="text-align:center; margin-top:10px;">
            <a href="index.html" style="color:#888; text-decoration:none; font-size:0.85rem;">← Volver al inicio</a>
        </p>
    </main>
    
    <script src="config.js"></script>
    <script src="registro-barbero.js"></script>
</body>
</html>

<!-- dashboard.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BarberHub | Panel</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1115; color: #e4e4e7; padding: 2rem; }
    #loader { text-align: center; margin-top: 20vh; font-size: 1.2rem; }
    #content { display: none; }
    .btn-logout { background: #ef4444; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; margin-top: 2rem; }
  </style>
</head>
<body>
  <div id="loader">🔐 Verificando sesión...</div>
  
  <div id="content">
    <h1>👤 Bienvenido a tu Panel</h1>
    <p>Email: <span id="user-email">Cargando...</span></p>
    <button id="logout" class="btn-logout">Cerrar sesión</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // 🔍 REEMPLAZA ESTO CON TU PROVEEDOR DE AUTENTICACIÓN
        // Ejemplo Supabase: const { data: { session } } = await supabase.auth.getSession();
        // Ejemplo Firebase: await firebase.auth().currentUser?.getIdToken();
        
        // Simulación de verificación (quitar en producción):
        const session = sessionStorage.getItem('auth_session'); 
        if (!session) throw new Error('No hay sesión activa');

        // ✅ Sesión válida → mostrar panel
        document.getElementById('user-email').textContent = JSON.parse(session).email || 'Usuario';
        document.getElementById('loader').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        document.getElementById('logout').addEventListener('click', () => {
          sessionStorage.removeItem('auth_session');
          window.location.href = '/auth.html?mode=login';
        });
      } catch (err) {
        console.warn('Sesión inválida o expirada:', err);
        window.location.href = '/auth.html?mode=login';
      }
    });
  </script>
  <!-- auth.html -->
<script type="module" src="./js/supabase-client.js"></script>
<script type="module" src="./js/auth.js"></script>

<!-- dashboard.html -->
<script type="module" src="./js/supabase-client.js"></script>
<script type="module" src="./js/dashboard.js"></script>
</body>
</html>

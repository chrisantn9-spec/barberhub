<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Chats | BarberHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #050505; color: #fff; margin: 0; padding: 0; }
        .chat-item { background:rgba(20,20,30,0.6); border:1px solid #333; border-radius:8px; padding:15px; margin:10px 15px; cursor:pointer; transition:0.3s; display:flex; align-items:center; gap:15px; }
        .chat-item:hover { background:rgba(0,242,255,0.1); border-color:var(--neon-cyan); transform:translateX(5px); }
        .chat-avatar { width:50px; height:50px; border-radius:50%; background:var(--neon-cyan); display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:bold; color:#000; }
        .chat-info { flex:1; }
        .chat-name { color:#fff; font-weight:bold; font-size:1rem; margin-bottom:3px; }
        .chat-preview { color:#888; font-size:0.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; }
        .chat-time { color:#666; font-size:0.75rem; }
    </style>
</head>
<body>
    <header style="background:rgba(15,15,25,0.95); border-bottom:1px solid var(--neon-cyan); padding:15px; display:flex; align-items:center; gap:15px;">
        <a href="perfil-cliente.html" style="color:var(--neon-cyan); text-decoration:none; font-size:1.5rem;">←</a>
        <h1 style="color:#fff; font-family:'Orbitron'; font-size:1.2rem; margin:0; flex:1;">💬 Mis Conversaciones</h1>
    </header>
    <main style="max-width:600px; margin:0 auto; padding:20px 0;">
        <div id="chat-list"><p style="text-align:center; color:#888; padding:40px;">Cargando...</p></div>
        <div style="background:rgba(0,242,255,0.05); border:1px solid var(--neon-cyan); border-radius:8px; padding:15px; text-align:center; margin:20px 15px;">
            <p style="color:#888; font-size:0.85rem; margin-bottom:10px;">¿Hablar con una barbería nueva?</p>
            <a href="index.html" style="display:inline-block; background:var(--neon-cyan); color:#000; padding:10px 20px; border-radius:6px; text-decoration:none; font-weight:bold;">🔍 Buscar Barberías</a>
        </div>
    </main>
    <script src="config.js"></script>
    <script src="chat-list.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat | BarberHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root { 
      --neon-cyan: #00E5EE; 
      --neon-pink: #ff00ff; 
      --neon-green: #00ff41;
      --neon-purple: #bf00ff; 
      --neon-yellow: #fff01f; 
      --neon-orange: #ff6600;
      --dark-bg: #030303;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body { 
      font-family: 'Rajdhani', sans-serif; 
      color: #fff; 
      height: 100vh; 
      background: var(--dark-bg); 
      overflow: hidden; 
      display: flex; 
      justify-content: center;
    }
    
    /* 🌌 FONDO VISIBLE */
    .cyber-bg { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: linear-gradient(135deg, rgba(0,0,0,0.4) 0%, rgba(10,5,20,0.6) 100%), url('./chat.jpeg');
      background-size: cover; background-position: center; background-attachment: fixed; z-index: -2; 
    }
    .cyber-grid { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background-image: linear-gradient(rgba(0, 229, 238, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 238, 0.08) 1px, transparent 1px); 
      background-size: 40px 40px; z-index: -1; pointer-events: none; 
    }

    /* 📱 CONTENEDOR PRINCIPAL TIPO CARTA TRANSPARENTE */
    .chat-container {
      width: 100%;
      max-width: 480px; /* Más compacto */
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: rgba(5, 8, 15, 0.45); /* Muy transparente */
      backdrop-filter: blur(12px); /* Efecto cristal */
      -webkit-backdrop-filter: blur(12px);
      border-left: 1px solid rgba(0, 229, 238, 0.3);
      border-right: 1px solid rgba(0, 229, 238, 0.3);
      box-shadow: 0 0 40px rgba(0, 229, 238, 0.15);
      position: relative;
      z-index: 10;
    }

    /* HEADER COMPACTO Y NEÓN */
    .chat-header {
      display: flex; align-items: center; gap: 12px; 
      padding: 12px 15px;
      background: rgba(5, 8, 15, 0.6);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(0, 229, 238, 0.4);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 229, 238, 0.2);
      z-index: 20;
    }
    .back-btn {
      width: 38px; height: 38px; 
      background: rgba(0, 229, 238, 0.1);
      border: 1px solid rgba(0, 229, 238, 0.5); 
      border-radius: 10px; color: var(--neon-cyan);
      font-size: 1rem; display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: all 0.2s; 
      box-shadow: 0 0 10px rgba(0, 229, 238, 0.3);
    }
    .back-btn:active { transform: scale(0.95); background: rgba(0, 229, 238, 0.2); }
    
    .barber-info { flex: 1; display: flex; align-items: center; gap: 10px; }
    .barber-avatar { 
      width: 42px; height: 42px; border-radius: 50%; 
      border: 2px solid var(--neon-cyan); object-fit: cover; 
      box-shadow: 0 0 15px rgba(0, 229, 238, 0.4); 
    }
    .barber-name { 
      font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 700; 
      text-shadow: 0 0 10px rgba(0, 229, 238, 0.6); 
    }
    .status-container { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
    .status-dot { 
      width: 8px; height: 8px; border-radius: 50%; background: var(--neon-green); 
      box-shadow: 0 0 8px var(--neon-green); animation: pulse-green 2s infinite; 
    }
    @keyframes pulse-green { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.4); opacity: 0.7; } }
    .status-text { font-size: 0.7rem; color: var(--neon-green); font-weight: 600; letter-spacing: 0.5px; }

    /* 💬 ÁREA DE MENSAJES COMPACTA */
    .chat-area {
      flex: 1; overflow-y: auto; padding: 15px; 
      display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 2px; box-shadow: 0 0 8px var(--neon-cyan); }

    .message-wrapper {
      display: flex; flex-direction: column; max-width: 85%; position: relative;
      animation: messagePop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .message-wrapper.sent { align-self: flex-end; align-items: flex-end; }
    .message-wrapper.received { align-self: flex-start; align-items: flex-start; }
    @keyframes messagePop { from { opacity: 0; transform: scale(0.9) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    .message {
      padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; line-height: 1.4; 
      position: relative; backdrop-filter: blur(8px); cursor: pointer; transition: transform 0.2s;
    }
    .message:active { transform: scale(0.98); }
    
    .message.received {
      background: rgba(255, 0, 255, 0.15);
      border: 1px solid rgba(255, 0, 255, 0.4); border-bottom-left-radius: 4px;
      box-shadow: 0 4px 15px rgba(255, 0, 255, 0.2), inset 0 0 10px rgba(255, 0, 255, 0.05);
    }
    .message.sent {
      background: rgba(0, 229, 238, 0.15);
      border: 1px solid rgba(0, 229, 238, 0.5); border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(0, 229, 238, 0.2), inset 0 0 10px rgba(0, 229, 238, 0.05);
    }

    .message-image { max-width: 100%; border-radius: 10px; margin-top: 6px; border: 1px solid rgba(255, 255, 255, 0.2); }
    .message-time { font-size: 0.6rem; color: rgba(255, 255, 255, 0.5); margin-top: 4px; text-align: right; font-family: 'Orbitron', sans-serif; }

    /* 🎯 MENÚ DE 3 PUNTITOS */
    .message-options-btn {
      position: absolute; top: -8px; right: 0;
      background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1rem; line-height: 1; z-index: 10;
      opacity: 0; transition: opacity 0.2s;
    }
    .message-wrapper.sent:hover .message-options-btn, .message-wrapper.sent:active .message-options-btn { opacity: 1; }
    
    .options-dropdown {
      position: absolute; top: 22px; right: 0;
      background: rgba(10, 15, 30, 0.95); border: 1px solid var(--neon-pink);
      border-radius: 8px; padding: 4px; min-width: 110px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(255, 0, 255, 0.3);
      display: none; z-index: 20;
    }
    .options-dropdown.show { display: block; animation: fadeIn 0.2s; }
    .options-dropdown button {
      width: 100%; padding: 8px; background: none; border: none; color: #ff4444;
      font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 0.85rem;
      cursor: pointer; border-radius: 6px; text-align: left; display: flex; align-items: center; gap: 6px;
    }
    .options-dropdown button:hover { background: rgba(255, 68, 68, 0.15); }

    /* 💥 REACCIONES */
    .message-reactions { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
    .reaction-badge {
      background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px; padding: 2px 6px; font-size: 0.8rem;
      display: flex; align-items: center; gap: 3px;
    }
    .reaction-badge.active { border-color: var(--neon-cyan); box-shadow: 0 0 8px rgba(0, 229, 238, 0.4); }

    .quick-reaction-bar {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      background: rgba(10, 15, 30, 0.9); border: 1px solid var(--neon-yellow);
      border-radius: 16px; padding: 6px 10px; display: none; gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(255, 240, 31, 0.3);
      z-index: 50; margin-bottom: 8px;
    }
    .quick-reaction-bar.show { display: flex; animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popUp { from { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.8); } to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }
    .quick-emoji { font-size: 1.3rem; cursor: pointer; transition: transform 0.2s; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.5)); }
    .quick-emoji:hover { transform: scale(1.4) translateY(-4px); }

    /* ⌨️ ÁREA DE INPUT COMPACTA */
    .input-area {
      padding: 12px 15px; background: rgba(5, 8, 15, 0.6); backdrop-filter: blur(15px);
      border-top: 1px solid rgba(0, 229, 238, 0.4); display: flex; gap: 10px; align-items: center;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5); position: relative; z-index: 20;
    }
    .chat-input {
      flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 229, 238, 0.3);
      border-radius: 20px; padding: 10px 16px; color: #fff; font-family: 'Rajdhani', sans-serif;
      font-size: 0.95rem; outline: none; transition: all 0.3s;
    }
    .chat-input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 229, 238, 0.3); }
    
    .action-btn {
      width: 40px; height: 40px; border: none; border-radius: 50%; color: #fff; font-size: 1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
      flex-shrink: 0;
    }
    .emoji-btn { background: linear-gradient(145deg, var(--neon-yellow), var(--neon-orange)); box-shadow: 0 4px 0 rgba(255, 102, 0, 0.6), 0 0 15px rgba(255, 240, 31, 0.4); color: #000; }
    .emoji-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(255, 102, 0, 0.6); }
    .send-btn { background: linear-gradient(145deg, var(--neon-green), #00cc33); box-shadow: 0 4px 0 rgba(0, 204, 51, 0.6), 0 0 15px rgba(0, 255, 65, 0.4); }
    .send-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 204, 51, 0.6); }
    .photo-btn { background: linear-gradient(145deg, var(--neon-cyan), var(--neon-blue)); box-shadow: 0 4px 0 rgba(0, 114, 255, 0.6), 0 0 15px rgba(0, 229, 238, 0.4); }
    .photo-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 114, 255, 0.6); }
    #photo-input { display: none; }

    /* 🎨 PANEL DE EMOJIS COMPACTO Y TRANSPARENTE */
    .emoji-panel {
      position: absolute; bottom: 70px; left: 10px; right: 10px;
      background: rgba(5, 8, 15, 0.85); backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 240, 31, 0.4); border-radius: 16px;
      padding: 12px; max-height: 280px; overflow-y: auto; display: none; z-index: 1000;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 240, 31, 0.2);
    }
    .emoji-panel.show { display: block; animation: slideUpEmoji 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes slideUpEmoji { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    
    .emoji-category-title { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: var(--neon-cyan); margin: 12px 0 8px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(0,229,238,0.2); padding-bottom: 4px; }
    .emoji-category-title:first-child { margin-top: 0; }
    
    .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    
    .emoji-item {
      font-size: 1.4rem; cursor: pointer; text-align: center; padding: 6px 2px;
      border-radius: 10px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 2px 0 rgba(0,0,0,0.6)) drop-shadow(0 0 6px rgba(255, 240, 31, 0.3));
    }
    .emoji-item:hover {
      transform: translateY(-4px) scale(1.15) rotateZ(5deg);
      background: rgba(255, 240, 31, 0.15);
      border-color: var(--neon-yellow);
      filter: drop-shadow(0 4px 0 rgba(0,0,0,0.6)) drop-shadow(0 0 12px rgba(255, 240, 31, 0.7));
    }
    .emoji-item:active { transform: translateY(-1px) scale(1.05); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @media (max-width: 500px) {
      .chat-container { max-width: 100%; border: none; }
      .emoji-grid { grid-template-columns: repeat(5, 1fr); }
      .emoji-item { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="cyber-bg"></div>
  <div class="cyber-grid"></div>

  <!-- CONTENEDOR TIPO CARTA TRANSPARENTE -->
  <div class="chat-container">
    <div class="chat-header">
      <a href="chat.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
      <div class="barber-info">
        <img src="https://i.pravatar.cc/150?img=11" class="barber-avatar" id="barber-avatar">
        <div>
          <div class="barber-name" id="barber-name">Barbería Elite</div>
          <div class="status-container"><div class="status-dot"></div><span class="status-text">En línea</span></div>
        </div>
      </div>
    </div>

    <div class="chat-area" id="chat-area"></div>

    <!-- 🎨 PANEL DE EMOJIS 3D -->
    <div class="emoji-panel" id="emoji-panel">
      <div class="emoji-category-title">💈 Barbería</div>
      <div class="emoji-grid">
        <div class="emoji-item" data-emoji="💈">💈</div><div class="emoji-item" data-emoji="✂️">✂️</div>
        <div class="emoji-item" data-emoji="🪒">🪒</div><div class="emoji-item" data-emoji="🧔">🧔</div>
        <div class="emoji-item" data-emoji="👨‍🦱">👨‍🦱</div><div class="emoji-item" data-emoji="💇‍♂️">💇‍♂️</div>
      </div>
      <div class="emoji-category-title">🔥 Actitud</div>
      <div class="emoji-grid">
        <div class="emoji-item" data-emoji="🔥">🔥</div><div class="emoji-item" data-emoji="😎">😎</div>
        <div class="emoji-item" data-emoji="🤘">🤘</div><div class="emoji-item" data-emoji="💪">💪</div>
        <div class="emoji-item" data-emoji="👊">👊</div><div class="emoji-item" data-emoji="💯">💯</div>
      </div>
      <div class="emoji-category-title">💎 Lujo</div>
      <div class="emoji-grid">
        <div class="emoji-item" data-emoji="💎">💎</div><div class="emoji-item" data-emoji="👑">👑</div>
        <div class="emoji-item" data-emoji="💰">💰</div><div class="emoji-item" data-emoji="🏆">🏆</div>
        <div class="emoji-item" data-emoji="⭐">⭐</div><div class="emoji-item" data-emoji="🚁">🚁</div>
      </div>
      <div class="emoji-category-title">❤️ Emociones</div>
      <div class="emoji-grid">
        <div class="emoji-item" data-emoji="❤️">❤️</div><div class="emoji-item" data-emoji="😂">😂</div>
        <div class="emoji-item" data-emoji="🥺">🥺</div><div class="emoji-item" data-emoji="🤔">🤔</div>
        <div class="emoji-item" data-emoji="🤯">🤯</div><div class="emoji-item" data-emoji="🖤">🖤</div>
      </div>
    </div>

    <div class="input-area">
      <input type="file" id="photo-input" accept="image/*">
      <button class="action-btn photo-btn" id="photo-btn"><i class="fas fa-camera"></i></button>
      <button class="action-btn emoji-btn" id="emoji-btn"><i class="fas fa-smile"></i></button>
      <input type="text" class="chat-input" id="message-input" placeholder="Escribe..." autocomplete="off">
      <button class="action-btn send-btn" id="send-btn"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    let messages = JSON.parse(localStorage.getItem('barberhub_chat_messages')) || [
      { id: 1, type: 'received', text: '¡Hola! Bienvenido a Barbería Elite 💈', time: '10:30', reactions: [] },
      { id: 2, type: 'sent', text: 'Hola, quiero agendar una cita para el viernes', time: '10:32', reactions: [] }
    ];

    function renderMessages() {
      const chatArea = document.getElementById('chat-area');
      chatArea.innerHTML = '';
      
      messages.forEach(msg => {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${msg.type}`;
        wrapper.dataset.id = msg.id;
        
        let optionsHtml = '';
        if (msg.type === 'sent') {
          optionsHtml = `
            <div class="message-options-btn" onclick="toggleOptions(${msg.id}, event)">⋮</div>
            <div class="options-dropdown" id="options-${msg.id}">
              <button onclick="deleteMessage(${msg.id})"><i class="fas fa-trash"></i> Eliminar</button>
            </div>
          `;
        }

        let reactionsHtml = '';
        if (msg.reactions && msg.reactions.length > 0) {
          reactionsHtml = `<div class="message-reactions">
            ${msg.reactions.map(r => `<span class="reaction-badge ${r.active ? 'active' : ''}">${r.emoji}</span>`).join('')}
          </div>`;
        }

        const quickReactions = ['🔥', '❤️', '😂', '👍', '😮'];
        const quickReactionHtml = `
          <div class="quick-reaction-bar" id="quick-react-${msg.id}">
            ${quickReactions.map(e => `<span class="quick-emoji" onclick="addReaction(${msg.id}, '${e}')">${e}</span>`).join('')}
          </div>
        `;

        const content = msg.image ? `<img src="${msg.image}" class="message-image">` : `<div>${msg.text}</div>`;

        wrapper.innerHTML = `
          ${optionsHtml}
          ${quickReactionHtml}
          <div class="message" onclick="toggleQuickReaction(${msg.id})">
            ${content}
            <div class="message-time">${msg.time}</div>
          </div>
          ${reactionsHtml}
        `;
        chatArea.appendChild(wrapper);
      });
      scrollToBottom();
    }

    function saveMessages() {
      localStorage.setItem('barberhub_chat_messages', JSON.stringify(messages));
    }

    function toggleOptions(id, event) {
      event.stopPropagation();
      document.querySelectorAll('.options-dropdown').forEach(el => el.classList.remove('show'));
      const menu = document.getElementById(`options-${id}`);
      if (menu) menu.classList.toggle('show');
    }

    function deleteMessage(id) {
      if(confirm('¿Eliminar este mensaje?')) {
        messages = messages.filter(m => m.id !== id);
        saveMessages();
        renderMessages();
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.message-options-btn') && !e.target.closest('.options-dropdown')) {
        document.querySelectorAll('.options-dropdown').forEach(el => el.classList.remove('show'));
      }
      if (!e.target.closest('.message') && !e.target.closest('.quick-reaction-bar')) {
        document.querySelectorAll('.quick-reaction-bar').forEach(el => el.classList.remove('show'));
      }
    });

    function toggleQuickReaction(id) {
      document.querySelectorAll('.quick-reaction-bar').forEach(el => el.classList.remove('show'));
      const bar = document.getElementById(`quick-react-${id}`);
      if (bar) bar.classList.toggle('show');
    }

    function addReaction(msgId, emoji) {
      const msg = messages.find(m => m.id === msgId);
      if (msg) {
        const exists = msg.reactions.find(r => r.emoji === emoji);
        if (exists) {
          msg.reactions = msg.reactions.filter(r => r.emoji !== emoji);
        } else {
          msg.reactions.push({ emoji: emoji, active: true });
        }
        saveMessages();
        renderMessages();
      }
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;
      
      messages.push({
        id: Date.now(), type: 'sent', text: text,
        time: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }), reactions: []
      });
      saveMessages(); renderMessages();
      input.value = '';
      document.getElementById('emoji-panel').classList.remove('show');
      
      setTimeout(() => {
        messages.push({
          id: Date.now() + 1, type: 'received', text: '¡Recibido! Te confirmo en breve 🔥',
          time: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }), reactions: []
        });
        saveMessages(); renderMessages();
      }, 1500);
    }

    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('message-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    document.getElementById('photo-btn').addEventListener('click', () => document.getElementById('photo-input').click());
    document.getElementById('photo-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          messages.push({
            id: Date.now(), type: 'sent', image: event.target.result,
            time: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }), reactions: []
          });
          saveMessages(); renderMessages();
        };
        reader.readAsDataURL(file);
      }
    });

    const emojiBtn = document.getElementById('emoji-btn');
    const emojiPanel = document.getElementById('emoji-panel');
    const messageInput = document.getElementById('message-input');

    emojiBtn.addEventListener('click', (e) => { e.stopPropagation(); emojiPanel.classList.toggle('show'); });

    document.querySelectorAll('.emoji-item').forEach(item => {
      item.addEventListener('click', () => {
        messageInput.value += item.getAttribute('data-emoji');
        messageInput.focus();
        item.style.transform = 'scale(1.3) rotateZ(10deg)';
        setTimeout(() => item.style.transform = '', 200);
      });
    });

    function scrollToBottom() {
      const chatArea = document.getElementById('chat-area');
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    renderMessages();
  </script>
</body>
</html>

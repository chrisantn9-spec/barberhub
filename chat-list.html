<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat | BarberHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root { 
      --neon-cyan: #00E5EE; --neon-pink: #ff00ff; --neon-green: #00ff41;
      --neon-purple: #bf00ff; --neon-yellow: #fff01f; --neon-orange: #ff6600;
      --dark-bg: #030303;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { 
      font-family: 'Rajdhani', sans-serif; color: #fff; height: 100vh; 
      background: var(--dark-bg); overflow: hidden; display: flex; flex-direction: column;
    }
    
    /* 🌌 FONDO */
    .cyber-bg { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: linear-gradient(135deg, rgba(0,0,0,0.75) 0%, rgba(10,5,20,0.95) 100%), url('./chat.jpeg');
      background-size: cover; background-position: center; background-attachment: fixed; z-index: -3; 
    }
    .cyber-grid { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background-image: linear-gradient(rgba(0, 229, 238, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 238, 0.05) 1px, transparent 1px); 
      background-size: 50px 50px; z-index: -1; pointer-events: none; 
    }

    /* 📱 HEADER */
    .chat-header {
      display: flex; align-items: center; gap: 15px; padding: 15px 20px;
      background: rgba(10, 15, 30, 0.9); backdrop-filter: blur(20px);
      border-bottom: 2px solid rgba(0, 229, 238, 0.4);
      box-shadow: 0 5px 30px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 229, 238, 0.3);
      z-index: 100; position: relative;
    }
    .back-btn {
      width: 45px; height: 45px; background: linear-gradient(145deg, rgba(0, 229, 238, 0.2), rgba(0, 114, 255, 0.2));
      border: 1.5px solid rgba(0, 229, 238, 0.5); border-radius: 12px; color: var(--neon-cyan);
      font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: all 0.2s; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 229, 238, 0.4);
    }
    .back-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); }
    .barber-info { flex: 1; display: flex; align-items: center; gap: 12px; }
    .barber-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--neon-cyan); object-fit: cover; box-shadow: 0 0 20px rgba(0, 229, 238, 0.5); }
    .barber-name { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 700; text-shadow: 0 0 15px rgba(0, 229, 238, 0.6); }
    .status-container { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); animation: pulse-green 2s infinite; }
    @keyframes pulse-green { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); opacity: 0.7; } }
    .status-text { font-size: 0.75rem; color: var(--neon-green); font-weight: 600; }

    /* 💬 ÁREA DE MENSAJES */
    .chat-area {
      flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { width: 6px; }
    .chat-area::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--neon-cyan), var(--neon-pink)); border-radius: 3px; }

    /* MENSAJE INDIVIDUAL CON OPCIONES Y REACCIONES */
    .message-wrapper {
      display: flex; flex-direction: column; max-width: 80%; position: relative;
      animation: messagePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .message-wrapper.sent { align-self: flex-end; align-items: flex-end; }
    .message-wrapper.received { align-self: flex-start; align-items: flex-start; }

    @keyframes messagePop { from { opacity: 0; transform: scale(0.8) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    .message {
      padding: 14px 18px; border-radius: 20px; font-size: 0.95rem; line-height: 1.5; position: relative;
      backdrop-filter: blur(10px); cursor: pointer; transition: transform 0.2s;
    }
    .message:active { transform: scale(0.98); }
    
    .message.received {
      background: linear-gradient(145deg, rgba(255, 0, 255, 0.2), rgba(191, 0, 255, 0.15));
      border: 1.5px solid rgba(255, 0, 255, 0.4); border-bottom-left-radius: 6px;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.4), 0 10px 30px rgba(255, 0, 255, 0.3);
    }
    .message.sent {
      background: linear-gradient(145deg, rgba(0, 229, 238, 0.25), rgba(0, 114, 255, 0.2));
      border: 1.5px solid rgba(0, 229, 238, 0.5); border-bottom-right-radius: 6px;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 229, 238, 0.4);
    }

    .message-image { max-width: 100%; border-radius: 12px; margin-top: 8px; border: 1px solid rgba(255, 255, 255, 0.2); }
    .message-time { font-size: 0.65rem; color: rgba(255, 255, 255, 0.6); margin-top: 6px; text-align: right; font-family: 'Orbitron', sans-serif; }

    /* 🎯 MENÚ DE 3 PUNTITOS (Solo mensajes enviados) */
    .message-options-btn {
      position: absolute; top: -10px; right: 0;
      background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.2rem; line-height: 1; z-index: 10;
      opacity: 0; transition: opacity 0.2s;
    }
    .message-wrapper.sent:hover .message-options-btn, .message-wrapper.sent:active .message-options-btn { opacity: 1; }
    
    .options-dropdown {
      position: absolute; top: 25px; right: 0;
      background: rgba(10, 15, 30, 0.95); border: 1px solid var(--neon-pink);
      border-radius: 10px; padding: 5px; min-width: 120px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(255, 0, 255, 0.3);
      display: none; z-index: 20;
    }
    .options-dropdown.show { display: block; animation: fadeIn 0.2s; }
    .options-dropdown button {
      width: 100%; padding: 10px; background: none; border: none; color: #ff4444;
      font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; border-radius: 6px; text-align: left; display: flex; align-items: center; gap: 8px;
    }
    .options-dropdown button:hover { background: rgba(255, 68, 68, 0.1); }

    /* 💥 REACCIONES EN MENSAJES */
    .message-reactions {
      display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap;
    }
    .reaction-badge {
      background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px; padding: 2px 8px; font-size: 0.9rem;
      display: flex; align-items: center; gap: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    .reaction-badge.active { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 229, 238, 0.4); }

    /* BARRA DE REACCIÓN RÁPIDA (Flotante) */
    .quick-reaction-bar {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      background: rgba(10, 15, 30, 0.95); border: 1px solid var(--neon-yellow);
      border-radius: 20px; padding: 8px 12px; display: none; gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(255, 240, 31, 0.3);
      z-index: 50; margin-bottom: 10px;
    }
    .quick-reaction-bar.show { display: flex; animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popUp { from { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.8); } to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }
    .quick-emoji { font-size: 1.5rem; cursor: pointer; transition: transform 0.2s; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.5)); }
    .quick-emoji:hover { transform: scale(1.4) translateY(-5px); }

    /* ⌨️ ÁREA DE INPUT */
    .input-area {
      padding: 15px 20px; background: rgba(10, 15, 30, 0.95); backdrop-filter: blur(20px);
      border-top: 2px solid rgba(0, 229, 238, 0.4); display: flex; gap: 12px; align-items: center;
      box-shadow: 0 -5px 30px rgba(0, 0, 0, 0.8); position: relative; z-index: 100;
    }
    .chat-input {
      flex: 1; background: rgba(0, 0, 0, 0.5); border: 1.5px solid rgba(0, 229, 238, 0.3);
      border-radius: 25px; padding: 14px 22px; color: #fff; font-family: 'Rajdhani', sans-serif;
      font-size: 1rem; outline: none; transition: all 0.3s;
    }
    .chat-input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 25px rgba(0, 229, 238, 0.3); }
    
    .action-btn {
      width: 48px; height: 48px; border: none; border-radius: 50%; color: #fff; font-size: 1.2rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .emoji-btn { background: linear-gradient(145deg, var(--neon-yellow), var(--neon-orange)); box-shadow: 0 5px 0 rgba(255, 102, 0, 0.6), 0 0 20px rgba(255, 240, 31, 0.5); color: #000; }
    .emoji-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(255, 102, 0, 0.6); }
    .send-btn { background: linear-gradient(145deg, var(--neon-green), #00cc33); box-shadow: 0 5px 0 rgba(0, 204, 51, 0.6), 0 0 20px rgba(0, 255, 65, 0.5); }
    .send-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 204, 51, 0.6); }
    .photo-btn { background: linear-gradient(145deg, var(--neon-cyan), var(--neon-blue)); box-shadow: 0 5px 0 rgba(0, 114, 255, 0.6); }
    .photo-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 114, 255, 0.6); }
    #photo-input { display: none; }

    /* 🎨 PANEL DE EMOJIS 3D NEÓN MASIVO */
    .emoji-panel {
      position: absolute; bottom: 80px; left: 10px; right: 10px;
      background: rgba(10, 15, 30, 0.95); backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 240, 31, 0.4); border-radius: 20px;
      padding: 15px; max-height: 350px; overflow-y: auto; display: none; z-index: 1000;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 240, 31, 0.3);
    }
    .emoji-panel.show { display: block; animation: slideUpEmoji 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes slideUpEmoji { from { opacity: 0; transform: translateY(30px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
    
    .emoji-category-title { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; color: var(--neon-cyan); margin: 15px 0 10px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(0,229,238,0.2); padding-bottom: 5px; }
    .emoji-category-title:first-child { margin-top: 0; }
    
    .emoji-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    
    /* EFECTO 3D REAL PARA EMOJIS */
    .emoji-item {
      font-size: 1.6rem; cursor: pointer; text-align: center; padding: 8px 4px;
      border-radius: 12px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      /* TRUCO 3D: Sombra sólida inferior + brillo */
      filter: drop-shadow(0 3px 0 rgba(0,0,0,0.6)) drop-shadow(0 0 8px rgba(255, 240, 31, 0.4));
    }
    .emoji-item:hover {
      transform: translateY(-6px) scale(1.2) rotateZ(5deg);
      background: rgba(255, 240, 31, 0.15);
      border-color: var(--neon-yellow);
      filter: drop-shadow(0 6px 0 rgba(0,0,0,0.6)) drop-shadow(0 0 15px rgba(255, 240, 31, 0.8));
    }
    .emoji-item:active { transform: translateY(-2px) scale(1.1); filter: drop-shadow(0 2px 0 rgba(0,0,0,0.6)); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @media (max-width: 500px) {
      .message-wrapper { max-width: 85%; }
      .emoji-grid { grid-template-columns: repeat(6, 1fr); }
      .emoji-item { font-size: 1.4rem; }
    }
  "
  </style>
</head>
<body>

    <div class="barber-info">

  <div class="input-area">
    <input type="file" id="photo-input" accept="image/*">
    <button class="action-btn photo-btn" id="photo-btn"><i class="fas fa-camera"></i></button>

    <input type="text" class="chat-input" id="message-input" placeholder="Escribe un mensaje..." autocomplete="off">

  <script src="config.js"></script>
  <script>
    // ==========================================
    // 🧠 ESTADO DE LA APLICACIÓN (Persistencia)
    // ==========================================
    let messages = JSON.parse(localStorage.getItem('barberhub_chat_messages')) || [
      { id: 1, type: 'received', text: '¡Hola! Bienvenido a Barbería Elite 💈', time: '10:30', reactions: [] },
      { id: 2, type: 'sent', text: 'Hola, quiero agendar una cita para el viernes', time: '10:32', reactions: [] }
    ];
    let currentUserId = 'user_123'; // Simulado. En producción: session.user.id

    // ==========================================
    // 🎨 RENDERIZADO DE MENSAJES
    // ==========================================
    function renderMessages() {
      const chatArea = document.getElementById('chat-area');
      chatArea.innerHTML = '';
      
      messages.forEach(msg => {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${msg.type}`;
        wrapper.dataset.id = msg.id;
        
        // Opciones de eliminar (solo para enviados)
        let optionsHtml = '';
        if (msg.type === 'sent') {
          optionsHtml = `
            <div class="message-options-btn" onclick="toggleOptions(${msg.id}, event)">⋮</div>
            <div class="options-dropdown" id="options-${msg.id}">
              <button onclick="deleteMessage(${msg.id})"><i class="fas fa-trash"></i> Eliminar</button>
            </div>
          `;
        }

        // Reacciones
        let reactionsHtml = '';
        if (msg.reactions && msg.reactions.length > 0) {
          reactionsHtml = `<div class="message-reactions">
            ${msg.reactions.map(r => `<span class="reaction-badge ${r.active ? 'active' : ''}">${r.emoji}</span>`).join('')}
          </div>`;
        }

        // Barra de reacción rápida
        const quickReactions = ['🔥', '❤️', '😂', '👍', '😮'];
        const quickReactionHtml = `
          <div class="quick-reaction-bar" id="quick-react-${msg.id}">
            ${quickReactions.map(e => `<span class="quick-emoji" onclick="addReaction(${msg.id}, '${e}')">${e}</span>`).join('')}
          </div>
        `;

        const content = msg.image ? `<img src="${msg.image}" class="message-image">` : `<div>${msg.text}</div>`;

        wrapper.innerHTML = `
          ${optionsHtml}
          ${quickReactionHtml}
          <div class="message" onclick="toggleQuickReaction(${msg.id})">
            ${content}
            <div class="message-time">${msg.time}</div>
          </div>
          ${reactionsHtml}
        `;
        chatArea.appendChild(wrapper);
      });
      
      scrollToBottom();
    }

    function saveMessages() {
      localStorage.setItem('barberhub_chat_messages', JSON.stringify(messages));
      // 🚀 AQUÍ IRÍA LA SINCRONIZACIÓN CON SUPABASE:
      // supabaseClient.from('messages').upsert({ id: msg.id, text: msg.text, ... })
    }

    // ==========================================
    // 🗑️ ELIMINAR MENSAJES
    // ==========================================
    function toggleOptions(id, event) {
      event.stopPropagation();
      document.querySelectorAll('.options-dropdown').forEach(el => el.classList.remove('show'));
      const menu = document.getElementById(`options-${id}`);
      if (menu) menu.classList.toggle('show');
    }

    function deleteMessage(id) {
      if(confirm('¿Eliminar este mensaje?')) {
        messages = messages.filter(m => m.id !== id);
        saveMessages();
        renderMessages();
      }
    }

    // Cerrar menús al hacer clic fuera
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.message-options-btn') && !e.target.closest('.options-dropdown')) {
        document.querySelectorAll('.options-dropdown').forEach(el => el.classList.remove('show'));
      }
      if (!e.target.closest('.message') && !e.target.closest('.quick-reaction-bar')) {
        document.querySelectorAll('.quick-reaction-bar').forEach(el => el.classList.remove('show'));
      }
    });

    // ==========================================
    // 💥 REACCIONES A MENSAJES
    // ==========================================
    function toggleQuickReaction(id) {
      document.querySelectorAll('.quick-reaction-bar').forEach(el => el.classList.remove('show'));
      const bar = document.getElementById(`quick-react-${id}`);
      if (bar) bar.classList.toggle('show');
    }

    function addReaction(msgId, emoji) {
      const msg = messages.find(m => m.id === msgId);
      if (msg) {
        // Si ya tiene esa reacción, la quita (toggle), si no, la agrega
        const exists = msg.reactions.find(r => r.emoji === emoji);
        if (exists) {
          msg.reactions = msg.reactions.filter(r => r.emoji !== emoji);
        } else {
          msg.reactions.push({ emoji: emoji, active: true });
        }
        saveMessages();
        renderMessages();
      }
    }

    // ==========================================
    // 📝 ENVIAR MENSAJES Y FOTOS
    // ==========================================
    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;
      
      const newMsg = {
        id: Date.now(),
        type: 'sent',
        text: text,
        time: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
        reactions: []
      };
      
      messages.push(newMsg);
      saveMessages();
      renderMessages();
      input.value = '';
      document.getElementById('emoji-panel').classList.remove('show');
      
      // Simular respuesta
      setTimeout(() => {
        messages.push({
          id: Date.now() + 1,
          type: 'received',
          text: '¡Recibido! Te confirmo en breve 🔥',
          time: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
          reactions: []
        });
        saveMessages();
        renderMessages();
      }, 1500);
    }

    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('message-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Fotos
    document.getElementById('photo-btn').addEventListener('click', () => document.getElementById('photo-input').click());
    document.getElementById('photo-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          messages.push({
            id: Date.now(),
            type: 'sent',
            image: event.target.result,
            time: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
            reactions: []
          });
          saveMessages();
          renderMessages();
        };
        reader.readAsDataURL(file);
      }
    });

    // ==========================================
    // 🎨 LÓGICA DEL PANEL DE EMOJIS
    // ==========================================
    const emojiBtn = document.getElementById('emoji-btn');
    const emojiPanel = document.getElementById('emoji-panel');
    const messageInput = document.getElementById('message-input');

    emojiBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      emojiPanel.classList.toggle('show');
    });

    document.querySelectorAll('.emoji-item').forEach(item => {
      item.addEventListener('click', () => {
        messageInput.value += item.getAttribute('data-emoji');
        messageInput.focus();
        // Efecto visual 3D al tocar
        item.style.transform = 'scale(1.4) rotateZ(15deg)';
        setTimeout(() => item.style.transform = '', 200);
      });
    });

    function scrollToBottom() {
      const chatArea = document.getElementById('chat-area');
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // Inicializar
    renderMessages();
  </script>
</body>
</html>
